name: Web to APK Build

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'Website URL'
        required: true
        type: string
      app_name:
        description: 'App Name'
        required: true
        type: string
      icon_url:
        description: 'Icon URL'
        required: true
        type: string
      release_tag:
        description: 'Release Tag (contoh: v1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Create Flutter Web App
        run: |
          flutter create --platforms=android,web --org com.web2apk web2apk_app
          cd web2apk_app
          
          flutter pub add webview_flutter
          flutter pub add http
          flutter pub add path_provider
          
          cat > lib/main.dart << 'EOL'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          
          void main() => runApp(MyApp());
          
          class MyApp extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: '${{ inputs.app_name }}',
                theme: ThemeData(primarySwatch: Colors.blue),
                home: WebViewApp(),
              );
            }
          }
          
          class WebViewApp extends StatefulWidget {
            @override
            _WebViewAppState createState() => _WebViewAppState();
          }
          
          class _WebViewAppState extends State<WebViewApp> {
            late final WebViewController controller;
            
            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0x00000000))
                ..loadRequest(Uri.parse('${{ inputs.web_url }}'));
            }
            
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text('${{ inputs.app_name }}'),
                  backgroundColor: Colors.blue,
                  foregroundColor: Colors.white,
                ),
                body: WebViewWidget(controller: controller),
              );
            }
          }
          EOL

      - name: Download Icon
        run: |
          cd web2apk_app
          mkdir -p assets
          curl -L -o assets/icon.png "${{ inputs.icon_url }}"
          
          echo "" >> pubspec.yaml
          echo "flutter:" >> pubspec.yaml
          echo "  assets:" >> pubspec.yaml
          echo "    - assets/icon.png" >> pubspec.yaml

      - name: Build APK
        run: |
          cd web2apk_app
          flutter build apk --release

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            web2apk_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: web2apk-apk
          path: web2apk_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
