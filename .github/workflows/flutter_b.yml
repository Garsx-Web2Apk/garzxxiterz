name: 🚀 GARSX Flutter Build Engine

# ============================================================
# 1. TRIGGER (Manual dari Bot)
# ============================================================
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: '📦 URL Download ZIP Project'
        required: true
        type: string
      tag:
        description: '🏷️ Tag Build'
        required: true
        type: string
      build_type:
        description: '📱 Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
      only_analyze:
        description: '🔍 Only Analyze (true/false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

# ============================================================
# 2. PERMISSIONS
# ============================================================
permissions:
  contents: read

# ============================================================
# 3. ENVIRONMENT
# ============================================================
env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.22.0'
  GRADLE_OPTS: '-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g'
  NODE_VERSION: '18'

# ============================================================
# 4. JOB: BUILD APK
# ============================================================
jobs:
  build:
    name: 🛠️ Build APK (${{ github.event.inputs.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # STEP 1: CHECKOUT REPOSITORY
      # ============================================================
      - name: "01 - 📥 Checkout Repository"
        uses: actions/checkout@v4

      # ============================================================
      # STEP 2: FREE DISK SPACE
      # ============================================================
      - name: "02 - 🧹 Free Disk Space"
        run: |
          sudo apt clean
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      # ============================================================
      # STEP 3: UPDATE SYSTEM
      # ============================================================
      - name: "03 - 🔧 Update System"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget unzip zip \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev \
            xz-utils

      # ============================================================
      # STEP 4: SETUP JAVA
      # ============================================================
      - name: "04 - ☕ Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      # ============================================================
      # STEP 5: SETUP FLUTTER
      # ============================================================
      - name: "05 - 🐦 Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # ============================================================
      # STEP 6: VERIFY FLUTTER
      # ============================================================
      - name: "06 - ✅ Verify Flutter"
        run: |
          flutter --version
          dart --version

      # ============================================================
      # STEP 7: SETUP ANDROID SDK
      # ============================================================
      - name: "07 - 📱 Setup Android SDK"
        uses: android-actions/setup-android@v3

      # ============================================================
      # STEP 8: INSTALL ANDROID SDK
      # ============================================================
      - name: "08 - 📱 Install Android SDK"
        run: |
          echo "📱 Installing Android SDK..."
          sdkmanager "platform-tools" > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" > /dev/null 2>&1 || true
          yes | sdkmanager --licenses || true
          echo "✅ Android SDK installed"

      # ============================================================
      # STEP 9: CONFIGURE FLUTTER
      # ============================================================
      - name: "09 - ⚙️ Configure Flutter"
        run: |
          flutter config --enable-android
          flutter config --no-enable-web
          flutter config --no-enable-ios

      # ============================================================
      # STEP 10: FLUTTER DOCTOR
      # ============================================================
      - name: "10 - 🩺 Flutter Doctor"
        run: |
          flutter doctor -v

      # ============================================================
      # STEP 11: DOWNLOAD PROJECT ZIP
      # ============================================================
      - name: "11 - 📦 Download Project"
        run: |
          echo "========================================="
          echo "📥 DOWNLOADING PROJECT..."
          echo "========================================="
          echo "URL: ${{ github.event.inputs.zip_url }}"
          echo "Tag: ${{ github.event.inputs.tag }}"
          echo "Type: ${{ github.event.inputs.build_type }}"
          echo "========================================="
          
          curl -L -o project.zip "${{ github.event.inputs.zip_url }}"
          
          if [ ! -f project.zip ]; then
            echo "❌ Download failed!"
            exit 1
          fi
          
          echo "📏 File size:"
          ls -lh project.zip

      # ============================================================
      # STEP 12: VALIDATE ZIP
      # ============================================================
      - name: "12 - 🔍 Validate ZIP"
        run: |
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ ZIP corrupt atau tidak valid!"
            exit 1
          fi
          echo "✅ ZIP valid"

      # ============================================================
      # STEP 13: EXTRACT ZIP
      # ============================================================
      - name: "13 - 📂 Extract Project"
        run: |
          rm -rf project_raw
          mkdir -p project_raw
          unzip -q project.zip -d project_raw
          
          echo "✅ Extract selesai"
          echo ""
          echo "📁 Project files:"
          ls -la project_raw/

      # ============================================================
      # STEP 14: DETECT PROJECT ROOT
      # ============================================================
      - name: "14 - 🔎 Detect Project Root"
        run: |
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "📂 Project root: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      # ============================================================
      # STEP 15: VALIDATE FLUTTER PROJECT
      # ============================================================
      - name: "15 - ✅ Validate Flutter Project"
        run: |
          cd "$PROJECT_DIR"
          
          if [ ! -f "pubspec.yaml" ]; then
            echo "❌ pubspec.yaml tidak ditemukan!"
            exit 1
          fi
          
          if [ ! -d "lib" ]; then
            echo "❌ Folder lib tidak ditemukan!"
            exit 1
          fi
          
          echo "✅ pubspec.yaml ditemukan"
          echo "✅ lib/ ditemukan"
          
          echo ""
          echo "📄 pubspec.yaml:"
          head -20 pubspec.yaml

      # ============================================================
      # STEP 16: FLUTTER CLEAN
      # ============================================================
      - name: "16 - 🧹 Flutter Clean"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean || true
          rm -rf build .dart_tool
          echo "✅ Clean selesai"

      # ============================================================
      # STEP 17: GET DEPENDENCIES (DENGAN RETRY)
      # ============================================================
      - name: "17 - 📦 Get Dependencies (Retry 3x)"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          for i in {1..3}; do
            echo "🔄 Attempt $i..."
            flutter pub get && break
            echo "⏳ Retry $i ..."
            sleep 5
          done
          echo "✅ Dependencies installed"

      # ============================================================
      # STEP 18: FLUTTER ANALYZE
      # ============================================================
      - name: "18 - 🔍 Flutter Analyze"
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos || echo "⚠️ Ada warning, tapi build tetap lanjut"

      # ============================================================
      # STEP 19: STOP IF ONLY ANALYZE
      # ============================================================
      - name: "19 - 🛑 Stop if Only Analyze"
        if: github.event.inputs.only_analyze == 'true'
        run: |
          echo "✅ Analyze only mode, stopping..."
          exit 0

      # ============================================================
      # STEP 20: BUILD APK
      # ============================================================
      - name: "20 - 🔨 Build APK"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========================================="
          echo "🔨 BUILDING APK..."
          echo "========================================="
          echo "📱 Type: ${{ github.event.inputs.build_type }}"
          echo "⏳ Mohon tunggu 3-8 menit..."
          echo "========================================="
          
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi
          
          echo "✅ Build selesai"

      # ============================================================
      # STEP 21: FIND APK
      # ============================================================
      - name: "21 - 🔎 Find APK"
        run: |
          APK_PATH=$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" -name "*.apk" -type f 2>/dev/null | head -1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan!"
            echo ""
            echo "🔍 Mencari di semua lokasi:"
            find "$PROJECT_DIR/build" -name "*.apk" -type f 2>/dev/null || echo "Tidak ada APK"
            exit 1
          fi
          
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "✅ APK ditemukan:"
          ls -lh "$APK_PATH"
          
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "📦 Size: $APK_SIZE"

      # ============================================================
      # STEP 22: VERIFY APK
      # ============================================================
      - name: "22 - ✅ Verify APK"
        run: |
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan!"
            exit 1
          fi
          
          APK_SIZE_BYTES=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null)
          
          if [ -z "$APK_SIZE_BYTES" ] || [ "$APK_SIZE_BYTES" -le 0 ]; then
            echo "❌ APK kosong atau tidak valid!"
            exit 1
          fi
          
          echo "✅ APK valid"
          echo "📦 Size: $((APK_SIZE_BYTES/1024/1024)) MB"

      # ============================================================
      # STEP 23: PREPARE ARTIFACT
      # ============================================================
      - name: "23 - 📱 Prepare Artifact"
        run: |
          mkdir -p output
          cp "$APK_PATH" "output/GARSX-APP.apk"
          
          echo "✅ APK siap di-upload"
          ls -lh output/GARSX-APP.apk
          
          # Buat checksum
          sha256sum "output/GARSX-APP.apk" > "output/GARSX-APP.apk.sha256"

      # ============================================================
      # STEP 24: UPLOAD ARTIFACT
      # ============================================================
      - name: "24 - 📤 Upload APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-APK-${{ github.event.inputs.tag }}
          path: |
            output/GARSX-APP.apk
            output/GARSX-APP.apk.sha256
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # STEP 25: SUCCESS MESSAGE
      # ============================================================
      - name: "25 - 🎉 Build Success"
        if: success()
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════╗"
          echo "║           ✅ BUILD BERHASIL!              ║"
          echo "║            GARSX BUILD ENGINE             ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""
          echo "📦 Tag     : ${{ github.event.inputs.tag }}"
          echo "📱 Build   : ${{ github.event.inputs.build_type }}"
          echo "📦 Size    : $(du -h output/GARSX-APP.apk | cut -f1)"
          echo "🔗 Artifact: GARSX-APK-${{ github.event.inputs.tag }}"
          echo ""
          echo "📥 Download dari Artifacts tab"

      # ============================================================
      # STEP 26: FAILURE HANDLING
      # ============================================================
      - name: "26 - ❌ Build Failed"
        if: failure()
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════╗"
          echo "║           ❌ BUILD GAGAL!                ║"
          echo "║            GARSX BUILD ENGINE             ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""
          echo "🔍 Periksa log di atas untuk detail error."
          echo ""
          echo "📌 Tips troubleshooting:"
          echo "1. Pastikan ZIP berisi project Flutter lengkap"
          echo "2. Cek pubspec.yaml tidak ada error"
          echo "3. Pastikan android/ folder ada"
          echo "4. Coba build lokal dulu"

      # ============================================================
      # STEP 27: CLEANUP
      # ============================================================
      - name: "27 - 🧹 Cleanup"
        if: always()
        continue-on-error: true
        run: |
          echo "🧹 Cleaning up..."
          rm -rf project_raw
          rm -rf project.zip
          rm -rf ~/.pub-cache 2>/dev/null || true
          rm -rf ~/.gradle 2>/dev/null || true
          echo "✅ Cleanup completed"
