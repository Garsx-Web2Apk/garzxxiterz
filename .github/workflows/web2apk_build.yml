name: GARSX Web2APK Build Engine

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "Website URL"
        required: true
        type: string

      app_name:
        description: "Application name"
        required: true
        type: string

      tag:
        description: "Build tag"
        required: true
        type: string

      build_mode:
        description: "Build mode"
        required: true
        type: choice
        options:
          - debug
          - release
        default: release

      icon_url:
        description: "Icon URL"
        required: false
        type: string
        default: ""

      only_analyze:
        description: "Analyze only"
        required: false
        type: string
        default: "false"

permissions:
  contents: read

concurrency:
  group: garsx-web2apk-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Web2APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # 2. JAVA
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ==========================================================
      # 3. ANDROID SDK
      # ==========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sdkmanager --licenses <<< "y" || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==========================================================
      # 4. CREATE ANDROID PROJECT
      # ==========================================================
      - name: Create WebView Android project
        shell: bash
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          WEB_URL: ${{ github.event.inputs.web_url }}
        run: |
          set -e

          mkdir -p web2apk/app/src/main/java/com/garsx/web2apk
          mkdir -p web2apk/app/src/main/res/layout
          mkdir -p web2apk/app/src/main/res/drawable
          mkdir -p web2apk/app/src/main/res/mipmap-hdpi
          mkdir -p web2apk/app/src/main/res/mipmap-mdpi
          mkdir -p web2apk/app/src/main/res/mipmap-xhdpi
          mkdir -p web2apk/app/src/main/res/mipmap-xxhdpi
          mkdir -p web2apk/app/src/main/res/mipmap-xxxhdpi

          cat > web2apk/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GARSXWeb2APK"
          include(":app")
          EOF

          cat > web2apk/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > web2apk/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > web2apk/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.garsx.web2apk'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.garsx.web2apk'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > web2apk/app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="${APP_NAME}"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          mkdir -p web2apk/app/src/main/res/values

          cat > web2apk/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                     parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#000000</item>
              </style>
          </resources>
          EOF

          cat > web2apk/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <FrameLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <ProgressBar
                  android:id="@+id/progress"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center" />

          </FrameLayout>
          EOF

          cat > web2apk/app/src/main/java/com/garsx/web2apk/MainActivity.java <<EOF
          package com.garsx.web2apk;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;

          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private ProgressBar progress;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webview);
                  progress = findViewById(R.id.progress);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          if (newProgress >= 100) {
                              progress.setVisibility(View.GONE);
                          } else {
                              progress.setVisibility(View.VISIBLE);
                          }
                      }
                  });

                  webView.loadUrl("${WEB_URL}");

                  getOnBackPressedDispatcher().addCallback(
                      this,
                      new OnBackPressedCallback(true) {
                          @Override
                          public void handleOnBackPressed() {
                              if (webView.canGoBack()) {
                                  webView.goBack();
                              } else {
                                  finish();
                              }
                          }
                      }
                  );
              }
          }
          EOF

      # ==========================================================
      # 5. DOWNLOAD ICON
      # ==========================================================
      - name: Download application icon
        if: ${{ github.event.inputs.icon_url != '' }}
        shell: bash
        env:
          ICON_URL: ${{ github.event.inputs.icon_url }}
        run: |
          set +e

          curl -L \
            --fail \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 120 \
            "$ICON_URL" \
            -o web2apk/app/src/main/res/drawable/garsx_icon.png

          if [ -s web2apk/app/src/main/res/drawable/garsx_icon.png ]; then
            echo "Icon downloaded."
          else
            echo "::warning::Icon gagal di-download. Menggunakan default Android icon."
            rm -f web2apk/app/src/main/res/drawable/garsx_icon.png
          fi

      # ==========================================================
      # 6. GRADLE
      # ==========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ==========================================================
      # 7. BUILD
      # ==========================================================
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_mode == 'debug' }}
        working-directory: web2apk
        shell: bash
        run: |
          set -e

          gradle assembleDebug --no-daemon

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/output/GARSX-Web2APK-debug.apk"

      - name: Build Release APK
        if: ${{ github.event.inputs.build_mode == 'release' }}
        working-directory: web2apk
        shell: bash
        run: |
          set -e

          gradle assembleRelease --no-daemon

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/output/GARSX-Web2APK-release.apk"

      # ==========================================================
      # 8. VERIFY
      # ==========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find "$GITHUB_WORKSPACE/output" -name '*.apk' -type f | head -1)"

          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi

          test -s "$APK"

          file "$APK"
          ls -lh "$APK"

      # ==========================================================
      # 9. PACKAGE
      # ==========================================================
      - name: Package Web2APK
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/output"

          zip -9 "GARSX-Web2APK-${{ github.event.inputs.tag }}.zip" \
            *.apk

      # ==========================================================
      # 10. ARTIFACT
      # ==========================================================
      - name: Upload Web2APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-Web2APK-${{ github.event.inputs.tag }}
          path: |
            output/*.apk
            output/*.zip
          if-no-files-found: error
          retention-days: 7

      # ==========================================================
      # 11. SUMMARY
      # ==========================================================
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "          GARSX WEB2APK"
          echo "=========================================="
          echo "URL  : ${{ github.event.inputs.web_url }}"
          echo "Name : ${{ github.event.inputs.app_name }}"
          echo "Mode : ${{ github.event.inputs.build_mode }}"
          echo "Tag  : ${{ github.event.inputs.tag }}"
          echo "=========================================="

          ls -lh output 2>/dev/null || true
