name: GARSX Web2APK Build Engine

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "Website URL"
        required: true
        type: string
      app_name:
        description: "Application name"
        required: true
        type: string
      tag:
        description: "Build tag"
        required: true
        type: string
      build_mode:
        description: "Build mode"
        required: true
        type: choice
        options:
          - debug
          - release
        default: release
      icon_url:
        description: "Optional icon URL"
        required: false
        type: string
        default: ""
      only_analyze:
        description: "Only validate"
        required: false
        type: string
        default: "false"

permissions:
  contents: read

jobs:
  build:
    name: Web2APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      WEB_URL: ${{ inputs.web_url }}
      APP_NAME: ${{ inputs.app_name }}
      BUILD_TAG: ${{ inputs.tag }}
      BUILD_MODE: ${{ inputs.build_mode }}
      ICON_URL: ${{ inputs.icon_url }}

    steps:
      - name: "1. Checkout Repository"
        uses: actions/checkout@v5

      - name: "2. Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "2. Setup Android SDK"
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest" || true

      - name: "3. Create WebView Android Project"
        shell: bash
        run: |
          set -euo pipefail

          rm -rf web2apk
          mkdir -p web2apk

          cat > web2apk/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GARSXWeb2APK"
          include(":app")
          EOF

          cat > web2apk/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          mkdir -p web2apk/app/src/main/java/com/garsx/web2apk

          cat > web2apk/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.garsx.web2apk'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.garsx.web2apk'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF

          cat > web2apk/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > web2apk/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:theme="@style/AppTheme"
                  android:label="GARSX Web2APK"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p web2apk/app/src/main/res/values
          cat > web2apk/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#2196F3</item>
              </style>
          </resources>
          EOF

          cat > web2apk/app/src/main/java/com/garsx/web2apk/MainActivity.java <<'EOF'
          package com.garsx.web2apk;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return false;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl(System.getenv("GARSX_WEB_URL") == null
                          ? "https://example.com"
                          : System.getenv("GARSX_WEB_URL"));
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # Replace the URL directly in the generated Java source.
          sed -i "s#https://example.com#${WEB_URL//\//\\/}#g" \
            web2apk/app/src/main/java/com/garsx/web2apk/MainActivity.java

          # Generate Gradle wrapper using the runner's installed Gradle if available.
          if command -v gradle >/dev/null 2>&1; then
            cd web2apk
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew
          else
            echo "::error::Gradle command tidak tersedia di runner."
            exit 1
          fi

      - name: "3. Validate Web URL"
        shell: bash
        run: |
          set -euo pipefail
          case "$WEB_URL" in
            http://*|https://*) ;;
            *) echo "::error::URL harus dimulai http:// atau https://"; exit 1 ;;
          esac

      - name: "4. Compiling Sources"
        working-directory: web2apk
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugJavaWithJavac --stacktrace --no-daemon

      - name: "5. Gradle Assemble APK"
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: web2apk
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD_MODE" = "debug" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            ./gradlew :app:assembleRelease --stacktrace --no-daemon
          fi

      - name: "6. Signing & Packaging"
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: web2apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final_apk

          if [ "$BUILD_MODE" = "debug" ]; then
            APK="app/build/outputs/apk/debug/app-debug.apk"
          else
            APK="app/build/outputs/apk/release/app-release.apk"
          fi

          test -f "$APK"
          OUT="GARSX-Web2APK-${BUILD_MODE}-${BUILD_TAG}.apk"
          cp "$APK" "final_apk/$OUT"

          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "final_apk/$OUT" || true
          fi

      - name: "7. Finalizing Build"
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: web2apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find final_apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          sha256sum "$APK" | tee final_apk/SHA256SUMS.txt
          echo "APK_READY=$APK" >> "$GITHUB_ENV"

      - name: "8. Upload APK Artifact"
        if: ${{ success() && inputs.only_analyze != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-Web2APK-${{ inputs.build_mode }}-${{ inputs.tag }}
          path: |
            web2apk/final_apk/*.apk
            web2apk/final_apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: "8. Build Success"
        if: ${{ success() && inputs.only_analyze != 'true' }}
        run: |
          echo "=============================================="
          echo "         GARSX WEB2APK BUILD SUCCESS"
          echo "=============================================="
          echo "URL  : $WEB_URL"
          echo "Name : $APP_NAME"
          echo "Mode : $BUILD_MODE"
          echo "APK  : $APK_READY"
          echo "=============================================="

      - name: "BUILD ERROR LOG"
        if: ${{ failure() }}
        working-directory: web2apk
        shell: bash
        run: |
          echo "=============================================="
          echo "          GARSX WEB2APK BUILD FAILED"
          echo "=============================================="
          echo "URL : $WEB_URL"
          echo "Mode: $BUILD_MODE"
          find app/build -type f -name '*.apk' -print 2>/dev/null || true
          echo "=============================================="
