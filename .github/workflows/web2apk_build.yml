name: Web to APK Builder Complete with Error Log

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Website URL to convert'
        required: true
        type: string
        default: 'https://example.com'
      
      app_name:
        description: 'Application Name'
        required: true
        type: string
        default: 'MyWebApp'
      
      app_short_name:
        description: 'Short Name (max 12 chars)'
        required: false
        type: string
        default: 'WebApp'
      
      package_name:
        description: 'Package Name (com.example.app)'
        required: true
        type: string
        default: 'com.example.webapp'
      
      version_code:
        description: 'Version Code'
        required: false
        type: number
        default: 1
      
      version_name:
        description: 'Version Name'
        required: false
        type: string
        default: '1.0.0'
      
      orientation:
        description: 'Screen Orientation'
        required: false
        type: choice
        options:
          - portrait
          - landscape
          - default
        default: 'portrait'
      
      enable_navigation:
        description: 'Enable Navigation Controls'
        required: false
        type: boolean
        default: true
      
      theme_color:
        description: 'Theme Color (HEX)'
        required: false
        type: string
        default: '#2196F3'
      
      background_color:
        description: 'Background Color (HEX)'
        required: false
        type: string
        default: '#FFFFFF'

jobs:
  # ============================================
  # JOB 1: BUILD WEBVIEW APK
  # ============================================
  build-webview-apk:
    name: Build WebView APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    # 1️⃣ SETUP ENVIRONMENT
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: |
          platform-tools
          build-tools;34.0.0
          platforms;android-34
    
    # 2️⃣ INSTALL TOOLS
    - name: Install Required Tools
      id: install_tools
      run: |
        npm install -g nativefier
        npm install -g pwa2apk
        sudo apt-get update
        sudo apt-get install -y \
          zipalign \
          apksigner \
          imagemagick \
          webp 2>&1 | tee install.log
    
    # 3️⃣ CREATE WORKSPACE
    - name: Create Workspace
      run: |
        mkdir -p workspace
        mkdir -p workspace/icons
        mkdir -p workspace/output
    
    # 4️⃣ GENERATE ICON
    - name: Generate App Icon
      id: generate_icon
      run: |
        cd workspace
        # Create default icon if website doesn't have one
        convert -size 512x512 xc:${{ github.event.inputs.theme_color }} \
          -gravity center -pointsize 120 -fill white \
          -annotate 0 "${{ github.event.inputs.app_short_name }}" \
          icons/icon.png
        
        # Generate all sizes
        for size in 192 144 96 72 48; do
          convert icons/icon.png -resize ${size}x${size} icons/icon_${size}.png
        done 2>&1 | tee icon_generate.log
    
    # 5️⃣ BUILD USING NATIVEFIER
    - name: Build with Nativefier
      id: build_webview
      run: |
        nativefier \
          --name "${{ github.event.inputs.app_name }}" \
          --android \
          --package "${{ github.event.inputs.package_name }}" \
          --version "${{ github.event.inputs.version_name }}" \
          --version-code "${{ github.event.inputs.version_code }}" \
          --orientation "${{ github.event.inputs.orientation }}" \
          --icon ./workspace/icons/icon.png \
          --android-theme-color "${{ github.event.inputs.theme_color }}" \
          --android-background-color "${{ github.event.inputs.background_color }}" \
          --show-menu-bar false \
          --disable-dev-tools false \
          --inject ./inject.js \
          "${{ github.event.inputs.website_url }}" \
          ./workspace/output/ 2>&1 | tee nativefier_build.log
    
    # 6️⃣ CUSTOMIZE WEBVIEW
    - name: Customize WebView Settings
      id: customize_webview
      run: |
        cd workspace/output/
        # Add JavaScript injection for better WebView
        cat > inject.js << 'EOF'
        // Custom JavaScript injection
        document.addEventListener('DOMContentLoaded', function() {
          console.log('WebView loaded successfully');
          
          // Add custom CSS if needed
          const style = document.createElement('style');
          style.textContent = `
            body { 
              margin: 0;
              padding: 0;
              background: ${{ github.event.inputs.background_color }};
            }
          `;
          document.head.appendChild(style);
        });
        EOF
    
    # 7️⃣ ENABLE FULLSCREEN
    - name: Enable Fullscreen Mode
      run: |
        cd workspace/output/
        # Modify AndroidManifest.xml
        find . -name "AndroidManifest.xml" -exec sed -i \
          's/<application/<application android:theme="@android:style\/Theme.NoTitleBar.Fullscreen"/' {} \;
    
    # 8️⃣ ADD NAVIGATION CONTROLS
    - name: Add Navigation Controls
      if: github.event.inputs.enable_navigation == 'true'
      run: |
        cd workspace/output/
        # Add back/forward/refresh buttons
        cat >> res/layout/activity_main.xml << 'EOF'
        <LinearLayout
            xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical">
            
            <WebView
                android:id="@+id/webview"
                android:layout_width="match_parent"
                android:layout_height="0dp"
                android:layout_weight="1"/>
            
            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:gravity="center">
                
                <Button
                    android:id="@+id/btn_back"
                    android:text="◀"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"/>
                
                <Button
                    android:id="@+id/btn_refresh"
                    android:text="⟳"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"/>
                
                <Button
                    android:id="@+id/btn_forward"
                    android:text="▶"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"/>
            </LinearLayout>
        </LinearLayout>
        EOF
    
    # 9️⃣ SIGN APK
    - name: Generate Keystore
      id: generate_keystore
      run: |
        keytool -genkey -v \
          -keystore workspace/release.keystore \
          -alias ${{ secrets.KEY_ALIAS }} \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
          -keypass ${{ secrets.KEY_PASSWORD }} \
          -dname "CN=${{ github.event.inputs.app_name }}, OU=Dev, O=${{ github.repository_owner }}, L=City, S=State, C=ID" 2>&1 | tee keystore.log
    
    - name: Sign APK
      id: sign_apk
      run: |
        cd workspace/output/
        
        # Find unsigned APK
        UNSIGNED_APK=$(find . -name "*.apk" ! -name "*signed*" | head -1)
        
        # Sign with jarsigner
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore ../release.keystore \
          -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
          -keypass ${{ secrets.KEY_PASSWORD }} \
          $UNSIGNED_APK ${{ secrets.KEY_ALIAS }} 2>&1 | tee sign.log
        
        # Zipalign
        zipalign -v -p 4 $UNSIGNED_APK "${{ github.event.inputs.app_name }}-signed.apk" 2>&1 | tee zipalign.log
        
        # Verify signature
        apksigner verify "${{ github.event.inputs.app_name }}-signed.apk" 2>&1 | tee verify.log
    
    # 🔟 OPTIMIZE APK
    - name: Optimize APK
      run: |
        cd workspace/output/
        # Compress images in APK
        zip -d "${{ github.event.inputs.app_name }}-signed.apk" "*.png" 2>&1 | tee optimize.log
        # Add optimized WebP
        for png in $(find . -name "*.png"); do
          webp -q 80 $png ${png%.png}.webp 2>&1 | tee -a optimize.log
        done
    
    # 1️⃣1️⃣ GENERATE METADATA
    - name: Generate App Metadata
      run: |
        cd workspace/output/
        cat > app_info.txt << EOF
        ========================================
        📱 Web to APK Build Information
        ========================================
        App Name: ${{ github.event.inputs.app_name }}
        Package: ${{ github.event.inputs.package_name }}
        Version: ${{ github.event.inputs.version_name }} (${{ github.event.inputs.version_code }})
        Website: ${{ github.event.inputs.website_url }}
        Orientation: ${{ github.event.inputs.orientation }}
        Theme Color: ${{ github.event.inputs.theme_color }}
        Build Date: $(date '+%Y-%m-%d %H:%M:%S')
        Build Number: ${{ github.run_number }}
        Status: ✅ SUCCESS
        ========================================
        EOF
    
    # 1️⃣2️⃣ UPLOAD SUCCESS ARTIFACTS
    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: webapp-${{ github.event.inputs.app_name }}-v${{ github.event.inputs.version_name }}
        path: |
          workspace/output/*.apk
          workspace/output/app_info.txt
          workspace/output/inject.js
        retention-days: 30
      if: success()
    
    # ============================================
    # 🔥 ERROR HANDLING & NOTIFICATION
    # ============================================
    
    # 1️⃣3️⃣ SAVE ERROR LOGS
    - name: Save Error Logs
      if: failure()
      run: |
        mkdir -p error_logs_web
        
        # Save all logs
        find . -name "*.log" -exec cp {} error_logs_web/ \;
        
        # Save npm logs
        if [ -d ~/.npm/_logs ]; then
          cp -r ~/.npm/_logs/* error_logs_web/ 2>/dev/null || true
        fi
        
        # Save environment info
        echo "=== SYSTEM INFO ===" > error_logs_web/system_info.txt
        node --version >> error_logs_web/system_info.txt
        npm --version >> error_logs_web/system_info.txt
        java -version >> error_logs_web/system_info.txt 2>&1
        echo "=== ANDROID SDK ===" >> error_logs_web/system_info.txt
        android list sdk --all 2>&1 | head -20 >> error_logs_web/system_info.txt
        
        # Create error summary
        echo "❌ WEBVIEW BUILD FAILED" > error_logs_web/ERROR_SUMMARY.txt
        echo "Timestamp: $(date '+%Y-%m-%d %H:%M:%S')" >> error_logs_web/ERROR_SUMMARY.txt
        echo "App: ${{ github.event.inputs.app_name }}" >> error_logs_web/ERROR_SUMMARY.txt
        echo "Website: ${{ github.event.inputs.website_url }}" >> error_logs_web/ERROR_SUMMARY.txt
        echo "" >> error_logs_web/ERROR_SUMMARY.txt
        echo "LAST 50 LINES OF NATIVEFIER BUILD:" >> error_logs_web/ERROR_SUMMARY.txt
        if [ -f nativefier_build.log ]; then
          tail -50 nativefier_build.log >> error_logs_web/ERROR_SUMMARY.txt
        else
          echo "No nativefier log found" >> error_logs_web/ERROR_SUMMARY.txt
        fi
    
    # 1️⃣4️⃣ UPLOAD ERROR LOGS
    - name: Upload Error Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: webapp-error-logs-${{ github.run_id }}
        path: error_logs_web/
        retention-days: 30
    
    # 1️⃣5️⃣ SEND TELEGRAM SUCCESS NOTIFICATION
    - name: Send Telegram Success Notification
      if: success()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ✅ **WEB TO APK BUILD SUCCESS!**
          
          📱 App: ${{ github.event.inputs.app_name }}
          🏷️ Version: ${{ github.event.inputs.version_name }}
          🌐 Website: ${{ github.event.inputs.website_url }}
          📦 Package: ${{ github.event.inputs.package_name }}
          🔗 Download: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    
    # 1️⃣6️⃣ SEND TELEGRAM ERROR NOTIFICATION
    - name: Send Telegram Error Notification
      if: failure()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ❌ **WEB TO APK BUILD FAILED!**
          
          📱 App: ${{ github.event.inputs.app_name }}
          🌐 Website: ${{ github.event.inputs.website_url }}
          📦 Package: ${{ github.event.inputs.package_name }}
          👤 Triggered by: ${{ github.actor }}
          🔗 Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          📋 **Error Summary:**
          ${{ steps.build_webview.outcome == 'failure' && '❌ Nativefier build failed' || '' }}
          ${{ steps.install_tools.outcome == 'failure' && '❌ Tool installation failed' || '' }}
          ${{ steps.generate_icon.outcome == 'failure' && '❌ Icon generation failed' || '' }}
          ${{ steps.sign_apk.outcome == 'failure' && '❌ APK signing failed' || '' }}
          
          📥 **Download Error Logs:**
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    
    # 1️⃣7️⃣ SEND ERROR LOG FILE
    - name: Send Error Log File to Telegram
      if: failure()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        document: error_logs_web/ERROR_SUMMARY.txt
        message: "📄 Error Summary attached below:"
    
    # 1️⃣8️⃣ SEND EMAIL NOTIFICATION
    - name: Send Email Notification
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{secrets.MAIL_USERNAME}}
        password: ${{secrets.MAIL_PASSWORD}}
        subject: "❌ WebApp Build Failed - ${{ github.event.inputs.app_name }}"
        to: ${{ secrets.NOTIFICATION_EMAIL }}
        from: GitHub Actions
        body: |
          WebApp Build FAILED!
          
          App: ${{ github.event.inputs.app_name }}
          Website: ${{ github.event.inputs.website_url }}
          Run ID: ${{ github.run_id }}
          Triggered by: ${{ github.actor }}
          
          Error Logs: 
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          Please check the error logs attached in artifacts.

  # ============================================
  # JOB 2: CREATE RELEASE (jika sukses)
  # ============================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-webview-apk
    if: github.ref == 'refs/heads/main' && success()
    
    steps:
    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: webapp-${{ github.event.inputs.app_name }}-v${{ github.event.inputs.version_name }}
        path: release/
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: webapp-${{ github.run_number }}
        name: "WebApp Release ${{ github.event.inputs.app_name }} v${{ github.event.inputs.version_name }}"
        body: |
          ## 📱 Web to APK Build
          
          **App Name:** ${{ github.event.inputs.app_name }}
          **Version:** ${{ github.event.inputs.version_name }}
          **Website:** ${{ github.event.inputs.website_url }}
          
          ### 📥 Download
          - APK: [Download Here](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ### 🔧 Features
          - Fullscreen mode
          - Navigation controls
          - Custom theme
          - Optimized WebView
        files: |
          release/*.apk

  # ============================================
  # JOB 3: FALLBACK NOTIFICATION
  # ============================================
  notify-fallback:
    name: Fallback Notification
    runs-on: ubuntu-latest
    needs: [build-webview-apk, create-release]
    if: always() && (needs.build-webview-apk.result == 'failure' || needs.create-release.result == 'failure')
    
    steps:
    - name: Send Fallback Notification
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          🔔 **WEBAPP BUILD STATUS SUMMARY**
          
          ✅ build-webview-apk: ${{ needs.build-webview-apk.result }}
          ✅ create-release: ${{ needs.create-release.result }}
          
          📱 App: ${{ github.event.inputs.app_name }}
          🔗 Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          ⚠️ One or more builds failed!
