name: 🚀 GARSX Web2APK Builder

# ============================================================
# 1. TRIGGER
# ============================================================
on:
  workflow_dispatch:
    inputs:
      web_url:
        description: '🌐 Web URL'
        required: true
        type: string
        default: ''
      app_name:
        description: '📝 App Name'
        required: false
        type: string
        default: 'GARSX Web App'
      tag:
        description: '🏷️ Tag Build'
        required: false
        type: string
        default: 'v1.0.0'
      build_mode:
        description: '📱 Build Mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both
      icon_url:
        description: '🖼️ Icon URL'
        required: false
        type: string
        default: ''
      only_analyze:
        description: '🔍 Only Analyze'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

# ============================================================
# 2. PERMISSIONS
# ============================================================
permissions:
  contents: write
  packages: write

# ============================================================
# 3. ENVIRONMENT
# ============================================================
env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.22.0'
  NODE_VERSION: '18'
  GRADLE_OPTS: '-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g'

# ============================================================
# 4. JOB: BUILD WEB2APK
# ============================================================
jobs:
  build:
    name: 🌐 Build Web2APK (${{ github.event.inputs.build_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # STEP 1: CHECKOUT
      # ============================================================
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      # ============================================================
      # STEP 2: FREE DISK SPACE
      # ============================================================
      - name: "🧹 Free Disk Space"
        run: |
          sudo apt clean
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      # ============================================================
      # STEP 3: UPDATE SYSTEM
      # ============================================================
      - name: "🔧 Update System"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip wget curl git imagemagick

      # ============================================================
      # STEP 4: SETUP JAVA
      # ============================================================
      - name: "☕ Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      # ============================================================
      # STEP 5: SETUP ANDROID SDK
      # ============================================================
      - name: "📱 Setup Android SDK"
        uses: android-actions/setup-android@v3

      # ============================================================
      # STEP 6: INSTALL ANDROID SDK
      # ============================================================
      - name: "📱 Install Android SDK"
        run: |
          echo "📱 Installing Android SDK..."
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "✅ Android SDK installed"

      # ============================================================
      # STEP 7: SETUP FLUTTER
      # ============================================================
      - name: "🐦 Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # ============================================================
      # STEP 8: VERIFY FLUTTER
      # ============================================================
      - name: "✅ Verify Flutter"
        run: |
          flutter --version
          dart --version

      # ============================================================
      # STEP 9: CONFIGURE FLUTTER
      # ============================================================
      - name: "⚙️ Configure Flutter"
        run: |
          flutter config --enable-android
          flutter config --no-enable-web
          flutter config --no-enable-ios

      # ============================================================
      # STEP 10: FLUTTER DOCTOR
      # ============================================================
      - name: "🩺 Flutter Doctor"
        run: flutter doctor -v

      # ============================================================
      # STEP 11: SETUP NODE.JS
      # ============================================================
      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ============================================================
      # STEP 12: CREATE FLUTTER PROJECT
      # ============================================================
      - name: "📦 Create Flutter Project"
        run: |
          echo "════════════════════════════════════════"
          echo "  🌐 CREATING WEB2APK PROJECT"
          echo "════════════════════════════════════════"
          echo ""
          
          APP_NAME="${{ github.event.inputs.app_name }}"
          WEB_URL="${{ github.event.inputs.web_url }}"
          
          if [ -z "$WEB_URL" ]; then
            echo "❌ Web URL tidak boleh kosong!"
            exit 1
          fi
          
          echo "📝 App Name: $APP_NAME"
          echo "🌐 Web URL: $WEB_URL"
          echo ""
          
          PKG=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr ' ' '_' | tr -cd '[:alnum:]_')
          echo "📦 Package: com.webapk.$PKG"
          
          flutter create --org com.webapk --project-name "$PKG" myapp || {
            echo "❌ Gagal membuat project!"
            exit 1
          }
          
          echo "PROJECT_DIR=myapp" >> $GITHUB_ENV
          echo "✅ Project created"

      # ============================================================
      # STEP 13: ADD DEPENDENCIES
      # ============================================================
      - name: "📦 Add Dependencies"
        run: |
          cd myapp
          
          echo "📦 Adding dependencies..."
          flutter pub add webview_flutter || echo "⚠️ webview_flutter already exists"
          flutter pub add flutter_launcher_icons || echo "⚠️ flutter_launcher_icons already exists"
          flutter pub add connectivity_plus || echo "⚠️ connectivity_plus already exists"
          
          if ! grep -q "assets/" pubspec.yaml; then
            echo "" >> pubspec.yaml
            echo "  assets:" >> pubspec.yaml
            echo "    - assets/icon/" >> pubspec.yaml
          fi
          
          echo "✅ Dependencies added"

      # ============================================================
      # STEP 14: WRITE MAIN.DART
      # ============================================================
      - name: "📝 Write Main.dart"
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          WEB_URL="${{ github.event.inputs.web_url }}"
          
          cat > myapp/lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:connectivity_plus/connectivity_plus.dart';
          import 'dart:async';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
              statusBarColor: Colors.transparent,
              statusBarIconBrightness: Brightness.dark,
            ));
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'APP_NAME_PLACEHOLDER',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(useMaterial3: true, primarySwatch: Colors.blue),
                home: const SplashScreen(),
              );
            }
          }

          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});
            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen> with TickerProviderStateMixin {
            late AnimationController _fadeController;
            late AnimationController _scaleController;
            bool _isChecking = false;
            bool _dialogShown = false;

            @override
            void initState() {
              super.initState();
              _fadeController = AnimationController(vsync: this, duration: const Duration(milliseconds: 800));
              _scaleController = AnimationController(vsync: this, duration: const Duration(milliseconds: 800));
              _fadeController.forward();
              _scaleController.forward();
              Timer(const Duration(milliseconds: 1500), () => _checkConnectionAndNavigate());
            }

            Future<void> _checkConnectionAndNavigate() async {
              if (_isChecking) return;
              setState(() => _isChecking = true);
              await Future.delayed(const Duration(milliseconds: 1000));
              var connectivityResult = await (Connectivity().checkConnectivity());
              if (connectivityResult.every((r) => r == ConnectivityResult.none)) {
                setState(() => _isChecking = false);
                _showNoConnectionDialog();
              } else {
                if (mounted) {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const WebViewPage()));
                }
              }
            }

            void _showNoConnectionDialog() {
              if (!mounted || _dialogShown) return;
              setState(() => _dialogShown = true);
              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (context) => AlertDialog(
                  title: const Text('Gagal Terhubung'),
                  content: const Text('Tidak ada koneksi internet.'),
                  actions: [
                    TextButton(onPressed: () { 
                      Navigator.pop(context); 
                      setState(() => _dialogShown = false); 
                      _checkConnectionAndNavigate(); 
                    }, child: const Text('Coba Lagi'))
                  ],
                ),
              );
            }

            @override
            void dispose() { 
              _fadeController.dispose(); 
              _scaleController.dispose(); 
              super.dispose(); 
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      FadeTransition(
                        opacity: _fadeController,
                        child: ScaleTransition(
                          scale: _scaleController,
                          child: Container(
                            width: 80,
                            height: 80,
                            decoration: BoxDecoration(
                              color: Colors.blue,
                              borderRadius: BorderRadius.circular(20),
                            ),
                            child: const Center(
                              child: Icon(
                                Icons.web,
                                color: Colors.white,
                                size: 40,
                              ),
                            ),
                          ),
                        ),
                      ),
                      const SizedBox(height: 20),
                      FadeTransition(
                        opacity: _fadeController,
                        child: Text(
                          'APP_NAME_PLACEHOLDER',
                          style: const TextStyle(
                            fontSize: 24,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                      ),
                      const SizedBox(height: 10),
                      FadeTransition(
                        opacity: _fadeController,
                        child: const CircularProgressIndicator(),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});
            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController _controller;
            bool _isLoading = true;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageFinished: (url) {
                      setState(() => _isLoading = false);
                    },
                    onWebResourceError: (error) {
                      setState(() => _isLoading = false);
                    },
                  ),
                )
                ..loadRequest(Uri.parse('WEB_URL_PLACEHOLDER'));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Stack(
                    children: [
                      WebViewWidget(controller: _controller),
                      if (_isLoading)
                        const Center(
                          child: CircularProgressIndicator(),
                        ),
                    ],
                  ),
                ),
              );
            }
          }
          DART

          sed -i "s/APP_NAME_PLACEHOLDER/$APP_NAME/g" myapp/lib/main.dart
          sed -i "s|WEB_URL_PLACEHOLDER|$WEB_URL|g" myapp/lib/main.dart
          
          echo "✅ Main.dart created"

      # ============================================================
      # STEP 15: FIX ANDROID PERMISSIONS
      # ============================================================
      - name: "🔧 Fix Android Permissions"
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          MANIFEST="myapp/android/app/src/main/AndroidManifest.xml"
          
          if [ ! -f "$MANIFEST" ]; then
            echo "⚠️ AndroidManifest.xml not found, creating..."
            mkdir -p myapp/android/app/src/main
            cat > "$MANIFEST" << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.webapk.myapp">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="APP_NAME_PLACEHOLDER"
                  android:icon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi
          
          if ! grep -q "INTERNET" "$MANIFEST"; then
            sed -i '/<manifest xmlns:android/a\    <uses-permission android:name="android.permission.INTERNET" \/>' "$MANIFEST"
          fi
          if ! grep -q "ACCESS_NETWORK_STATE" "$MANIFEST"; then
            sed -i '/<manifest xmlns:android/a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>' "$MANIFEST"
          fi
          
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/" "$MANIFEST"
          echo "✅ Android permissions fixed"

      # ============================================================
      # STEP 16: DOWNLOAD ICON
      # ============================================================
      - name: "🖼️ Download Icon"
        run: |
          mkdir -p myapp/assets/icon
          
          if [ -z "${{ github.event.inputs.icon_url }}" ]; then
            echo "🎨 Creating dummy icon..."
            convert -size 1024x1024 xc:blue myapp/assets/icon/icon.png
          else
            echo "📥 Downloading icon..."
            curl -L -o myapp/assets/icon/icon_raw "${{ github.event.inputs.icon_url }}" || echo "⚠️ Icon download failed"
            if [ -f myapp/assets/icon/icon_raw ]; then
              convert myapp/assets/icon/icon_raw -resize 1024x1024 myapp/assets/icon/icon.png || {
                echo "⚠️ Icon conversion failed, using dummy"
                convert -size 1024x1024 xc:blue myapp/assets/icon/icon.png
              }
            fi
          fi
          
          echo "✅ Icon ready"

      # ============================================================
      # STEP 17: GENERATE ICONS
      # ============================================================
      - name: "🎨 Generate Icons"
        run: |
          cat > myapp/flutter_launcher_icons.yaml << 'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/icon.png"
            min_sdk_android: 21
          EOF
          
          cd myapp
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml || {
            echo "⚠️ Icon generation failed, using default"
          }
          
          echo "✅ Icons generated"

      # ============================================================
      # STEP 18: FLUTTER CLEAN
      # ============================================================
      - name: "🧹 Flutter Clean"
        run: |
          cd myapp
          flutter clean || true
          rm -rf build .dart_tool 2>/dev/null || true
          echo "✅ Clean complete"

      # ============================================================
      # STEP 19: GET DEPENDENCIES
      # ============================================================
      - name: "📦 Get Dependencies"
        run: |
          cd myapp
          
          for i in 1 2 3; do
            echo "🔄 Attempt $i/3..."
            if flutter pub get; then
              echo "✅ Dependencies installed"
              break
            fi
            echo "⏳ Retry $i..."
            sleep 5
          done || {
            echo "❌ Failed to install dependencies!"
            exit 1
          }

      # ============================================================
      # STEP 20: FLUTTER ANALYZE
      # ============================================================
      - name: "🔍 Flutter Analyze"
        continue-on-error: true
        run: |
          cd myapp
          flutter analyze --no-fatal-infos || echo "⚠️ Warnings ignored"

      # ============================================================
      # STEP 21: STOP IF ONLY ANALYZE
      # ============================================================
      - name: "🛑 Stop if Only Analyze"
        if: github.event.inputs.only_analyze == 'true'
        run: |
          echo "✅ Analyze only mode, stopping..."
          exit 0

      # ============================================================
      # STEP 22: BUILD RELEASE APK
      # ============================================================
      - name: "🔨 Build Release APK"
        if: github.event.inputs.build_mode == 'release' || github.event.inputs.build_mode == 'both'
        run: |
          echo "════════════════════════════════════════"
          echo "  🔨 BUILDING RELEASE APK"
          echo "════════════════════════════════════════"
          echo ""
          echo "⏳ This will take 3-8 minutes..."
          echo ""
          
          cd myapp
          mkdir -p output
          
          flutter build apk --release || {
            echo ""
            echo "❌ Release build failed!"
            if [ -f "build/app/outputs/flutter-apk/console.log" ]; then
              echo "📋 Last 50 lines:"
              tail -50 "build/app/outputs/flutter-apk/console.log"
            fi
            exit 1
          }
          
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk output/GARSX-RELEASE.apk
            SIZE=$(du -h output/GARSX-RELEASE.apk | cut -f1)
            echo ""
            echo "✅ Release APK: output/GARSX-RELEASE.apk ($SIZE)"
          else
            echo "❌ Release APK not found!"
            exit 1
          fi

      # ============================================================
      # STEP 23: BUILD DEBUG APK
      # ============================================================
      - name: "🐞 Build Debug APK"
        if: github.event.inputs.build_mode == 'debug' || github.event.inputs.build_mode == 'both'
        run: |
          echo "════════════════════════════════════════"
          echo "  🐞 BUILDING DEBUG APK"
          echo "════════════════════════════════════════"
          echo ""
          echo "⏳ This will take 3-8 minutes..."
          echo ""
          
          cd myapp
          mkdir -p output
          
          flutter build apk --debug || {
            echo ""
            echo "❌ Debug build failed!"
            if [ -f "build/app/outputs/flutter-apk/console.log" ]; then
              echo "📋 Last 50 lines:"
              tail -50 "build/app/outputs/flutter-apk/console.log"
            fi
            exit 1
          }
          
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk output/GARSX-DEBUG.apk
            SIZE=$(du -h output/GARSX-DEBUG.apk | cut -f1)
            echo ""
            echo "✅ Debug APK: output/GARSX-DEBUG.apk ($SIZE)"
          else
            echo "❌ Debug APK not found!"
            exit 1
          fi

      # ============================================================
      # STEP 24: VERIFY APKS
      # ============================================================
      - name: "✅ Verify APKs"
        run: |
          echo "════════════════════════════════════════"
          echo "  ✅ VERIFYING APKS"
          echo "════════════════════════════════════════"
          echo ""
          
          cd myapp
          
          if [ -f "output/GARSX-RELEASE.apk" ]; then
            SIZE=$(stat -c%s "output/GARSX-RELEASE.apk" 2>/dev/null || stat -f%z "output/GARSX-RELEASE.apk" 2>/dev/null)
            if [ -n "$SIZE" ] && [ "$SIZE" -gt 1000000 ]; then
              echo "✅ Release APK: $((SIZE/1024/1024)) MB"
              sha256sum output/GARSX-RELEASE.apk > output/GARSX-RELEASE.apk.sha256
            else
              echo "❌ Release APK too small!"
              exit 1
            fi
          fi
          
          if [ -f "output/GARSX-DEBUG.apk" ]; then
            SIZE=$(stat -c%s "output/GARSX-DEBUG.apk" 2>/dev/null || stat -f%z "output/GARSX-DEBUG.apk" 2>/dev/null)
            if [ -n "$SIZE" ] && [ "$SIZE" -gt 1000000 ]; then
              echo "✅ Debug APK: $((SIZE/1024/1024)) MB"
              sha256sum output/GARSX-DEBUG.apk > output/GARSX-DEBUG.apk.sha256
            else
              echo "❌ Debug APK too small!"
              exit 1
            fi
          fi
          
          echo ""
          echo "📦 APKs ready:"
          ls -lh output/

      # ============================================================
      # STEP 25: COPY TO ROOT
      # ============================================================
      - name: "📱 Copy APKs to Root"
        run: |
          mkdir -p output
          cp myapp/output/*.apk output/ 2>/dev/null || true
          cp myapp/output/*.sha256 output/ 2>/dev/null || true
          echo "✅ APKs copied to root"
          ls -lh output/

      # ============================================================
      # STEP 26: CREATE BUILD INFO
      # ============================================================
      - name: "📝 Create Build Info"
        run: |
          cat > output/build-info.txt << EOF
          ════════════════════════════════════════
             GARSX BUILD REPORT - WEB2APK
          ════════════════════════════════════════
          
          📱 BUILD INFO
          ──────────────────────────────────────
          Status: ✅ SUCCESS
          Type: Web2APK
          App: ${{ github.event.inputs.app_name }}
          URL: ${{ github.event.inputs.web_url }}
          Mode: ${{ github.event.inputs.build_mode }}
          Tag: ${{ github.event.inputs.tag }}
          
          📦 APK INFO
          ──────────────────────────────────────
          EOF
          
          for apk in output/*.apk; do
            if [ -f "$apk" ]; then
              NAME=$(basename "$apk")
              SIZE=$(du -h "$apk" | cut -f1)
              SHA=$(sha256sum "$apk" | cut -d' ' -f1)
              echo "  $NAME" >> output/build-info.txt
              echo "    Size: $SIZE" >> output/build-info.txt
              echo "    SHA256: $SHA" >> output/build-info.txt
            fi
          done
          
          cat >> output/build-info.txt << EOF
          
          🔗 REPOSITORY
          ──────────────────────────────────────
          Repo: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Run: ${{ github.run_id }}
          
          ⏱️ TIMESTAMP
          ──────────────────────────────────────
          Build: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          ════════════════════════════════════════
          EOF
          
          cat output/build-info.txt

      # ============================================================
      # STEP 27: UPLOAD ARTIFACT
      # ============================================================
      - name: "📤 Upload APKs"
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-Web2APK-${{ github.event.inputs.tag }}
          path: |
            output/*.apk
            output/*.sha256
            output/build-info.txt
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # STEP 28: SUCCESS
      # ============================================================
      - name: "🎉 Build Success"
        if: success()
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════╗"
          echo "║     ✅ WEB2APK BUILD BERHASIL!           ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""
          echo "📝 App: ${{ github.event.inputs.app_name }}"
          echo "🌐 URL: ${{ github.event.inputs.web_url }}"
          echo "📱 Mode: ${{ github.event.inputs.build_mode }}"
          echo "🏷️ Tag: ${{ github.event.inputs.tag }}"
          echo ""
          echo "📦 APKs:"
          ls -lh output/*.apk
          echo ""
          echo "📥 Download dari Artifacts tab"

      # ============================================================
      # STEP 29: FAILURE
      # ============================================================
      - name: "❌ Build Failed"
        if: failure()
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════╗"
          echo "║        ❌ BUILD GAGAL!                  ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""
          echo "🔍 Periksa log di atas untuk detail error."

      # ============================================================
      # STEP 30: CLEANUP
      # ============================================================
      - name: "🧹 Cleanup"
        if: always()
        continue-on-error: true
        run: |
          rm -rf myapp 2>/dev/null || true
          echo "✅ Cleanup completed"
