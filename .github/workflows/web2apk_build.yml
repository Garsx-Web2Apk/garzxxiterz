name: GARSX Web2APK Build Engine

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "Website URL (contoh: https://xxo25.com)"
        required: true
        type: string
      app_name:
        description: "Application name"
        required: true
        type: string
      tag:
        description: "Build tag (contoh: v2.0.0)"
        required: true
        type: string
      build_mode:
        description: "Build mode"
        required: true
        type: choice
        options:
          - debug
          - release
        default: release
      icon_url:
        description: "Optional icon URL (contoh: https://xxo25.com/icon.png)"
        required: false
        type: string
        default: ""
      only_analyze:
        description: "Only validate (tanpa build)"
        required: false
        type: string
        default: "false"

permissions:
  contents: read

jobs:
  build:
    name: Web2APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      WEB_URL: ${{ inputs.web_url }}
      APP_NAME: ${{ inputs.app_name }}
      BUILD_TAG: ${{ inputs.tag }}
      BUILD_MODE: ${{ inputs.build_mode }}
      ICON_URL: ${{ inputs.icon_url }}
      GRADLE_OPTS: "-Xmx3g -Dfile.encoding=UTF-8"

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: "1. Checkout Repository"
        uses: actions/checkout@v5

      # ============================================================
      # 2. SETUP JAVA & ANDROID SDK
      # ============================================================
      - name: "2. Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "2. Setup Android SDK"
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/android-sdk}
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          echo "✅ Android SDK ready!"

      - name: "2. Install Gradle"
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v gradle >/dev/null 2>&1; then
            echo "📦 Installing Gradle..."
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle-8.7-bin.zip
            sudo mv gradle-8.7 /opt/gradle
            sudo ln -s /opt/gradle/bin/gradle /usr/bin/gradle
          fi
          gradle --version || {
            echo "::error::Gradle gagal diinstall!"
            exit 1
          }
          echo "✅ Gradle ready!"

      # ============================================================
      # 3. VALIDASI URL
      # ============================================================
      - name: "3. Validate Web URL"
        shell: bash
        run: |
          set -euo pipefail
          case "$WEB_URL" in
            http://*|https://*) echo "✅ URL valid: $WEB_URL" ;;
            *) echo "::error::URL harus dimulai http:// atau https://"; exit 1 ;;
          esac

      # ============================================================
      # 4. CREATE WEBVIEW PROJECT
      # ============================================================
      - name: "4. Create WebView Android Project"
        shell: bash
        run: |
          set -euo pipefail

          rm -rf web2apk
          mkdir -p web2apk

          # settings.gradle
          cat > web2apk/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GARSXWeb2APK"
          include(":app")
          EOF

          # build.gradle
          cat > web2apk/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          mkdir -p web2apk/app/src/main/java/com/garsx/web2apk

          # app/build.gradle
          cat > web2apk/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.garsx.web2apk'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.garsx.web2apk'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF

          # gradle.properties
          cat > web2apk/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # AndroidManifest.xml
          mkdir -p web2apk/app/src/main
          cat > web2apk/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              
              <application
                  android:theme="@style/AppTheme"
                  android:label="GARSX Web2APK"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # styles.xml
          mkdir -p web2apk/app/src/main/res/values
          cat > web2apk/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#2196F3</item>
              </style>
          </resources>
          EOF

          # MainActivity.java
          cat > web2apk/app/src/main/java/com/garsx/web2apk/MainActivity.java <<'EOF'
          package com.garsx.web2apk;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.KeyEvent;
          import android.view.View;

          public class MainActivity extends Activity {
              private WebView webView;
              private String webUrl = "https://example.com";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  // Enable JavaScript
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setBuiltInZoomControls(true);
                  settings.setDisplayZoomControls(false);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  // WebView Client
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          view.loadUrl(request.getUrl().toString());
                          return true;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());

                  // Load URL
                  webView.loadUrl(webUrl);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # Replace URL dengan yang diinput
          sed -i "s#https://example.com#${WEB_URL//\//\\/}#g" \
            web2apk/app/src/main/java/com/garsx/web2apk/MainActivity.java

          # Replace App Name di Manifest
          sed -i "s#GARSX Web2APK#${APP_NAME//\//\\/}#g" \
            web2apk/app/src/main/AndroidManifest.xml

          # Generate Gradle wrapper
          cd web2apk
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          cd ..

          echo "✅ WebView project created!"
          echo "📱 App Name: $APP_NAME"
          echo "🌐 URL: $WEB_URL"

      # ============================================================
      # 5. COMPILE SOURCES
      # ============================================================
      - name: "5. Compiling Sources"
        working-directory: web2apk
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Compiling Java sources..."
          ./gradlew --version
          ./gradlew :app:compileDebugJavaWithJavac --stacktrace --no-daemon || {
            echo "::error::Compile gagal!"
            echo "📂 Logs:"
            find app/build -type f -name '*.log' -print 2>/dev/null | head -5
            exit 1
          }
          echo "✅ Compile successful!"

      # ============================================================
      # 6. GRADLE ASSEMBLE APK
      # ============================================================
      - name: "6. Gradle Assemble APK"
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: web2apk
        shell: bash
        run: |
          set -euo pipefail
          echo "📦 Assembling APK..."
          
          if [ "$BUILD_MODE" = "debug" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon || {
              echo "::error::Gradle assembleDebug gagal!"
              exit 1
            }
          else
            ./gradlew :app:assembleRelease --stacktrace --no-daemon || {
              echo "::error::Gradle assembleRelease gagal!"
              exit 1
            }
          fi
          
          echo "✅ APK assembled!"

      # ============================================================
      # 7. SIGNING & PACKAGING
      # ============================================================
      - name: "7. Signing & Packaging"
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: web2apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final_apk
          
          echo "🔍 Searching for APK..."
          
          # Cari APK
          APK=""
          if [ "$BUILD_MODE" = "debug" ]; then
            APK="$(find app/build/outputs/apk -type f -name '*debug*.apk' -print -quit 2>/dev/null || true)"
          else
            APK="$(find app/build/outputs/apk -type f -name '*release*.apk' -print -quit 2>/dev/null || true)"
          fi
          
          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan!"
            echo "📂 Mencari di: app/build/outputs/apk"
            find app/build -type f -name '*.apk' -print 2>/dev/null || echo "Tidak ada APK"
            exit 1
          fi
          
          echo "✅ APK found: $APK"
          
          OUT="GARSX-Web2APK-${BUILD_TAG}.apk"
          cp "$APK" "final_apk/$OUT"
          echo "✅ APK copied to: final_apk/$OUT"
          
          # Verifikasi
          if command -v apksigner >/dev/null 2>&1; then
            echo "🔍 Verifying APK..."
            apksigner verify --verbose "final_apk/$OUT" || echo "⚠️ APK tidak signed (hanya untuk testing)"
          fi
          
          ls -lh final_apk/

      # ============================================================
      # 8. FINALIZING BUILD
      # ============================================================
      - name: "8. Finalizing Build"
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: web2apk
        shell: bash
        run: |
          set -euo pipefail
          
          APK="$(find final_apk -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$APK" ]; then
            echo "::error::Tidak ada APK di final_apk!"
            exit 1
          fi
          
          test -s "$APK" || {
            echo "::error::APK kosong!"
            exit 1
          }
          
          echo "📊 APK Info:"
          sha256sum "$APK" | tee final_apk/SHA256SUMS.txt
          du -h "$APK"
          file "$APK"
          
          echo "APK_READY=$APK" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(du -h "$APK" | cut -f1)" >> "$GITHUB_ENV"
          echo "✅ Finalizing completed!"

      # ============================================================
      # 9. UPLOAD APK ARTIFACT
      # ============================================================
      - name: "9. Upload APK Artifact"
        if: ${{ success() && inputs.only_analyze != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-Web2APK-${{ inputs.build_mode }}-${{ inputs.tag }}
          path: |
            web2apk/final_apk/*.apk
            web2apk/final_apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 10. BUILD SUCCESS
      # ============================================================
      - name: "10. Build Success"
        if: ${{ success() && inputs.only_analyze != 'true' }}
        run: |
          echo "=============================================="
          echo "         GARSX WEB2APK BUILD SUCCESS"
          echo "=============================================="
          echo "URL  : $WEB_URL"
          echo "Name : $APP_NAME"
          echo "Mode : $BUILD_MODE"
          echo "Tag  : $BUILD_TAG"
          echo "APK  : $APK_READY"
          echo "Size : $APK_SIZE"
          echo "=============================================="

      # ============================================================
      # 11. BUILD ERROR LOG
      # ============================================================
      - name: "BUILD ERROR LOG"
        if: ${{ failure() }}
        working-directory: web2apk
        shell: bash
        run: |
          echo "=============================================="
          echo "          GARSX WEB2APK BUILD FAILED"
          echo "=============================================="
          echo "URL : $WEB_URL"
          echo "Mode: $BUILD_MODE"
          echo "Tag : $BUILD_TAG"
          echo ""
          echo "📂 APK files found:"
          find . -type f -name '*.apk' -print 2>/dev/null || echo "Tidak ada APK"
          echo ""
          echo "📂 Gradle logs:"
          find app/build -type f -name '*.log' -print 2>/dev/null | head -5 || true
          echo "=============================================="
