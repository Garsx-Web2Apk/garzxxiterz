name: 🌐 Web2APK Build

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "URL Website"
        required: true
        type: string
      app_name:
        description: "Nama Aplikasi"
        required: true
        type: string
      tag:
        description: "Tag Build"
        required: true
        type: string
        default: "v2.0.0"
      build_mode:
        description: "Mode Build"
        required: true
        type: choice
        options:
          - debug
          - release
        default: release

permissions:
  contents: read

jobs:
  build:
    name: 🌐 Web2APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      WEB_URL: ${{ inputs.web_url }}
      APP_NAME: ${{ inputs.app_name }}
      BUILD_TAG: ${{ inputs.tag }}
      BUILD_MODE: ${{ inputs.build_mode }}
      GRADLE_OPTS: "-Xmx3g -Dfile.encoding=UTF-8"

    steps:
      - name: "1. Checkout Repository"
        uses: actions/checkout@v5

      - name: "2. Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "2. Setup Android SDK"
        shell: bash
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/android-sdk}
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          echo "✅ Android SDK ready!"

      - name: "2. Install Gradle"
        shell: bash
        run: |
          if ! command -v gradle >/dev/null 2>&1; then
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle-8.7-bin.zip
            sudo mv gradle-8.7 /opt/gradle
            sudo ln -s /opt/gradle/bin/gradle /usr/bin/gradle
          fi
          echo "✅ Gradle ready!"

      - name: "3. Validate Web URL"
        shell: bash
        run: |
          case "$WEB_URL" in
            http://*|https://*) echo "✅ URL valid: $WEB_URL" ;;
            *) echo "::error::URL harus dimulai http:// atau https://"; exit 1 ;;
          esac

      - name: "4. Create WebView Project"
        shell: bash
        run: |
          rm -rf web2apk
          mkdir -p web2apk

          cat > web2apk/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "GARSXWeb2APK"
          include(":app")
          EOF

          cat > web2apk/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          EOF

          mkdir -p web2apk/app/src/main/java/com/garsx/web2apk

          cat > web2apk/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.garsx.web2apk'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.garsx.web2apk'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes {
                  debug { debuggable true }
                  release { minifyEnabled false }
              }
          }
          EOF

          cat > web2apk/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          mkdir -p web2apk/app/src/main
          cat > web2apk/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:theme="@style/AppTheme"
                  android:label="GARSX Web2APK"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p web2apk/app/src/main/res/values
          cat > web2apk/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:colorAccent">#2196F3</item>
              </style>
          </resources>
          EOF

          cat > web2apk/app/src/main/java/com/garsx/web2apk/MainActivity.java <<'EOF'
          package com.garsx.web2apk;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              private WebView webView;
              private String webUrl = "https://example.com";
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          view.loadUrl(request.getUrl().toString());
                          return true;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl(webUrl);
              }
              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) { webView.goBack(); }
                  else { super.onBackPressed(); }
              }
          }
          EOF

          sed -i "s#https://example.com#${WEB_URL//\//\\/}#g" \
            web2apk/app/src/main/java/com/garsx/web2apk/MainActivity.java
          sed -i "s#GARSX Web2APK#${APP_NAME//\//\\/}#g" \
            web2apk/app/src/main/AndroidManifest.xml

          cd web2apk
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          cd ..

          echo "✅ WebView project created!"

      - name: "5. Compiling Sources"
        working-directory: web2apk
        shell: bash
        run: |
          ./gradlew :app:compileDebugJavaWithJavac --stacktrace --no-daemon || {
            echo "::error::Compile gagal!"
            exit 1
          }
          echo "✅ Compile successful!"

      - name: "6. Gradle Assemble APK"
        working-directory: web2apk
        shell: bash
        run: |
          if [ "$BUILD_MODE" = "debug" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon || {
              echo "::error::Gradle assembleDebug gagal!"
              exit 1
            }
          else
            ./gradlew :app:assembleRelease --stacktrace --no-daemon || {
              echo "::error::Gradle assembleRelease gagal!"
              exit 1
            }
          fi
          echo "✅ APK assembled!"

      - name: "7. Signing & Packaging"
        working-directory: web2apk
        shell: bash
        run: |
          mkdir -p final_apk
          APK=""
          if [ "$BUILD_MODE" = "debug" ]; then
            APK="$(find app/build/outputs/apk -type f -name '*debug*.apk' -print -quit 2>/dev/null || true)"
          else
            APK="$(find app/build/outputs/apk -type f -name '*release*.apk' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan!"
            exit 1
          fi
          OUT="Web2APK-${BUILD_TAG}.apk"
          cp "$APK" "final_apk/$OUT"
          echo "✅ APK: $OUT"
          ls -lh final_apk/

      - name: "8. Finalizing Build"
        working-directory: web2apk
        shell: bash
        run: |
          APK="$(find final_apk -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::APK tidak valid!"
            exit 1
          fi
          sha256sum "$APK" | tee final_apk/SHA256SUMS.txt
          echo "APK_READY=$APK" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(du -h "$APK" | cut -f1)" >> "$GITHUB_ENV"

      - name: "9. Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: Web2APK-${{ inputs.build_mode }}-${{ inputs.tag }}
          path: web2apk/final_apk/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: "10. ✅ Build Success!"
        run: |
          echo "=============================================="
          echo "     ✅ WEB2APK SUCCESS! ✅"
          echo "=============================================="
          echo "URL  : $WEB_URL"
          echo "Name : $APP_NAME"
          echo "Tag  : $BUILD_TAG"
          echo "APK  : $APK_READY"
          echo "Size : $APK_SIZE"
          echo "=============================================="

      - name: "❌ Build Error Log"
        if: ${{ failure() }}
        run: |
          echo "=============================================="
          echo "     ❌ WEB2APK BUILD FAILED! ❌"
          echo "=============================================="
          echo "URL : $WEB_URL"
          echo "Mode: $BUILD_MODE"
          echo "=============================================="
