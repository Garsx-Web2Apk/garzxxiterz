name: Anti-Error APK Builder

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: 'Release URL'
        required: true
        type: string
      tag:
        description: 'Release Tag'
        required: true
        type: string
      build_type:
        description: 'Build Type'
        required: true
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Free Disk Space
        run: |
          sudo apt clean
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Download Project
        run: |
          echo "📥 Downloading..."
          curl -L -o project.zip "${{ github.event.inputs.release_url }}"
          unzip project.zip -d project/

      - name: Flutter Pub Get (Retry 3x)
        run: |
          cd project/
          for i in {1..3}; do
            flutter pub get && break
            echo "Retry $i..."
            sleep 5
          done

      - name: Build APK
        run: |
          cd project/
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: List APK
        run: |
          find project/build -name "*.apk" -type f
          APK_COUNT=$(find project/build -name "*.apk" -type f | wc -l)
          echo "Total APK: $APK_COUNT"
          if [ $APK_COUNT -eq 0 ]; then exit 1; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-files
          path: project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Success
        run: echo "✅ BUILD SUCCESSFUL!"
