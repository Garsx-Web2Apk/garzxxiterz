name: 🚀 GARSX Flutter ZIP Build

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: '📱 Build Mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - profile
          - both
      enable_test:
        description: '🧪 Run Tests?'
        required: false
        default: false
        type: boolean
      enable_clean:
        description: '🧹 Clean before build?'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  FLUTTER_CHANNEL: stable
  GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  build:
    name: 🛠️ Build (${{ github.event.inputs.build_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 01. CHECKOUT REPOSITORY
      # ============================================================
      - name: "01 - 📥 Checkout Repository"
        uses: actions/checkout@v4

      # ============================================================
      # 02. PREPARE WORKSPACE
      # ============================================================
      - name: "02 - 📂 Prepare Workspace"
        shell: bash
        run: |
          set -e
          mkdir -p workspace output
          echo "✅ Workspace siap."

      # ============================================================
      # 03. FIND & VALIDATE ZIP
      # ============================================================
      - name: "03 - 🔎 Find & Validate ZIP"
        shell: bash
        run: |
          set -e
          
          # Cari ZIP terbaru
          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            -printf "%T@ %p\n" \
            | sort -nr \
            | head -n1 \
            | cut -d' ' -f2-)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ERROR: Tidak ada file ZIP ditemukan!"
            echo "📌 Upload file ZIP project Flutter ke repository."
            exit 1
          fi
          
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "✅ ZIP ditemukan: $ZIP_FILE"
          
          # Validasi ZIP
          if ! unzip -t "$ZIP_FILE" >/dev/null 2>&1; then
            echo "❌ ERROR: ZIP rusak atau tidak valid!"
            exit 1
          fi
          
          echo "✅ ZIP valid."

      # ============================================================
      # 04. EXTRACT ZIP
      # ============================================================
      - name: "04 - 📦 Extract ZIP"
        shell: bash
        run: |
          set -e
          
          rm -rf workspace/*
          
          if ! unzip -q "$ZIP_FILE" -d workspace; then
            echo "❌ ERROR: Gagal mengekstrak ZIP!"
            exit 1
          fi
          
          echo "✅ ZIP berhasil diekstrak."
          echo ""
          echo "📂 Struktur workspace:"
          ls -la workspace/

      # ============================================================
      # 05. DETECT FLUTTER PROJECT
      # ============================================================
      - name: "05 - 🐦 Detect Flutter Project"
        shell: bash
        run: |
          set -e
          
          PUBSPEC=$(find workspace \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/\.*" \
            | head -n 1)
          
          if [ -z "$PUBSPEC" ]; then
            echo "❌ ERROR: pubspec.yaml tidak ditemukan!"
            echo "📌 Pastikan ZIP berisi project Flutter yang valid."
            echo ""
            echo "📂 Isi workspace:"
            find workspace -type f -name "*.yaml" -o -name "*.yml" | head -20
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "✅ Flutter project ditemukan: $PROJECT_DIR"

      # ============================================================
      # 06. VALIDATE FLUTTER STRUCTURE
      # ============================================================
      - name: "06 - 📂 Validate Flutter Structure"
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          
          # Cek file penting
          MISSING_FILES=""
          [ ! -f "pubspec.yaml" ] && MISSING_FILES="$MISSING_FILES pubspec.yaml"
          [ ! -d "lib" ] && MISSING_FILES="$MISSING_FILES lib/"
          [ ! -d "android" ] && MISSING_FILES="$MISSING_FILES android/"
          
          if [ -n "$MISSING_FILES" ]; then
            echo "❌ ERROR: Struktur project tidak lengkap!"
            echo "📌 Missing: $MISSING_FILES"
            exit 1
          fi
          
          echo "✅ Struktur project Flutter valid."

      # ============================================================
      # 07. SETUP JAVA (Dengan Cache)
      # ============================================================
      - name: "07 - ☕ Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ============================================================
      # 08. CACHE GRADLE
      # ============================================================
      - name: "08 - 💾 Cache Gradle"
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ============================================================
      # 09. SETUP FLUTTER
      # ============================================================
      - name: "09 - 🐦 Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # ============================================================
      # 10. CACHE PUB PACKAGES
      # ============================================================
      - name: "10 - 💾 Cache Pub Packages"
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            **/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # ============================================================
      # 11. FLUTTER DOCTOR
      # ============================================================
      - name: "11 - 🩺 Flutter Doctor"
        run: |
          flutter doctor -v
          echo ""
          echo "📦 Flutter version:"
          flutter --version

      # ============================================================
      # 12. CLEAN & INSTALL DEPENDENCIES
      # ============================================================
      - name: "12 - 🧹 Clean & Install"
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          
          if [ "${{ github.event.inputs.enable_clean }}" == "true" ]; then
            echo "🧹 Cleaning..."
            flutter clean || echo "⚠️ Clean warning (ignored)"
          fi
          
          echo "📦 Installing dependencies..."
          if ! flutter pub get; then
            echo "❌ ERROR: Gagal install dependencies!"
            echo ""
            echo "📋 Cek pubspec.yaml untuk error:"
            cat pubspec.yaml
            exit 1
          fi
          
          echo "✅ Dependencies installed."

      # ============================================================
      # 13. RUN TESTS (Optional)
      # ============================================================
      - name: "13 - 🧪 Run Tests"
        if: github.event.inputs.enable_test == 'true'
        shell: bash
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          
          if [ -d "test" ] && [ "$(ls -A test)" ]; then
            echo "🧪 Menjalankan tests..."
            flutter test --coverage
            echo "✅ Tests completed"
          else
            echo "ℹ️ Tidak ada test ditemukan, skip..."
          fi

      # ============================================================
      # 14. FLUTTER ANALYZE
      # ============================================================
      - name: "14 - 🧠 Flutter Analyze"
        shell: bash
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          flutter analyze || echo "⚠️ Ada warning, tapi build tetap lanjut"

      # ============================================================
      # 15. VALIDATE ANDROID
      # ============================================================
      - name: "15 - 🤖 Validate Android"
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            echo "✅ gradlew found and executable"
          fi
          
          if [ -f "android/app/build.gradle" ] || [ -f "android/app/build.gradle.kts" ]; then
            echo "✅ Android config found"
          else
            echo "❌ ERROR: build.gradle tidak ditemukan!"
            exit 1
          fi

      # ============================================================
      # 16. BUILD RELEASE APK
      # ============================================================
      - name: "16 - 🔨 Build Release APK"
        if: github.event.inputs.build_mode == 'release' || github.event.inputs.build_mode == 'both'
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          
          echo "🔨 Building RELEASE APK..."
          echo "⏳ Ini mungkin memakan waktu 3-5 menit..."
          
          if ! flutter build apk --release --no-tree-shake-icons; then
            echo "❌ ERROR: Release build gagal!"
            exit 1
          fi
          
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK" ]; then
            mkdir -p output
            cp "$APK" "output/GARSX-APP-RELEASE.apk"
            echo "✅ Release APK siap: output/GARSX-APP-RELEASE.apk"
          else
            echo "❌ Release APK tidak ditemukan!"
            exit 1
          fi

      # ============================================================
      # 17. BUILD DEBUG APK
      # ============================================================
      - name: "17 - 🔨 Build Debug APK"
        if: github.event.inputs.build_mode == 'debug' || github.event.inputs.build_mode == 'both'
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          
          echo "🔨 Building DEBUG APK..."
          echo "⏳ Ini mungkin memakan waktu 3-5 menit..."
          
          if ! flutter build apk --debug --no-tree-shake-icons; then
            echo "❌ ERROR: Debug build gagal!"
            exit 1
          fi
          
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-debug.apk"
          if [ -f "$APK" ]; then
            mkdir -p output
            cp "$APK" "output/GARSX-APP-DEBUG.apk"
            echo "✅ Debug APK siap: output/GARSX-APP-DEBUG.apk"
          else
            echo "❌ Debug APK tidak ditemukan!"
            exit 1
          fi

      # ============================================================
      # 18. BUILD PROFILE APK
      # ============================================================
      - name: "18 - 🔨 Build Profile APK"
        if: github.event.inputs.build_mode == 'profile'
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          
          echo "🔨 Building PROFILE APK..."
          echo "⏳ Ini mungkin memakan waktu 3-5 menit..."
          
          if ! flutter build apk --profile --no-tree-shake-icons; then
            echo "❌ ERROR: Profile build gagal!"
            exit 1
          fi
          
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-profile.apk"
          if [ -f "$APK" ]; then
            mkdir -p output
            cp "$APK" "output/GARSX-APP-PROFILE.apk"
            echo "✅ Profile APK siap: output/GARSX-APP-PROFILE.apk"
          else
            echo "❌ Profile APK tidak ditemukan!"
            exit 1
          fi

      # ============================================================
      # 19. VERIFY APKS & CREATE CHECKSUMS
      # ============================================================
      - name: "19 - ✅ Verify & Checksum"
        shell: bash
        run: |
          set -e
          
          echo "════════════════════════════════════════"
          echo "  📊 BUILD SUMMARY"
          echo "════════════════════════════════════════"
          echo ""
          
          # Verifikasi setiap APK
          for apk in output/*.apk; do
            if [ -f "$apk" ]; then
              SIZE=$(stat -c%s "$apk" 2>/dev/null || stat -f%z "$apk" 2>/dev/null)
              NAME=$(basename "$apk")
              echo "✅ $NAME: $((SIZE/1024/1024)) MB"
              
              # Buat checksum
              sha256sum "$apk" > "$apk.sha256"
            fi
          done
          
          echo ""
          echo "📂 Output:"
          ls -lh output/

      # ============================================================
      # 20. CREATE BUILD INFO
      # ============================================================
      - name: "20 - 📝 Create Build Info"
        shell: bash
        run: |
          cat > output/build-info.txt <<EOF
          ════════════════════════════════════════
             GARSX FLUTTER BUILD REPORT
          ════════════════════════════════════════
          
          📱 BUILD INFO
          ──────────────────────────────────────
          Status: ✅ SUCCESS
          Mode: ${{ github.event.inputs.build_mode }}
          Flutter: ${{ env.FLUTTER_CHANNEL }}
          Java: ${{ env.JAVA_VERSION }}
          Tests: ${{ github.event.inputs.enable_test }}
          
          📦 APK INFO
          ──────────────────────────────────────
          EOF
          
          for apk in output/*.apk; do
            if [ -f "$apk" ]; then
              NAME=$(basename "$apk")
              SIZE=$(du -h "$apk" | cut -f1)
              SHA=$(sha256sum "$apk" | cut -d' ' -f1)
              echo "  $NAME" >> output/build-info.txt
              echo "    Size: $SIZE" >> output/build-info.txt
              echo "    SHA256: $SHA" >> output/build-info.txt
            fi
          done
          
          cat >> output/build-info.txt <<EOF
          
          🔗 REPOSITORY
          ──────────────────────────────────────
          Repo: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Run: ${{ github.run_id }}
          Trigger: ${{ github.event_name }}
          
          ⏱️ TIMESTAMP
          ──────────────────────────────────────
          Build: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          ════════════════════════════════════════
          EOF
          
          cat output/build-info.txt

      # ============================================================
      # 21. UPLOAD APKS
      # ============================================================
      - name: "21 - 📤 Upload APKs"
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-APKs
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      # ============================================================
      # 22. UPLOAD BUILD INFO
      # ============================================================
      - name: "22 - 📤 Upload Build Info"
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-BUILD-INFO
          path: |
            output/build-info.txt
            output/*.sha256
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 23. SUCCESS SUMMARY
      # ============================================================
      - name: "23 - 🎉 Build Success"
        if: success()
        run: |
          cat > "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## 🎉 GARSX BUILD BERHASIL!
          
          ### 📱 Build Mode: ${{ github.event.inputs.build_mode }}
          
          ### 📦 APK yang dihasilkan:
          EOF
          
          for apk in output/*.apk; do
            if [ -f "$apk" ]; then
              NAME=$(basename "$apk" .apk)
              SIZE=$(du -h "$apk" | cut -f1)
              echo "- **$NAME** ✅ ($SIZE)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          
          ### 📥 Download
          Download APK dari **Artifacts** di bawah.
          
          ### ✅ Status
          - Build: Success
          - Tests: ${{ github.event.inputs.enable_test }}
          - Clean: ${{ github.event.inputs.enable_clean }}
          
          ---
          *Generated by GitHub Actions*
          EOF
          
          echo ""
          echo "🎉 BUILD SUCCESS!"
          echo "📦 APKs:"
          ls -lh output/*.apk

      # ============================================================
      # 24. FAILURE HANDLING
      # ============================================================
      - name: "24 - ❌ Build Failed"
        if: failure()
        run: |
          cat > "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## ❌ GARSX BUILD GAGAL
          
          ### 🔍 Troubleshooting Steps
          1. **Cek log di atas** untuk error spesifik
          2. **Pastikan ZIP** berisi project Flutter lengkap
          3. **Cek pubspec.yaml** tidak ada error syntax
          4. **Cek android/** folder ada dan valid
          5. **Pastikan file ZIP** tidak corrupt
          
          ### 📋 Common Issues
          - `pubspec.yaml` missing → ZIP bukan project Flutter
          - `flutter pub get` failed → Dependency conflict
          - `flutter build` failed → Code error atau konfigurasi
          
          ### 🔧 Tips
          - Build di lokal dulu untuk test
          - Upload ZIP yang sudah terbukti berjalan
          - Cek struktur project sesuai standar Flutter
          
          ---
          *Periksa log step yang gagal untuk detail lebih lanjut.*
          EOF
          
          echo ""
          echo "❌ BUILD GAGAL!"
          echo "📌 Periksa log di atas untuk detail error."

      # ============================================================
      # 25. CLEANUP
      # ============================================================
      - name: "25 - 🧹 Cleanup"
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          # Hapus file besar untuk hemat storage
          rm -rf workspace/**/build/cache 2>/dev/null || true
          rm -rf workspace/**/.dart_tool 2>/dev/null || true
          rm -rf workspace/**/android/.gradle 2>/dev/null || true
          echo "✅ Cleanup completed"
