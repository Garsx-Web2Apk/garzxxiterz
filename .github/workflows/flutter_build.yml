name: Flutter APK Builder Complete with Error Log

on:
  push:
    branches: [ main, develop, staging ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - profile
      flavor:
        description: 'Flavor'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development

env:
  FLUTTER_VERSION: '3.19.6'
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Xmx4g -Xms2g'

jobs:
  # ============================================
  # JOB 1: BUILD ANDROID APK
  # ============================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    # 1️⃣ CHECKOUT REPOSITORY
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
    
    # 2️⃣ SETUP JAVA
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'gradle'
    
    # 3️⃣ SETUP FLUTTER SDK
    - name: Setup Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
    
    - name: Flutter Doctor
      run: flutter doctor -v
    
    # 4️⃣ CACHE DEPENDENCIES
    - name: Cache Pub Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
          .dart_tool
        key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-pub-
    
    - name: Cache Gradle Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          android/.gradle
        key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    # 5️⃣ INSTALL DEPENDENCIES
    - name: Install Flutter Dependencies
      run: |
        flutter clean
        flutter pub get
    
    # 6️⃣ GENERATE FILES
    - name: Generate Code
      run: |
        flutter pub run build_runner build --delete-conflicting-outputs
      continue-on-error: true
    
    # 7️⃣ LINTING & ANALYZE
    - name: Dart Code Analysis
      run: |
        flutter analyze
        flutter format --set-exit-if-changed lib/
    
    # 8️⃣ RUN TESTS
    - name: Run Unit Tests
      run: |
        flutter test --coverage
        flutter test --integration
    
    # 9️⃣ DECODE KEYSTORE
    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
      if: github.event_name != 'pull_request'
    
    - name: Create Key Properties
      run: |
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "storeFile=keystore.jks" >> android/key.properties
      if: github.event_name != 'pull_request'
    
    # 🔟 BUILD APK
    - name: Build Flutter APK
      id: build_apk
      run: |
        if [ "${{ github.event.inputs.build_type }}" == "debug" ]; then
          flutter build apk --debug \
            --flavor ${{ github.event.inputs.flavor }} \
            --dart-define=APP_ENV=${{ github.event.inputs.flavor }} 2>&1 | tee build.log
        else
          flutter build apk --release \
            --split-per-abi \
            --flavor ${{ github.event.inputs.flavor }} \
            --dart-define=APP_ENV=${{ github.event.inputs.flavor }} \
            --dart-define=API_URL=${{ secrets.API_URL }} 2>&1 | tee build.log
        fi
      env:
        JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk_${{ env.JAVA_VERSION }}-x64/current/
    
    # 1️⃣1️⃣ SIGN & ZIPALIGN
    - name: Sign and Zipalign APK
      run: |
        cd build/app/outputs/flutter-apk/
        
        for apk in *.apk; do
          if [[ $apk == *"unsigned"* ]]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore ${{ secrets.KEYSTORE_PATH }} \
              -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
              -keypass ${{ secrets.KEY_PASSWORD }} \
              $apk ${{ secrets.KEY_ALIAS }}
            
            zipalign -v -p 4 $apk ${apk//unsigned/signed}
          fi
        done
      if: github.event_name != 'pull_request'
    
    # 1️⃣2️⃣ GENERATE APK INFO
    - name: Generate APK Info
      run: |
        cd build/app/outputs/flutter-apk/
        echo "## APK Build Information" > apk_info.md
        echo "- **Status:** ✅ SUCCESS" >> apk_info.md
        echo "- **Build Date:** $(date '+%Y-%m-%d %H:%M:%S')" >> apk_info.md
        echo "- **Commit:** ${{ github.sha }}" >> apk_info.md
        echo "- **Branch:** ${{ github.ref_name }}" >> apk_info.md
        echo "- **Flavor:** ${{ github.event.inputs.flavor }}" >> apk_info.md
        echo "- **Build Type:** ${{ github.event.inputs.build_type }}" >> apk_info.md
        echo "- **Files:**" >> apk_info.md
        ls -lh *.apk | awk '{print "  - " $9 " (" $5 ")"}' >> apk_info.md
    
    # 1️⃣3️⃣ UPLOAD SUCCESS ARTIFACTS
    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: flutter-apk-${{ github.event.inputs.flavor }}-${{ github.sha }}
        path: |
          build/app/outputs/flutter-apk/*.apk
          build/app/outputs/flutter-apk/apk_info.md
        retention-days: 30
        compression-level: 6
      if: success()
    
    # ============================================
    # 🔥 ERROR HANDLING & NOTIFICATION
    # ============================================
    
    # 1️⃣4️⃣ SAVE BUILD LOG (jika gagal)
    - name: Save Build Log on Failure
      if: failure()
      run: |
        mkdir -p error_logs
        # Copy Flutter build log
        if [ -f build.log ]; then
          cp build.log error_logs/flutter_build.log
        fi
        
        # Copy Gradle logs
        if [ -d android/build ]; then
          find android -name "*.log" -exec cp {} error_logs/ \;
        fi
        
        # Copy Flutter doctor
        flutter doctor -v > error_logs/flutter_doctor.log 2>&1
        
        # Copy pubspec and lock
        cp pubspec.yaml error_logs/ 2>/dev/null || true
        cp pubspec.lock error_logs/ 2>/dev/null || true
        
        # Create error summary
        echo "❌ BUILD FAILED" > error_logs/ERROR_SUMMARY.txt
        echo "Timestamp: $(date '+%Y-%m-%d %H:%M:%S')" >> error_logs/ERROR_SUMMARY.txt
        echo "Commit: ${{ github.sha }}" >> error_logs/ERROR_SUMMARY.txt
        echo "Branch: ${{ github.ref_name }}" >> error_logs/ERROR_SUMMARY.txt
        echo "" >> error_logs/ERROR_SUMMARY.txt
        echo "LAST 50 LINES OF BUILD LOG:" >> error_logs/ERROR_SUMMARY.txt
        tail -50 build.log >> error_logs/ERROR_SUMMARY.txt 2>/dev/null || echo "No build.log found" >> error_logs/ERROR_SUMMARY.txt
    
    # 1️⃣5️⃣ UPLOAD ERROR LOGS
    - name: Upload Error Logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: error-logs-${{ github.run_id }}
        path: error_logs/
        retention-days: 30
    
    # 1️⃣6️⃣ SEND TELEGRAM NOTIFICATION (SUCCESS)
    - name: Send Telegram Success Notification
      uses: appleboy/telegram-action@master
      if: success() && github.event_name != 'pull_request'
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ✅ **APK BUILD SUCCESS!**
          📱 App: ${{ github.repository }}
          🏷️ Version: v1.0.${{ github.run_number }}
          🌿 Branch: ${{ github.ref_name }}
          📦 Flavor: ${{ github.event.inputs.flavor }}
          🔗 Download: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    
    # 1️⃣7️⃣ SEND TELEGRAM NOTIFICATION (FAILURE) - DENGAN ERROR LOG
    - name: Send Telegram Error Notification
      uses: appleboy/telegram-action@master
      if: failure()
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ❌ **APK BUILD FAILED!**
          
          📁 Repository: ${{ github.repository }}
          🌿 Branch: ${{ github.ref_name }}
          📦 Flavor: ${{ github.event.inputs.flavor }}
          👤 Triggered by: ${{ github.actor }}
          🔗 Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          📋 **Error Summary:**
          ${{ steps.build_apk.outcome == 'failure' && '❌ Build step failed' || '⚠️ Other error occurred' }}
          
          📥 **Download Error Logs:**
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    
    # 1️⃣8️⃣ SEND TELEGRAM WITH ERROR LOG FILE
    - name: Send Error Log File to Telegram
      if: failure()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        document: error_logs/ERROR_SUMMARY.txt
        message: "📄 Error Summary attached below:"
    
    # 1️⃣9️⃣ SEND EMAIL NOTIFICATION
    - name: Send Email Notification
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{secrets.MAIL_USERNAME}}
        password: ${{secrets.MAIL_PASSWORD}}
        subject: "❌ Build Failed - ${{ github.repository }} #${{ github.run_number }}"
        to: ${{ secrets.NOTIFICATION_EMAIL }}
        from: GitHub Actions
        body: |
          Build FAILED!
          
          Repository: ${{ github.repository }}
          Run ID: ${{ github.run_id }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Flavor: ${{ github.event.inputs.flavor }}
          Triggered by: ${{ github.actor }}
          
          Error Logs: 
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          Please check the error logs attached in artifacts.

  # ============================================
  # JOB 2: BUILD ANDROID APP BUNDLE
  # ============================================
  build-aab:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && success()
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'
    
    - name: Install Dependencies
      run: flutter pub get
    
    - name: Build AAB
      id: build_aab
      run: |
        flutter build appbundle --release 2>&1 | tee aab_build.log
    
    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: flutter-aab-${{ github.sha }}
        path: build/app/outputs/bundle/release/*.aab
    
    # ERROR HANDLING FOR AAB
    - name: Save AAB Error Logs
      if: failure()
      run: |
        mkdir -p error_logs_aab
        if [ -f aab_build.log ]; then
          cp aab_build.log error_logs_aab/
        fi
        flutter doctor -v > error_logs_aab/flutter_doctor.log 2>&1
    
    - name: Upload AAB Error Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: aab-error-logs-${{ github.run_id }}
        path: error_logs_aab/
    
    - name: Send AAB Error Notification
      if: failure()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ❌ **AAB BUILD FAILED!**
          📁 Repository: ${{ github.repository }}
          🔗 Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          📥 Download Error Logs:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ============================================
  # JOB 3: FALLBACK NOTIFICATION (jika semua gagal)
  # ============================================
  notify-fallback:
    name: Fallback Notification
    runs-on: ubuntu-latest
    needs: [build-android, build-aab]
    if: always() && (needs.build-android.result == 'failure' || needs.build-aab.result == 'failure')
    
    steps:
    - name: Send Fallback Notification
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          🔔 **BUILD STATUS SUMMARY**
          
          ✅ build-android: ${{ needs.build-android.result }}
          ✅ build-aab: ${{ needs.build-aab.result }}
          
          📁 Repository: ${{ github.repository }}
          🔗 Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          ⚠️ One or more builds failed!
