name: 🐛 Build APK Bug WA

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP Project"
        required: true
        type: string
      tag:
        description: "Tag Build"
        required: true
        type: string
        default: "v2.0.0"
      build_mode:
        description: "Mode Build"
        required: true
        type: choice
        options:
          - debug
          - release
        default: release

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: 🏗️ Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BUILD_MODE: ${{ inputs.build_mode }}
      BUILD_TAG: ${{ inputs.tag }}
      ZIP_URL: ${{ inputs.zip_url }}
      GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

    steps:
      - name: "1. Checkout Repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: "2. Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "2. Setup Flutter SDK"
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: "2. Setup Android SDK"
        shell: bash
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/android-sdk}
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          echo "✅ Android SDK ready!"

      - name: "3. Download Project ZIP"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf input_zip extracted build_project
          mkdir -p input_zip extracted build_project

          if [ -z "${ZIP_URL}" ]; then
            echo "::error::ZIP_URL tidak boleh kosong!"
            exit 1
          fi

          echo "📥 Downloading project from: ${ZIP_URL}"
          echo "⏱️ Timeout: 180 detik, Retry: 5x"

          # FIX: Timeout lebih lama + retry 5x
          if curl --fail --location --retry 5 \
            --connect-timeout 30 \
            --max-time 180 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/octet-stream" \
            "${ZIP_URL}" \
            --output input_zip/project.zip; then
            
            echo "✅ Download successful!"
          else
            echo "::error::Download ZIP gagal! Cek URL dan koneksi."
            echo "URL: ${ZIP_URL}"
            exit 1
          fi

          if [ ! -s input_zip/project.zip ]; then
            echo "::error::File ZIP kosong atau tidak ditemukan!"
            exit 1
          fi

          FILE_SIZE=$(du -h input_zip/project.zip | cut -f1)
          echo "📦 File size: $FILE_SIZE"

      - name: "3. Extract Project"
        shell: bash
        run: |
          set -euo pipefail
          unzip -q input_zip/project.zip -d extracted || {
            echo "::error::Gagal mengekstrak ZIP! File mungkin corrupt."
            exit 1
          }

          PUBSPEC="$(find extracted -type f -name pubspec.yaml -print -quit || true)"
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml tidak ditemukan di ZIP!"
            echo "📂 Struktur extracted:"
            ls -la extracted/ || true
            find extracted -type f -name "*.yaml" -print 2>/dev/null || true
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "✅ Flutter project found: $PROJECT_DIR"

          shopt -s dotglob
          cp -a "$PROJECT_DIR"/. build_project/
          shopt -u dotglob

          test -f build_project/pubspec.yaml || {
            echo "::error::Gagal copy project!"
            exit 1
          }
          echo "✅ Project prepared!"

      - name: "4. Install Dependencies"
        working-directory: build_project
        shell: bash
        run: |
          flutter clean || true
          flutter pub get || {
            echo "::error::flutter pub get gagal!"
            exit 1
          }
          flutter precache --android
          echo "✅ Dependencies installed!"

      - name: "5. Fix AndroidX"
        working-directory: build_project
        shell: bash
        run: |
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/gradle-.*-all.zip/gradle-8.7-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi
          if [ -f android/build.gradle ]; then
            sed -i 's/com.android.tools.build:gradle:.*/com.android.tools.build:gradle:8.6.1/g' android/build.gradle
          fi
          echo "✅ AndroidX fixes applied!"

      - name: "6. Prepare Android"
        working-directory: build_project
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --no-pub .
          fi
          
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' "$MANIFEST"
          fi
          echo "✅ Manifest ready!"

      - name: "7. Compiling Dart Sources & Build APK"
        working-directory: build_project
        shell: bash
        run: |
          if [ "$BUILD_MODE" = "debug" ]; then
            flutter build apk --debug --no-pub --no-tree-shake-icons \
              --build-number="${GITHUB_RUN_NUMBER}" || {
              echo "::error::Build debug gagal!"
              exit 1
            }
          else
            flutter build apk --release --no-pub --no-tree-shake-icons \
              --build-number="${GITHUB_RUN_NUMBER}" || {
              echo "::error::Build release gagal!"
              exit 1
            }
          fi
          echo "✅ Build completed!"

      - name: "8. Gradle Assemble APK"
        working-directory: build_project/android
        shell: bash
        run: |
          if [ "$BUILD_MODE" = "debug" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon --parallel || {
              echo "::error::Gradle assembleDebug gagal!"
              exit 1
            }
          else
            ./gradlew :app:assembleRelease --stacktrace --no-daemon --parallel || {
              echo "::error::Gradle assembleRelease gagal!"
              exit 1
            }
          fi
          echo "✅ Gradle assemble completed!"

      - name: "9. Signing & Packaging"
        working-directory: build_project
        shell: bash
        run: |
          mkdir -p final_apk

          APK=""
          for path in "build/app/outputs/flutter-apk" "build/app/outputs/apk" "android/app/build/outputs/apk"; do
            if [ -d "$path" ]; then
              APK="$(find $path -type f -name '*.apk' -print -quit 2>/dev/null || true)"
              [ -n "$APK" ] && break
            fi
          done

          if [ -z "$APK" ]; then
            APK="$(find . -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$APK" ]; then
            echo "::error::APK hasil build tidak ditemukan!"
            exit 1
          fi

          OUT="xxo25-${BUILD_MODE}-${BUILD_TAG}.apk"
          cp "$APK" "final_apk/$OUT"
          echo "✅ APK: $OUT"
          ls -lh final_apk/

      - name: "10. Finalizing Build"
        working-directory: build_project
        shell: bash
        run: |
          APK="$(find final_apk -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::APK tidak valid!"
            exit 1
          fi
          sha256sum "$APK" | tee final_apk/SHA256SUMS.txt
          echo "APK_READY=$APK" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(du -h "$APK" | cut -f1)" >> "$GITHUB_ENV"

      - name: "11. Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: xxo25-${{ inputs.build_mode }}-${{ inputs.tag }}
          path: build_project/final_apk/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: "12. ✅ Build Success!"
        run: |
          echo "=============================================="
          echo "     ✅ BUILD SUCCESS! ✅"
          echo "=============================================="
          echo "Mode : $BUILD_MODE"
          echo "Tag  : $BUILD_TAG"
          echo "APK  : $APK_READY"
          echo "Size : $APK_SIZE"
          echo "=============================================="

      - name: "❌ Build Error Log"
        if: ${{ failure() }}
        run: |
          echo "=============================================="
          echo "     ❌ BUILD FAILED! ❌"
          echo "=============================================="
          echo "Mode: $BUILD_MODE"
          echo "Tag : $BUILD_TAG"
          flutter doctor -v || true
          echo "=============================================="
