name: GARSX Flutter Build Engine

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "Nama ZIP Flutter project"
        required: true
        default: "project.zip"

      release_tag:
        description: "GitHub Release tag"
        required: true
        default: "v1.0.0"

      release_name:
        description: "GitHub Release name"
        required: true
        default: "GARSX Flutter APK"

permissions:
  contents: write

jobs:
  build:

    name: GARSX Safe Full Flutter Build
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 01. CHECKOUT
      # ==========================================================

      - name: "01 - Checkout Repository"
        uses: actions/checkout@v4


      # ==========================================================
      # 02. SYSTEM UPDATE
      # ==========================================================

      - name: "02 - Update System"
        run: |
          sudo apt-get update


      # ==========================================================
      # 03. BASIC DEPENDENCIES
      # ==========================================================

      - name: "03 - Install System Dependencies"
        run: |
          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            xz-utils \
            libglu1-mesa \
            clang \
            cmake \
            ninja-build \
            pkg-config


      # ==========================================================
      # 04. FIND ZIP
      # ==========================================================

      - name: "04 - Find ZIP"
        env:
          ZIP_FILE: ${{ github.event.inputs.zip_file }}
        run: |
          set -e

          if [ ! -f "$ZIP_FILE" ]; then
            echo "❌ ZIP tidak ditemukan: $ZIP_FILE"
            echo ""
            echo "ZIP yang tersedia:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "✅ ZIP ditemukan:"
          ls -lh "$ZIP_FILE"


      # ==========================================================
      # 05. VALIDATE ZIP
      # ==========================================================

      - name: "05 - Validate ZIP"
        run: |
          set -e

          unzip -t "$ZIP_FILE"

          echo "✅ ZIP valid."


      # ==========================================================
      # 06. EXTRACT
      # ==========================================================

      - name: "06 - Extract Flutter Project"
        run: |
          set -e

          rm -rf flutter_project

          mkdir -p flutter_project

          unzip -q "$ZIP_FILE" -d flutter_project

          echo "✅ ZIP berhasil diekstrak."


      # ==========================================================
      # 07. DETECT PUBSPEC
      # ==========================================================

      - name: "07 - Detect pubspec.yaml"
        run: |
          set -e

          PUBSPEC=$(find flutter_project \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.dart_tool/*" \
            -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "✅ Flutter project:"
          echo "$PROJECT_DIR"


      # ==========================================================
      # 08. VALIDATE FLUTTER STRUCTURE
      # ==========================================================

      - name: "08 - Validate Flutter Project"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          test -f pubspec.yaml
          test -d lib

          echo "pubspec.yaml : OK"
          echo "lib/         : OK"


      # ==========================================================
      # 09. SHOW PUBSPEC
      # ==========================================================

      - name: "09 - Read Project Configuration"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========== PUBSPEC =========="
          sed -n '1,260p' pubspec.yaml


      # ==========================================================
      # 10. SETUP FLUTTER
      # ==========================================================

      - name: "10 - Setup Flutter Stable"
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ==========================================================
      # 11. FLUTTER / DART VERSION
      # ==========================================================

      - name: "11 - Verify Flutter and Dart"
        run: |
          flutter --version
          dart --version


      # ==========================================================
      # 12. DETECT ANDROID PROJECT
      # ==========================================================

      - name: "12 - Detect Android Project"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -d android ]; then
            echo "ANDROID_PROJECT=true" >> "$GITHUB_ENV"
            echo "✅ Android project ditemukan."
          else
            echo "ANDROID_PROJECT=false" >> "$GITHUB_ENV"
            echo "⚠️ Android project belum ada."
          fi


      # ==========================================================
      # 13. GENERATE ANDROID ONLY IF NEEDED
      # ==========================================================

      - name: "13 - Prepare Android Platform"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ "$ANDROID_PROJECT" = "false" ]; then

            echo "Android platform diperlukan."
            echo "Membuat Android project..."

            flutter create \
              --platforms=android \
              .

          else

            echo "Android project sudah tersedia."
            echo "Tidak membuat ulang."

          fi


      # ==========================================================
      # 14. SETUP JAVA
      # ==========================================================

      - name: "14 - Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================================
      # 15. SETUP ANDROID SDK
      # ==========================================================

      - name: "15 - Setup Android SDK"
        uses: android-actions/setup-android@v3


      # ==========================================================
      # 16. DETECT ANDROID CONFIGURATION
      # ==========================================================

      - name: "16 - Detect Android Configuration"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========== ANDROID CONFIG =========="

          if [ -f android/app/build.gradle ]; then
            echo "android/app/build.gradle ditemukan"
            cat android/app/build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            echo "android/app/build.gradle.kts ditemukan"
            cat android/app/build.gradle.kts
          fi

          if [ -f android/build.gradle ]; then
            echo "android/build.gradle ditemukan"
            cat android/build.gradle
          fi

          if [ -f android/build.gradle.kts ]; then
            echo "android/build.gradle.kts ditemukan"
            cat android/build.gradle.kts
          fi


      # ==========================================================
      # 17. DETECT COMPILE SDK
      # ==========================================================

      - name: "17 - Detect Android SDK Requirements"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          FILES=""

          [ -f android/app/build.gradle ] && FILES="$FILES android/app/build.gradle"
          [ -f android/app/build.gradle.kts ] && FILES="$FILES android/app/build.gradle.kts"

          SDK_VERSION=$(grep -rhoE \
            'compileSdk(Versions)?[[:space:]]*[=:]?[[:space:]]*[0-9]+' \
            $FILES 2>/dev/null \
            | grep -oE '[0-9]+' \
            | head -1 || true)

          if [ -z "$SDK_VERSION" ]; then
            SDK_VERSION="35"
          fi

          echo "ANDROID_COMPILE_SDK=$SDK_VERSION" >> "$GITHUB_ENV"

          echo "📱 compileSdk detected: $SDK_VERSION"


      # ==========================================================
      # 18. INSTALL ANDROID PLATFORM
      # ==========================================================

      - name: "18 - Install Required Android Platform"
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}"


      # ==========================================================
      # 19. DETECT BUILD TOOLS
      # ==========================================================

      - name: "19 - Detect Build Tools"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          FILES=""

          [ -f android/app/build.gradle ] && FILES="$FILES android/app/build.gradle"
          [ -f android/app/build.gradle.kts ] && FILES="$FILES android/app/build.gradle.kts"

          BUILD_TOOLS=$(grep -rhoE \
            'buildToolsVersion[[:space:]]*[=:][[:space:]]*["'\''][0-9.]+' \
            $FILES 2>/dev/null \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
            | head -1 || true)

          if [ -z "$BUILD_TOOLS" ]; then
            BUILD_TOOLS="35.0.0"
          fi

          echo "ANDROID_BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

          echo "🛠️ Build Tools: $BUILD_TOOLS"


      # ==========================================================
      # 20. INSTALL BUILD TOOLS
      # ==========================================================

      - name: "20 - Install Android Build Tools"
        run: |
          set -e

          sdkmanager \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools"


      # ==========================================================
      # 21. DETECT NDK
      # ==========================================================

      - name: "21 - Detect NDK Requirement"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          NDK_VERSION=""

          if [ -f android/app/build.gradle ]; then
            NDK_VERSION=$(grep -oE \
              'ndkVersion[[:space:]]*[=:][[:space:]]*["'\''][^"'\'']+' \
              android/app/build.gradle \
              | head -1 \
              | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/' || true)
          fi

          if [ -z "$NDK_VERSION" ] && [ -f android/app/build.gradle.kts ]; then
            NDK_VERSION=$(grep -oE \
              'ndkVersion[[:space:]]*=[[:space:]]*["'\''][^"'\'']+' \
              android/app/build.gradle.kts \
              | head -1 \
              | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/' || true)
          fi

          if [ -n "$NDK_VERSION" ]; then
            echo "NDK_REQUIRED=true" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"
            echo "🔧 NDK diperlukan: $NDK_VERSION"
          else
            echo "NDK_REQUIRED=false" >> "$GITHUB_ENV"
            echo "ℹ️ NDK tidak didefinisikan."
          fi


      # ==========================================================
      # 22. INSTALL NDK ONLY IF REQUIRED
      # ==========================================================

      - name: "22 - Install Required NDK"
        if: env.NDK_REQUIRED == 'true'
        run: |
          set -e

          sdkmanager \
            "ndk;${ANDROID_NDK_VERSION}"


      # ==========================================================
      # 23. ACCEPT LICENSES
      # ==========================================================

      - name: "23 - Accept Android Licenses"
        run: |
          yes | sdkmanager --licenses || true


      # ==========================================================
      # 24. FLUTTER CONFIGURATION
      # ==========================================================

      - name: "24 - Configure Flutter Android"
        run: |
          flutter config --enable-android


      # ==========================================================
      # 25. FLUTTER DOCTOR
      # ==========================================================

      - name: "25 - Flutter Doctor"
        run: |
          flutter doctor -v


      # ==========================================================
      # 26. CHECK GRADLE WRAPPER
      # ==========================================================

      - name: "26 - Check Gradle Wrapper"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ ! -f android/gradlew ]; then
            echo "❌ android/gradlew tidak ditemukan."
            exit 1
          fi

          chmod +x android/gradlew

          echo "✅ Gradle wrapper tersedia."


      # ==========================================================
      # 27. GRADLE VERSION
      # ==========================================================

      - name: "27 - Verify Gradle"
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          ./gradlew --version


      # ==========================================================
      # 28. FLUTTER CLEAN
      # ==========================================================

      - name: "28 - Flutter Clean"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean


      # ==========================================================
      # 29. CLEAN BUILD DIRECTORY
      # ==========================================================

      - name: "29 - Clean Old Build"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf build


      # ==========================================================
      # 30. GET DEPENDENCIES
      # ==========================================================

      - name: "30 - Flutter Pub Get"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get


      # ==========================================================
      # 31. CODE GENERATION ONLY IF REQUIRED
      # ==========================================================

      - name: "31 - Optional Code Generation"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if grep -q "build_runner" pubspec.yaml; then

            echo "⚙️ build_runner ditemukan."

            dart run build_runner build \
              --delete-conflicting-outputs

          else

            echo "ℹ️ Code generation tidak diperlukan."

          fi


      # ==========================================================
      # 32. ANALYZE
      # ==========================================================

      - name: "32 - Flutter Analyze"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze --no-fatal-infos


      # ==========================================================
      # 33. TEST ONLY IF TEST EXISTS
      # ==========================================================

      - name: "33 - Flutter Test"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -d test ] && \
             find test -type f -name "*_test.dart" | grep -q .; then

            echo "🧪 Menjalankan test..."

            flutter test

          else

            echo "ℹ️ Test tidak tersedia."

          fi


      # ==========================================================
      # 34. FINAL ENVIRONMENT CHECK
      # ==========================================================

      - name: "34 - Final Environment Check"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========== FLUTTER =========="
          flutter --version

          echo ""
          echo "========== DART =========="
          dart --version

          echo ""
          echo "========== JAVA =========="
          java -version

          echo ""
          echo "========== ANDROID SDK =========="
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "========== GRADLE =========="
          cd android
          ./gradlew --version


      # ==========================================================
      # 35. BUILD FLUTTER APK
      # ==========================================================

      - name: "35 - Compile Flutter Release APK"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║          GARSX BUILD ENGINE              ║"
          echo "║          BUILDING ANDROID APP            ║"
          echo "╚══════════════════════════════════════════╝"
          echo ""

          flutter build apk --release

          echo ""
          echo "✅ Flutter build selesai."


      # ==========================================================
      # 36. FIND APK
      # ==========================================================

      - name: "36 - Find Generated APK"
        run: |
          set -e

          APK=$(find \
            "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "❌ APK tidak ditemukan."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "📱 APK ditemukan:"
          ls -lh "$APK"


      # ==========================================================
      # 37. PREPARE FINAL APPLICATION
      # ==========================================================

      - name: "37 - Prepare Final APK"
        run: |
          set -e

          rm -rf output
          mkdir -p output

          cp "$APK_PATH" \
            output/GARSX-Build.apk

          echo "✅ GARSX-Build.apk dibuat."


      # ==========================================================
      # 38. APK VALIDATION
      # ==========================================================

      - name: "38 - Validate APK"
        run: |
          set -e

          APK="output/GARSX-Build.apk"

          test -f "$APK"

          SIZE=$(stat -c%s "$APK")

          if [ "$SIZE" -le 0 ]; then
            echo "❌ APK kosong."
            exit 1
          fi

          echo "========== APK =========="
          ls -lh "$APK"

          echo ""
          echo "========== SHA256 =========="
          sha256sum "$APK"


      # ==========================================================
      # 39. UPLOAD ARTIFACT
      # ==========================================================

      - name: "39 - Upload APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-Build-APK
          path: output/GARSX-Build.apk
          if-no-files-found: error
          retention-days: 7


      # ==========================================================
      # 40. CREATE GITHUB RELEASE
      # ==========================================================

      - name: "40 - Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_name }}

          body: |
            # 🚀 GARSX Flutter Build

            ✅ Build berhasil.

            📱 Application:
            GARSX-Build.apk

            🏗️ Build:
            Flutter Release APK

            🐦 Flutter:
            Stable

            Generated by GARSX Build Engine.

          files: output/GARSX-Build.apk

          draft: false
          prerelease: false


      # ==========================================================
      # 41. FINAL SUCCESS
      # ==========================================================

      - name: "41 - Build Success"
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════╗"
          echo "║                                           ║"
          echo "║          ✅ BUILD BERHASIL                ║"
          echo "║                                           ║"
          echo "║          GARSX BUILD ENGINE               ║"
          echo "║                                           ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""

          echo "📦 Source:"
          echo "${{ github.event.inputs.zip_file }}"

          echo ""
          echo "📱 Application:"
          echo "GARSX-Build.apk"

          echo ""
          echo "🏷️ Release:"
          echo "${{ github.event.inputs.release_tag }}"

          echo ""
          echo "🚀 STATUS: READY"

          echo ""
          echo "==========================================="
          echo " ZIP                 : OK"
          echo " Flutter             : OK"
          echo " Dart                : OK"
          echo " Java                : OK"
          echo " Android SDK         : OK"
          echo " Android Platform    : OK"
          echo " Build Tools         : OK"
          echo " Platform Tools      : OK"
          echo " NDK (if required)   : OK"
          echo " Gradle              : OK"
          echo " Dependencies        : OK"
          echo " Code Generation     : OK"
          echo " Analyze             : OK"
          echo " Test                : OK"
          echo " Compilation         : OK"
          echo " APK                 : OK"
          echo " Verification        : OK"
          echo " Artifact            : OK"
          echo " GitHub Release      : OK"
          echo "==========================================="

          echo ""
          echo "📱 APPLICATION READY ✔"
