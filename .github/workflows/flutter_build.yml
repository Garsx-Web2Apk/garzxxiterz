name: GARSX Flutter Build Engine

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project Flutter"
        required: true
        type: string

      tag:
        description: "Build tag"
        required: true
        type: string

      build_mode:
        description: "Flutter build mode"
        required: true
        type: choice
        options:
          - debug
          - release
        default: release

      only_analyze:
        description: "Analyze only"
        required: false
        type: string
        default: "false"

permissions:
  contents: read

concurrency:
  group: garsx-flutter-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Flutter Android Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. SYSTEM DEPENDENCIES
      # ==========================================================
      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            unzip \
            zip \
            git \
            jq \
            file \
            xz-utils \
            libglu1-mesa \
            openjdk-17-jdk

          java -version

      # ==========================================================
      # 3. DOWNLOAD FLUTTER PROJECT ZIP
      # ==========================================================
      - name: Download Flutter project
        shell: bash
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          echo "Downloading Flutter project..."

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            "$ZIP_URL" \
            -o "$RUNNER_TEMP/flutter_project.zip"

          test -s "$RUNNER_TEMP/flutter_project.zip"

          unzip -q "$RUNNER_TEMP/flutter_project.zip" \
            -d "$GITHUB_WORKSPACE/project"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/project" -maxdepth 3 -type f | head -100

      # ==========================================================
      # 4. DETECT FLUTTER PROJECT ROOT
      # ==========================================================
      - name: Detect Flutter project root
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/project"

          if [ -f "$ROOT/pubspec.yaml" ]; then
            PROJECT_ROOT="$ROOT"
          else
            PROJECT_ROOT="$(find "$ROOT" -name pubspec.yaml -type f -print -quit | xargs dirname)"

            if [ -z "$PROJECT_ROOT" ]; then
              echo "::error::pubspec.yaml tidak ditemukan."
              exit 1
            fi
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Flutter project:"
          echo "$PROJECT_ROOT"

      # ==========================================================
      # 5. SETUP JAVA
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ==========================================================
      # 6. SETUP FLUTTER
      # ==========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ==========================================================
      # 7. FLUTTER VERSION
      # ==========================================================
      - name: Flutter diagnostics
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set +e

          flutter --version
          dart --version
          java -version
          flutter doctor -v

      # ==========================================================
      # 8. ANDROID SDK
      # ==========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          sdkmanager --licenses <<< "y" || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest"

      # ==========================================================
      # 9. PREPARE FLUTTER PROJECT
      # ==========================================================
      - name: Prepare Flutter project
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "Checking Flutter project..."

          if [ ! -f pubspec.yaml ]; then
            echo "::error::pubspec.yaml tidak ditemukan."
            exit 1
          fi

          mkdir -p android

          flutter clean || true

          flutter pub get

      # ==========================================================
      # 10. CHECK ANDROID MANIFEST
      # ==========================================================
      - name: Prepare AndroidManifest.xml
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml tidak ditemukan."

            mkdir -p "$(dirname "$MANIFEST")"

            cat > "$MANIFEST" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="Flutter App"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />

              </application>

          </manifest>
          EOF
          fi

          echo "AndroidManifest.xml:"
          cat "$MANIFEST"

      # ==========================================================
      # 11. ANDROID GRADLE CONFIGURATION
      # ==========================================================
      - name: Prepare Android Gradle
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          if [ -f android/gradle.properties ]; then
            cp android/gradle.properties android/gradle.properties.backup
          fi

          touch android/gradle.properties

          grep -q "android.useAndroidX=true" android/gradle.properties \
            || echo "android.useAndroidX=true" >> android/gradle.properties

          grep -q "android.enableJetifier=true" android/gradle.properties \
            || echo "android.enableJetifier=true" >> android/gradle.properties

          grep -q "org.gradle.jvmargs" android/gradle.properties \
            || echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> android/gradle.properties

      # ==========================================================
      # 12. GENERATE FLUTTER PROJECT FILES
      # ==========================================================
      - name: Flutter project generation
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          flutter create \
            --platforms=android \
            --no-pub \
            .

          flutter pub get

      # ==========================================================
      # 13. ANALYZE
      # ==========================================================
      - name: Flutter analyze
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set +e

          flutter analyze

          ANALYZE_RESULT=$?

          if [ "$ANALYZE_RESULT" -ne 0 ]; then
            echo "::warning::Flutter analyze menemukan masalah."
          fi

          exit 0

      # ==========================================================
      # 14. TEST
      # ==========================================================
      - name: Flutter test
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set +e

          flutter test

          TEST_RESULT=$?

          if [ "$TEST_RESULT" -ne 0 ]; then
            echo "::warning::Flutter test gagal atau project tidak memiliki test."
          fi

          exit 0

      # ==========================================================
      # 15. ANALYZE ONLY
      # ==========================================================
      - name: Stop after analyze
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "Analyze-only mode aktif."
          exit 0

      # ==========================================================
      # 16. BUILD DEBUG
      # ==========================================================
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_mode == 'debug' }}
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          flutter build apk \
            --debug \
            --no-tree-shake-icons

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp build/app/outputs/flutter-apk/app-debug.apk \
            "$GITHUB_WORKSPACE/output/GARSX-debug.apk"

      # ==========================================================
      # 17. BUILD RELEASE
      # ==========================================================
      - name: Build Release APK
        if: ${{ github.event.inputs.build_mode == 'release' }}
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          flutter build apk \
            --release \
            --no-tree-shake-icons

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/output/GARSX-release.apk"

      # ==========================================================
      # 18. VERIFY APK
      # ==========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find "$GITHUB_WORKSPACE/output" -name '*.apk' -type f | head -1)"

          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi

          test -s "$APK"

          echo "APK:"
          file "$APK"

          ls -lh "$APK"

      # ==========================================================
      # 19. ZIP BUILD OUTPUT
      # ==========================================================
      - name: Package APK
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/output"

          zip -9 "GARSX-Flutter-${{ github.event.inputs.tag }}.zip" \
            *.apk

          ls -lh

      # ==========================================================
      # 20. UPLOAD ARTIFACT
      # ==========================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-Flutter-${{ github.event.inputs.tag }}
          path: |
            output/*.apk
            output/*.zip
          if-no-files-found: error
          retention-days: 7

      # ==========================================================
      # 21. BUILD SUMMARY
      # ==========================================================
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "        GARSX FLUTTER BUILD"
          echo "=========================================="
          echo "Tag        : ${{ github.event.inputs.tag }}"
          echo "Build mode : ${{ github.event.inputs.build_mode }}"
          echo "=========================================="

          if [ -d "$GITHUB_WORKSPACE/output" ]; then
            ls -lh "$GITHUB_WORKSPACE/output" || true
          fi
