name: GARSX Flutter Build Engine (Bug WA)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Flutter project ZIP URL"
        required: true
        type: string
      tag:
        description: "Build tag (contoh: v2.0.0)"
        required: true
        type: string
      build_mode:
        description: "Build mode"
        required: true
        type: choice
        options:
          - debug
          - release
        default: release
      only_analyze:
        description: "Only analyze (tanpa build)"
        required: false
        type: string
        default: "false"

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Flutter APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BUILD_MODE: ${{ inputs.build_mode }}
      BUILD_TAG: ${{ inputs.tag }}
      ZIP_URL: ${{ inputs.zip_url }}
      GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

    steps:
      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: "1. Checkout Repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ============================================================
      # 2. SETUP JAVA & FLUTTER SDK
      # ============================================================
      - name: "2. Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "2. Setup Flutter SDK"
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: "2. Verify Build Engine"
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          flutter --version
          dart --version
          echo "BUILD_MODE=$BUILD_MODE"
          echo "BUILD_TAG=$BUILD_TAG"

      - name: "2. Setup Android SDK"
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/android-sdk}
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          echo "✅ Android SDK ready!"

      # ============================================================
      # 3. DOWNLOAD & EXTRACT PROJECT
      # ============================================================
      - name: "3. Download Flutter Project ZIP"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf input_zip extracted build_project
          mkdir -p input_zip extracted build_project

          if [ -z "${ZIP_URL}" ]; then
            echo "::error::ZIP_URL tidak boleh kosong!"
            exit 1
          fi

          echo "📥 Downloading project..."
          for i in 1 2 3; do
            if curl --fail --location --retry 3 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/octet-stream" \
              "${ZIP_URL}" \
              --output input_zip/project.zip; then
              break
            fi
            echo "⚠️ Download attempt $i failed, retrying..."
            sleep 5
          done

          if [ ! -s input_zip/project.zip ]; then
            echo "::error::Download ZIP gagal!"
            exit 1
          fi
          echo "✅ Download successful!"

      - name: "3. Extract Flutter Project"
        shell: bash
        run: |
          set -euo pipefail
          unzip -q input_zip/project.zip -d extracted || {
            echo "::error::Gagal mengekstrak ZIP!"
            exit 1
          }

          PUBSPEC="$(find extracted -type f -name pubspec.yaml -print -quit || true)"
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml tidak ditemukan di ZIP!"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "✅ Flutter project found: $PROJECT_DIR"

          shopt -s dotglob
          cp -a "$PROJECT_DIR"/. build_project/
          shopt -u dotglob

          test -f build_project/pubspec.yaml || {
            echo "::error::Gagal copy project!"
            exit 1
          }
          echo "✅ Project prepared!"

      # ============================================================
      # 4. INSTALL DEPENDENCIES
      # ============================================================
      - name: "4. Install Dependencies"
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail
          flutter clean || true
          flutter pub get || {
            echo "::error::flutter pub get gagal!"
            exit 1
          }
          flutter precache --android
          echo "✅ Dependencies installed!"

      # ============================================================
      # 5. FIX ANDROIDX COMPATIBILITY
      # ============================================================
      - name: "5. Fix AndroidX Compatibility"
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail
          echo "📝 Fixing AndroidX compatibility..."
          
          # Update gradle-wrapper.properties
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/gradle-.*-all.zip/gradle-8.7-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi

          # Update build.gradle
          if [ -f android/build.gradle ]; then
            sed -i 's/com.android.tools.build:gradle:.*/com.android.tools.build:gradle:8.6.1/g' android/build.gradle
          fi

          echo "✅ AndroidX fixes applied!"

      # ============================================================
      # 6. PREPARE ANDROID PROJECT
      # ============================================================
      - name: "6. Prepare Flutter Android Project"
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            echo "⚠️ Generating Android project..."
            flutter create --platforms=android --no-pub . || {
              echo "::error::Gagal membuat Android project!"
              exit 1
            }
          fi
          test -f android/app/src/main/AndroidManifest.xml || {
            echo "::error::AndroidManifest.xml tidak ditemukan!"
            exit 1
          }

      - name: "6. Prepare AndroidManifest.xml"
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # Tambahkan semua permission yang dibutuhkan untuk Bug WA
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          
          if ! grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' "$MANIFEST"
          fi
          
          if ! grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' "$MANIFEST"
          fi
          
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.CAMERA"/>' "$MANIFEST"
          fi

          if ! grep -q 'android.permission.READ_MEDIA_IMAGES' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' "$MANIFEST"
          fi

          if ! grep -q 'android.permission.READ_MEDIA_VIDEO' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>' "$MANIFEST"
          fi

          echo "✅ Manifest ready!"

      - name: "6. Prepare Gradle"
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --no-pub . || {
              echo "::error::Gagal membuat ulang Android project!"
              exit 1
            }
          fi
          chmod +x android/gradlew
          cd android && ./gradlew --version || {
            echo "::error::Gradle tidak berjalan!"
            exit 1
          }
          cd ..
          echo "✅ Gradle ready!"

      # ============================================================
      # 7. COMPILE DART SOURCES
      # ============================================================
      - name: "7. Compiling Dart Sources"
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos || echo "⚠️ Ada issue di kode"
          flutter test --no-pub || true
          if [ "$BUILD_MODE" = "debug" ]; then
            flutter build apk --debug --no-pub --no-tree-shake-icons \
              --build-number="${GITHUB_RUN_NUMBER}" || {
              echo "::error::Flutter build debug gagal!"
              exit 1
            }
          else
            flutter build apk --release --no-pub --no-tree-shake-icons \
              --build-number="${GITHUB_RUN_NUMBER}" || {
              echo "::error::Flutter build release gagal!"
              exit 1
            }
          fi
          echo "✅ Build completed!"

      - name: "7. Analyze Only"
        if: ${{ inputs.only_analyze == 'true' }}
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos || {
            echo "::error::Flutter analyze gagal!"
            exit 1
          }
          echo "✅ Analysis completed!"

      # ============================================================
      # 8. GRADLE ASSEMBLE APK
      # ============================================================
      - name: "8. Gradle Assemble APK"
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: build_project/android
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD_MODE" = "debug" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon --parallel || {
              echo "::error::Gradle assembleDebug gagal!"
              exit 1
            }
          else
            ./gradlew :app:assembleRelease --stacktrace --no-daemon --parallel || {
              echo "::error::Gradle assembleRelease gagal!"
              exit 1
            }
          fi
          echo "✅ Gradle assemble completed!"

      # ============================================================
      # 9. SIGNING & PACKAGING
      # ============================================================
      - name: "9. Signing & Packaging"
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final_apk

          APK=""
          for path in "build/app/outputs/flutter-apk" "build/app/outputs/apk" "android/app/build/outputs/apk"; do
            if [ -d "$path" ]; then
              APK="$(find $path -type f -name '*.apk' -print -quit 2>/dev/null || true)"
              [ -n "$APK" ] && break
            fi
          done

          if [ -z "$APK" ]; then
            APK="$(find . -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$APK" ]; then
            echo "::error::APK hasil build tidak ditemukan!"
            exit 1
          fi

          OUT="xxo25-${BUILD_MODE}-${BUILD_TAG}.apk"
          cp "$APK" "final_apk/$OUT"
          echo "✅ APK copied: $OUT"

          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "final_apk/$OUT" || echo "⚠️ APK tidak signed (hanya untuk testing)"
          fi
          ls -lh final_apk/

      # ============================================================
      # 10. FINALIZING BUILD
      # ============================================================
      - name: "10. Finalizing Build"
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find final_apk -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::APK tidak valid!"
            exit 1
          fi
          sha256sum "$APK" | tee final_apk/SHA256SUMS.txt
          echo "APK_READY=$APK" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(du -h "$APK" | cut -f1)" >> "$GITHUB_ENV"

      # ============================================================
      # 11. UPLOAD APK ARTIFACT
      # ============================================================
      - name: "11. Upload APK Artifact"
        if: ${{ success() && inputs.only_analyze != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: xxo25-${{ inputs.build_mode }}-${{ inputs.tag }}
          path: |
            build_project/final_apk/*.apk
            build_project/final_apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 12. BUILD SUCCESS
      # ============================================================
      - name: "12. Build Success"
        if: ${{ success() && inputs.only_analyze != 'true' }}
        run: |
          echo "=============================================="
          echo "              XXO25 BUILD SUCCESS"
          echo "=============================================="
          echo "📱 APK  : xxo25-${BUILD_MODE}-${BUILD_TAG}.apk"
          echo "🔧 Mode : $BUILD_MODE"
          echo "🏷️ Tag  : $BUILD_TAG"
          echo "📦 Size : $APK_SIZE"
          echo "=============================================="
          echo ""
          echo "⚠️ APK ini UNSIGNED (hanya untuk testing)"
          echo "📥 Download dari artifacts di atas"
          echo "=============================================="

      # ============================================================
      # 13. BUILD ERROR LOG
      # ============================================================
      - name: "BUILD ERROR LOG"
        if: ${{ failure() }}
        working-directory: build_project
        shell: bash
        run: |
          echo "=============================================="
          echo "              XXO25 BUILD FAILED"
          echo "=============================================="
          echo "Mode: $BUILD_MODE"
          echo "Tag : $BUILD_TAG"
          echo ""
          echo "📊 Flutter diagnostics:"
          flutter doctor -v || true
          echo ""
          echo "📂 APK files found:"
          find . -type f -name '*.apk' -print 2>/dev/null || echo "Tidak ada APK"
          echo ""
          echo "📂 Gradle logs:"
          find android -type f -name '*.log' -print 2>/dev/null | head -5 || true
          echo "=============================================="
