name: GARSX Flutter Build Engine

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Flutter project ZIP URL"
        required: true
        type: string
      tag:
        description: "Build tag"
        required: true
        type: string
      build_mode:
        description: "Flutter build mode"
        required: true
        type: choice
        options:
          - debug
          - release
        default: release
      only_analyze:
        description: "Only analyze project"
        required: false
        type: string
        default: "false"

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Flutter APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BUILD_MODE: ${{ inputs.build_mode }}
      BUILD_TAG: ${{ inputs.tag }}
      ZIP_URL: ${{ inputs.zip_url }}
      GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

    steps:
      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: "1. Checkout Repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ============================================================
      # 2. SETUP JAVA & FLUTTER SDK
      # ============================================================
      - name: "2. Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "2. Setup Flutter SDK"
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: "2. Verify Build Engine"
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          flutter --version
          dart --version
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "BUILD_MODE=$BUILD_MODE"
          echo "BUILD_TAG=$BUILD_TAG"

      - name: "2. Setup Android SDK"
        shell: bash
        run: |
          set -euxo pipefail
          # Set Android SDK path
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/android-sdk}
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          # Accept licenses
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          
          # Install SDK components
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest" >/dev/null 2>&1 || true
          
          echo "✅ Android SDK ready!"
          sdkmanager --list_installed 2>/dev/null | head -20 || true

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: "3. Download Flutter Project ZIP"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf input_zip extracted build_project
          mkdir -p input_zip extracted build_project

          # Validate URL
          if [ -z "${ZIP_URL}" ]; then
            echo "::error::ZIP_URL tidak boleh kosong!"
            exit 1
          fi

          echo "📥 Downloading project from: ${ZIP_URL}"
          
          # Download with retry
          for i in 1 2 3; do
            if curl --fail --location --retry 3 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/octet-stream" \
              "${ZIP_URL}" \
              --output input_zip/project.zip; then
              break
            fi
            echo "⚠️ Download attempt $i failed, retrying..."
            sleep 5
          done

          # Verify download
          if [ ! -s input_zip/project.zip ]; then
            echo "::error::Download ZIP gagal! File kosong atau tidak ada."
            exit 1
          fi

          echo "✅ Download successful! Size: $(du -h input_zip/project.zip | cut -f1)"

      - name: "3. Extract Flutter Project"
        shell: bash
        run: |
          set -euo pipefail
          
          # Extract ZIP
          unzip -q input_zip/project.zip -d extracted || {
            echo "::error::Gagal mengekstrak ZIP! Pastikan file ZIP valid."
            exit 1
          }

          # Find pubspec.yaml
          PUBSPEC="$(find extracted -type f -name pubspec.yaml -print -quit || true)"
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml tidak ditemukan di ZIP!"
            echo "📂 Struktur extracted:"
            ls -la extracted/ || true
            find extracted -type f -name "*.yaml" -print 2>/dev/null || true
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "✅ Flutter project found: $PROJECT_DIR"

          # Copy project
          shopt -s dotglob
          cp -a "$PROJECT_DIR"/. build_project/
          shopt -u dotglob

          test -f build_project/pubspec.yaml || {
            echo "::error::Gagal copy project!"
            exit 1
          }
          
          echo "✅ Project prepared successfully!"

      - name: "3. Install Dependencies"
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail
          echo "📦 Installing dependencies..."
          flutter clean || true
          flutter pub get || {
            echo "::error::flutter pub get gagal!"
            exit 1
          }
          flutter precache --android
          echo "✅ Dependencies installed!"

      # ============================================================
      # 4. PREPARE / COMPILE DART
      # ============================================================
      - name: "4. Prepare Flutter Android Project"
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            echo "⚠️ Android platform missing. Generating Android project..."
            flutter create --platforms=android --no-pub . || {
              echo "::error::Gagal membuat Android project!"
              exit 1
            }
          else
            echo "✅ Android platform already exists."
          fi

          test -f android/app/src/main/AndroidManifest.xml || {
            echo "::error::AndroidManifest.xml tidak ditemukan!"
            exit 1
          }

      - name: "4. Prepare AndroidManifest.xml"
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST" || {
            echo "::error::AndroidManifest.xml tidak ditemukan!"
            exit 1
          }

          # Add INTERNET permission if not exists
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "📝 Adding INTERNET permission..."
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

          # Ensure application label exists
          if ! grep -q 'android:label' "$MANIFEST"; then
            echo "📝 Adding application label..."
            sed -i 's/<application /<application android:label="GARSX App" /' "$MANIFEST"
          fi

          echo "✅ Manifest ready!"

      - name: "4. Prepare Gradle"
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail

          # Ensure gradlew exists
          if [ ! -f android/gradlew ]; then
            echo "⚠️ Gradle wrapper missing; regenerating Android files..."
            cp -a android "android.backup.$(date +%s)" || true
            flutter create --platforms=android --no-pub . || {
              echo "::error::Gagal membuat ulang Android project!"
              exit 1
            }
          fi

          chmod +x android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties || {
            echo "::error::Gradle wrapper properties tidak ditemukan!"
            exit 1
          }

          cd android
          ./gradlew --version || {
            echo "::error::Gradle tidak berjalan!"
            exit 1
          }
          cd ..
          
          echo "✅ Gradle ready!"

      - name: "4. Compiling Dart Sources"
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: build_project
        shell: bash
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
        run: |
          set -euo pipefail
          
          echo "🔍 Analyzing project..."
          flutter analyze --no-fatal-infos || echo "⚠️ Ada issue di kode, tapi build lanjut"
          
          echo "🧪 Running tests..."
          flutter test --no-pub || true
          
          echo "🏗️ Building APK..."
          if [ "$BUILD_MODE" = "debug" ]; then
            flutter build apk --debug --no-pub --no-tree-shake-icons \
              --build-number="${GITHUB_RUN_NUMBER}" || {
              echo "::error::Flutter build debug gagal!"
              exit 1
            }
          else
            flutter build apk --release --no-pub --no-tree-shake-icons \
              --build-number="${GITHUB_RUN_NUMBER}" || {
              echo "::error::Flutter build release gagal!"
              exit 1
            }
          fi
          
          echo "✅ Build completed!"

      - name: "4. Analyze Only"
        if: ${{ inputs.only_analyze == 'true' }}
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Running analysis only..."
          flutter analyze --no-fatal-infos || {
            echo "::error::Flutter analyze gagal!"
            exit 1
          }
          echo "✅ Analysis completed!"

      # ============================================================
      # 5. GRADLE ASSEMBLE APK
      # ============================================================
      - name: "5. Gradle Assemble APK"
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: build_project/android
        shell: bash
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
        run: |
          set -euo pipefail
          
          echo "📦 Running Gradle assemble..."
          ./gradlew --version
          
          if [ "$BUILD_MODE" = "debug" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon --parallel || {
              echo "::error::Gradle assembleDebug gagal!"
              exit 1
            }
          else
            ./gradlew :app:assembleRelease --stacktrace --no-daemon --parallel || {
              echo "::error::Gradle assembleRelease gagal!"
              exit 1
            }
          fi
          
          echo "✅ Gradle assemble completed!"

      # ============================================================
      # 6. SIGNING & PACKAGING
      # ============================================================
      - name: "6. Signing & Packaging"
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final_apk
          
          echo "🔍 Searching for APK..."
          
          # Cari APK di semua lokasi yang mungkin
          APK=""
          for path in "build/app/outputs/flutter-apk" "build/app/outputs/apk" "android/app/build/outputs/apk"; do
            if [ -d "$path" ]; then
              APK="$(find $path -type f -name '*.apk' -print -quit 2>/dev/null || true)"
              if [ -n "$APK" ]; then
                echo "✅ APK ditemukan di: $path"
                break
              fi
            fi
          done
          
          # Jika masih tidak ditemukan, cari semua .apk
          if [ -z "$APK" ]; then
            echo "⚠️ APK tidak ditemukan di path standar, mencari semua..."
            APK="$(find . -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          fi
          
          if [ -z "$APK" ]; then
            echo "::error::APK hasil build tidak ditemukan!"
            echo "📂 Mencari di:"
            find . -type f -name '*.apk' -print 2>/dev/null || echo "Tidak ada APK ditemukan"
            exit 1
          fi
          
          echo "✅ APK found: $APK"
          
          # Copy dan rename
          OUT="GARSX-${BUILD_MODE}-${BUILD_TAG}.apk"
          cp "$APK" "final_apk/$OUT"
          echo "✅ APK copied to: final_apk/$OUT"
          
          # Verifikasi APK
          if command -v apksigner >/dev/null 2>&1; then
            echo "🔍 Verifying APK..."
            apksigner verify --verbose "final_apk/$OUT" || echo "⚠️ APK tidak signed (hanya untuk testing)"
          else
            echo "⚠️ apksigner tidak ditemukan, skip verifikasi"
          fi
          
          # Size
          ls -lh final_apk/

      # ============================================================
      # 7. FINALIZING BUILD
      # ============================================================
      - name: "7. Finalizing Build"
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail

          test -d final_apk || {
            echo "::error::final_apk directory tidak ditemukan!"
            exit 1
          }
          
          APK="$(find final_apk -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$APK" ]; then
            echo "::error::Tidak ada APK di final_apk!"
            exit 1
          fi
          
          test -s "$APK" || {
            echo "::error::APK kosong!"
            exit 1
          }
          
          echo "📊 APK Info:"
          sha256sum "$APK" | tee final_apk/SHA256SUMS.txt
          du -h "$APK"
          file "$APK"
          
          echo "APK_READY=$APK" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(du -h "$APK" | cut -f1)" >> "$GITHUB_ENV"
          echo "✅ Finalizing completed!"

      # ============================================================
      # 8. BUILD SUCCESS / ARTIFACT
      # ============================================================
      - name: "8. Upload APK Artifact"
        if: ${{ success() && inputs.only_analyze != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-Flutter-${{ inputs.build_mode }}-${{ inputs.tag }}
          path: |
            build_project/final_apk/*.apk
            build_project/final_apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: "8. Build Success"
        if: ${{ success() && inputs.only_analyze != 'true' }}
        shell: bash
        run: |
          echo "=============================================="
          echo "        GARSX FLUTTER BUILD SUCCESS"
          echo "=============================================="
          echo "Mode : $BUILD_MODE"
          echo "Tag  : $BUILD_TAG"
          echo "APK  : $APK_READY"
          echo "Size : $APK_SIZE"
          echo "=============================================="

      # ============================================================
      # ERROR LOG
      # ============================================================
      - name: "BUILD ERROR LOG"
        if: ${{ failure() }}
        working-directory: build_project
        shell: bash
        run: |
          echo "=============================================="
          echo "             GARSX BUILD FAILED"
          echo "=============================================="
          echo "Mode: $BUILD_MODE"
          echo "Tag : $BUILD_TAG"
          echo ""
          echo "📊 Flutter diagnostics:"
          flutter doctor -v || true
          echo ""
          echo "📂 APK files found:"
          find . -type f -name '*.apk' -print 2>/dev/null || echo "Tidak ada APK"
          echo ""
          echo "📂 Gradle logs:"
          find android -type f -name '*.log' -print 2>/dev/null | head -5 || true
          echo "=============================================="
