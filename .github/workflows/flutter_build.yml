name: GARSX Flutter Build Engine

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "GitHub Release URL containing Flutter project ZIP"
        required: true
        type: string

      tag:
        description: "Build tag"
        required: true
        type: string

      build_mode:
        description: "Flutter build mode"
        required: true
        default: "release"
        type: choice
        options:
          - debug
          - release

      only_analyze:
        description: "Only analyze project"
        required: false
        default: "false"
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: garsx-flutter-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Flutter ${{ github.event.inputs.build_mode }} APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      BUILD_MODE: ${{ github.event.inputs.build_mode }}
      BUILD_TAG: ${{ github.event.inputs.tag }}
      RELEASE_URL: ${{ github.event.inputs.zip_url }}

    steps:

      # ============================================================
      # 1. CHECK ENVIRONMENT
      # ============================================================

      - name: 🔍 Check Runner
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " GARSX FLUTTER BUILD ENGINE"
          echo "=============================================="

          echo "OS:"
          lsb_release -a || true

          echo
          echo "Node:"
          node --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Disk:"
          df -h

      # ============================================================
      # 2. CHECKOUT WORKFLOW REPOSITORY
      # ============================================================

      - name: 📦 Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 3. SETUP JAVA
      # ============================================================

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 4. SETUP FLUTTER
      # ============================================================

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 🐦 Flutter Version
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter --version
          dart --version

      # ============================================================
      # 5. PREPARE DIRECTORIES
      # ============================================================

      - name: 📁 Prepare Build Workspace
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "$RUNNER_TEMP/garsx_flutter"
          mkdir -p "$RUNNER_TEMP/garsx_flutter"

          echo "Workspace:"
          echo "$RUNNER_TEMP/garsx_flutter"

      # ============================================================
      # 6. DOWNLOAD FLUTTER ZIP FROM RELEASE
      # ============================================================

      - name: 📥 Download Flutter Project ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          WORK="$RUNNER_TEMP/garsx_flutter"
          ZIP="$WORK/project.zip"

          echo "Release URL: $RELEASE_URL"
          echo "Tag: $BUILD_TAG"

          RELEASE_JSON="$WORK/release.json"

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${BUILD_TAG}" \
            -o "$RELEASE_JSON"

          ASSET_URL="$(node - "$RELEASE_JSON" <<'NODE'
          const fs = require("fs");

          const file = process.argv[2];
          const data = JSON.parse(fs.readFileSync(file, "utf8"));

          if (!Array.isArray(data.assets) || data.assets.length === 0) {
            throw new Error("Release tidak mempunyai asset ZIP.");
          }

          const zip = data.assets.find(x =>
            String(x.name).toLowerCase().endsWith(".zip")
          );

          if (!zip) {
            throw new Error("Asset ZIP tidak ditemukan pada release.");
          }

          process.stdout.write(zip.url);
          NODE
          )"

          echo "Asset API URL ditemukan."

          curl -fL \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ASSET_URL" \
            -o "$ZIP"

          test -s "$ZIP"

          echo "ZIP berhasil didownload."
          ls -lh "$ZIP"

      # ============================================================
      # 7. EXTRACT PROJECT
      # ============================================================

      - name: 📦 Extract Flutter Project
        shell: bash
        run: |
          set -Eeuo pipefail

          WORK="$RUNNER_TEMP/garsx_flutter"
          SRC="$WORK/src"

          mkdir -p "$SRC"

          unzip -q "$WORK/project.zip" -d "$SRC"

          echo "Mencari pubspec.yaml..."

          PROJECT_DIR="$(find "$SRC" \
            -type f \
            -name "pubspec.yaml" \
            -print \
            -quit \
            | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::pubspec.yaml tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/pubspec.yaml"

      # ============================================================
      # 8. CREATE MISSING FLUTTER PLATFORM FILES
      # ============================================================

      - name: 🛠 Prepare Flutter Project
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            echo "Android folder tidak ditemukan."
            echo "Menyiapkan Android platform..."

            flutter create \
              --platforms=android \
              --project-name=garsx_app \
              .
          else
            echo "Android folder ditemukan."
          fi

          test -f pubspec.yaml
          test -d android

      # ============================================================
      # 9. ANDROID MANIFEST AUTO PREPARE
      # ============================================================

      - name: 🤖 Prepare AndroidManifest.xml
        shell: bash
        run: |
          set -Eeuo pipefail

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml tidak ditemukan setelah persiapan Android."
            exit 1
          fi

          node - "$MANIFEST" <<'NODE'
          const fs = require("fs");

          const file = process.argv[2];
          let xml = fs.readFileSync(file, "utf8");

          if (!/android\.permission\.INTERNET/.test(xml)) {
            const marker = '<application';

            if (!xml.includes(marker)) {
              throw new Error("Tag <application> tidak ditemukan.");
            }

            xml = xml.replace(
              marker,
              '    <uses-permission android:name="android.permission.INTERNET"/>\n\n    <application'
            );
          }

          fs.writeFileSync(file, xml);

          console.log("AndroidManifest.xml siap.");
          NODE

          echo
          echo "===== AndroidManifest.xml ====="
          cat "$MANIFEST"

      # ============================================================
      # 10. CHECK ANDROID GRADLE
      # ============================================================

      - name: 🏗 Prepare Gradle
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f android/gradlew ]; then
            echo "Gradle wrapper tidak ditemukan."
            echo "Regenerasi Android project..."

            flutter create \
              --platforms=android \
              .
          fi

          test -f android/gradlew

          chmod +x android/gradlew

          cd android
          ./gradlew --version

      # ============================================================
      # 11. FLUTTER CLEAN
      # ============================================================

      - name: 🧹 Flutter Clean
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          flutter clean

      # ============================================================
      # 12. GET DEPENDENCIES
      # ============================================================

      - name: 📚 Flutter Pub Get
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          flutter pub get

      # ============================================================
      # 13. DART FORMAT CHECK
      # ============================================================

      - name: 🧹 Dart Analyze
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          flutter analyze --no-fatal-infos

      # ============================================================
      # 14. OPTIONAL ANALYZE ONLY
      # ============================================================

      - name: 🔎 Analyze Only
        if: ${{ env.BUILD_MODE == 'release' && github.event.inputs.only_analyze == 'true' }}
        shell: bash
        run: |
          echo "Analyze-only mode aktif."
          exit 0

      # ============================================================
      # 15. BUILD DEBUG APK
      # ============================================================

      - name: 🐞 Build Debug APK
        if: ${{ env.BUILD_MODE == 'debug' && github.event.inputs.only_analyze != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          flutter build apk \
            --debug \
            --no-pub

      # ============================================================
      # 16. BUILD RELEASE APK
      # ============================================================

      - name: 🚀 Build Release APK
        if: ${{ env.BUILD_MODE == 'release' && github.event.inputs.only_analyze != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          flutter build apk \
            --release \
            --no-pub

      # ============================================================
      # 17. FIND APK
      # ============================================================

      - name: 📱 Locate APK
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$RUNNER_TEMP/garsx_output"

          APK="$(find "$PROJECT_DIR/build/app/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1 || true)"

          if [ -z "$APK" ]; then
            if [ "${{ job.status }}" = "success" ]; then
              echo "::error::APK tidak ditemukan."
            else
              echo "APK tidak ditemukan karena build gagal."
            fi

            exit 0
          fi

          cp "$APK" "$RUNNER_TEMP/garsx_output/GARSX-${BUILD_MODE}.apk"

          echo "APK:"
          ls -lh "$RUNNER_TEMP/garsx_output/GARSX-${BUILD_MODE}.apk"

      # ============================================================
      # 18. VERIFY APK
      # ============================================================

      - name: ✅ Verify APK
        if: ${{ success() }}
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$RUNNER_TEMP/garsx_output/GARSX-${BUILD_MODE}.apk"

          test -f "$APK"
          test -s "$APK"

          file "$APK"
          ls -lh "$APK"

      # ============================================================
      # 19. UPLOAD APK ARTIFACT
      # ============================================================

      - name: 📦 Upload GARSX APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-Flutter-${{ env.BUILD_MODE }}
          path: ${{ runner.temp }}/garsx_output/GARSX-${{ env.BUILD_MODE }}.apk
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 20. UPLOAD BUILD DIAGNOSTICS
      # ============================================================

      - name: 🧾 Collect Diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e

          OUT="$RUNNER_TEMP/garsx_error"
          mkdir -p "$OUT"

          echo "GARSX Flutter Build Error" > "$OUT/error.txt"
          echo "Tag: $BUILD_TAG" >> "$OUT/error.txt"
          echo "Mode: $BUILD_MODE" >> "$OUT/error.txt"
          echo "Project: ${PROJECT_DIR:-unknown}" >> "$OUT/error.txt"
          echo "Date: $(date -u)" >> "$OUT/error.txt"

          if [ -n "${PROJECT_DIR:-}" ] && [ -d "$PROJECT_DIR" ]; then
            (
              cd "$PROJECT_DIR"

              echo
              echo "===== FLUTTER DOCTOR ====="
              flutter doctor -v

              echo
              echo "===== FLUTTER PUB DEPENDENCIES ====="
              flutter pub deps
            ) >> "$OUT/error.txt" 2>&1
          fi

          echo
          echo "===== ENVIRONMENT =====" >> "$OUT/error.txt"
          flutter --version >> "$OUT/error.txt" 2>&1 || true
          java -version >> "$OUT/error.txt" 2>&1 || true

          cat "$OUT/error.txt"

      - name: 📤 Upload Error Diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-Build-Error-${{ env.BUILD_TAG }}
          path: ${{ runner.temp }}/garsx_error
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 21. FINAL STATUS
      # ============================================================

      - name: 🏁 Build Summary
        if: always()
        shell: bash
        run: |
          echo "=============================================="
          echo " GARSX FLUTTER BUILD FINISHED"
          echo "=============================================="
          echo "Mode: $BUILD_MODE"
          echo "Tag : $BUILD_TAG"
          echo "Status: ${{ job.status }}"
          echo "=============================================="
