name: 🚀 GARSX Flutter Build Engine

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "Nama ZIP Flutter di repository"
        required: true
        default: "project.zip"

      release_tag:
        description: "Tag Release"
        required: true
        default: "v1.0.0"

      release_name:
        description: "Nama Release"
        required: true
        default: "GARSX Flutter Build"

permissions:
  contents: write

jobs:
  build:
    name: 🏗️ Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # ═══════════════════════════════════════
      # 1. CHECKOUT
      # ═══════════════════════════════════════
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ═══════════════════════════════════════
      # 2. SYSTEM UPDATE
      # ═══════════════════════════════════════
      - name: 🔧 Update System
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget unzip zip \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev

      # ═══════════════════════════════════════
      # 3. SETUP JAVA
      # ═══════════════════════════════════════
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ═══════════════════════════════════════
      # 4. SETUP FLUTTER
      # ═══════════════════════════════════════
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 🔎 Flutter Version
        run: |
          flutter --version
          dart --version

      # ═══════════════════════════════════════
      # 5. SETUP ANDROID SDK
      # ═══════════════════════════════════════
      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📱 Install Android SDK
        run: |
          echo "Installing Android SDK..."
          sdkmanager "platform-tools" > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" > /dev/null 2>&1 || true
          yes | sdkmanager --licenses || true
          echo "✅ Android SDK installed"

      - name: 🔧 Configure Flutter
        run: |
          flutter config --enable-android
          flutter config --no-enable-web
          flutter config --no-enable-ios

      # ═══════════════════════════════════════
      # 6. VALIDATE ZIP
      # ═══════════════════════════════════════
      - name: 🔍 Validate ZIP
        env:
          ZIP_FILE: ${{ github.event.inputs.zip_file }}
        run: |
          set -e
          
          echo "🔍 Checking ZIP: $ZIP_FILE"
          
          if [ ! -f "$ZIP_FILE" ]; then
            echo "❌ ZIP tidak ditemukan!"
            echo ""
            echo "📁 File yang tersedia:"
            find . -maxdepth 2 -type f | sort || echo "Tidak ada file"
            exit 1
          fi
          
          echo "✅ ZIP ditemukan"
          echo "📦 Size: $(du -h "$ZIP_FILE" | cut -f1)"
          
          if ! unzip -t "$ZIP_FILE" > /dev/null 2>&1; then
            echo "❌ ZIP rusak atau tidak valid!"
            exit 1
          fi
          
          echo "✅ ZIP valid"

      # ═══════════════════════════════════════
      # 7. EXTRACT PROJECT
      # ═══════════════════════════════════════
      - name: 📂 Extract Flutter Project
        env:
          ZIP_FILE: ${{ github.event.inputs.zip_file }}
        run: |
          set -e
          
          rm -rf flutter_project
          mkdir -p flutter_project
          
          echo "📦 Extracting..."
          unzip -q "$ZIP_FILE" -d flutter_project
          
          echo "✅ Extract selesai"
          echo ""
          echo "📁 Struktur:"
          ls -la flutter_project/

      # ═══════════════════════════════════════
      # 8. DETECT PROJECT
      # ═══════════════════════════════════════
      - name: 🔎 Detect Flutter Project
        run: |
          set -e
          
          PROJECT_DIR=""
          
          # Cari pubspec.yaml
          PUBSPEC=$(find flutter_project \
            -name "pubspec.yaml" \
            -type f \
            -not -path "*/.dart_tool/*" \
            -not -path "*/build/*" \
            -print -quit)
          
          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan!"
            echo ""
            echo "📁 Isi ZIP:"
            find flutter_project -maxdepth 3 -type f | sort || echo "Tidak ada file"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PUBSPEC")
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          
          echo "╔══════════════════════════════════════╗"
          echo "║     ✅ FLUTTER PROJECT DETECTED      ║"
          echo "╚══════════════════════════════════════╝"
          echo ""
          echo "📂 Project: $PROJECT_DIR"
          
          # Tampilkan info app
          cd "$PROJECT_DIR"
          echo ""
          echo "📱 App Info:"
          grep -E "^(name|version|description):" pubspec.yaml || true

      # ═══════════════════════════════════════
      # 9. PREPARE ANDROID
      # ═══════════════════════════════════════
      - name: 📱 Prepare Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          
          echo "📱 Preparing Android..."
          
          # Buat android jika belum ada
          if [ ! -d "android" ]; then
            echo "⚠️ Android folder tidak ada, membuat..."
            flutter create --platforms=android .
          fi
          
          # Setup gradle wrapper
          if [ ! -f "android/gradlew" ]; then
            echo "⚠️ gradlew tidak ada, membuat..."
            cd android
            gradle wrapper || true
            cd ..
          fi
          
          chmod +x android/gradlew 2>/dev/null || true
          
          echo "✅ Android siap"

      # ═══════════════════════════════════════
      # 10. FLUTTER DOCTOR
      # ═══════════════════════════════════════
      - name: 🩺 Flutter Doctor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter doctor -v

      # ═══════════════════════════════════════
      # 11. CLEAN
      # ═══════════════════════════════════════
      - name: 🧹 Flutter Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean || true
          rm -rf build .dart_tool

      # ═══════════════════════════════════════
      # 12. DEPENDENCIES
      # ═══════════════════════════════════════
      - name: 📚 Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "📦 Installing dependencies..."
          flutter pub get
          echo "✅ Dependencies installed"

      # ═══════════════════════════════════════
      # 13. CODE GENERATION (Optional)
      # ═══════════════════════════════════════
      - name: ⚙️ Code Generation
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if grep -q "build_runner" pubspec.yaml 2>/dev/null; then
            echo "⚙️ Running code generation..."
            dart run build_runner build --delete-conflicting-outputs || echo "⚠️ Code generation skipped"
          else
            echo "ℹ️ No code generation required"
          fi

      # ═══════════════════════════════════════
      # 14. ANALYZE
      # ═══════════════════════════════════════
      - name: 🔍 Flutter Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze --no-fatal-infos || echo "⚠️ Analysis warnings (non-fatal)"

      # ═══════════════════════════════════════
      # 15. BUILD APK
      # ═══════════════════════════════════════
      - name: 🏗️ Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          
          echo ""
          echo "╔══════════════════════════════════════╗"
          echo "║        🚀 BUILDING APK...            ║"
          echo "╚══════════════════════════════════════╝"
          echo ""
          
          # Build dengan fallback
          flutter build apk --release --split-per-abi || flutter build apk --release
          
          echo ""
          echo "✅ Build selesai"
          
          echo ""
          echo "📱 APK files:"
          find build/app/outputs/flutter-apk -name "*.apk" -exec ls -lh {} \; || echo "Tidak ada APK"

      # ═══════════════════════════════════════
      # 16. FIND APK
      # ═══════════════════════════════════════
      - name: 🔎 Find APK
        run: |
          set -e
          
          APK=$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -type f \
            -name "*.apk" \
            -print -quit)
          
          if [ -z "$APK" ]; then
            echo "❌ APK tidak ditemukan!"
            echo ""
            echo "📁 Coba cari di semua folder:"
            find "$PROJECT_DIR/build" -name "*.apk" 2>/dev/null || echo "Tidak ada APK"
            exit 1
          fi
          
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          
          echo "✅ APK ditemukan:"
          ls -lh "$APK"

      # ═══════════════════════════════════════
      # 17. PREPARE APK
      # ═══════════════════════════════════════
      - name: 📱 Prepare APK
        run: |
          set -e
          
          mkdir -p output
          
          cp "$APK_PATH" "output/GARSX-Build.apk"
          
          echo ""
          echo "╔══════════════════════════════════════╗"
          echo "║        📱 APK READY                  ║"
          echo "╚══════════════════════════════════════╝"
          echo ""
          ls -lh output/GARSX-Build.apk
          
          echo ""
          echo "🔐 SHA256:"
          sha256sum output/GARSX-Build.apk

      # ═══════════════════════════════════════
      # 18. UPLOAD ARTIFACT
      # ═══════════════════════════════════════
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-Build-APK
          path: output/GARSX-Build.apk
          if-no-files-found: error
          retention-days: 7

      # ═══════════════════════════════════════
      # 19. CREATE GITHUB RELEASE
      # ═══════════════════════════════════════
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_name }}
          body: |
            ## 🚀 GARSX Flutter Build

            ✅ Build berhasil

            📱 APK: GARSX-Build.apk

            🐦 Flutter: Stable
            🏗️ Build: Release

            📥 Download dari attachments di bawah ini.

            ---
            *Generated by GARSX Build Engine*
          files: output/GARSX-Build.apk
          draft: false
          prerelease: false

      # ═══════════════════════════════════════
      # 20. SUCCESS
      # ═══════════════════════════════════════
      - name: 🎉 Build Success
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════╗"
          echo "║           ✅ BUILD BERHASIL!              ║"
          echo "║            GARSX BUILD ENGINE             ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""
          echo "📦 ZIP        : ${{ github.event.inputs.zip_file }}"
          echo "📱 APK        : GARSX-Build.apk"
          echo "📏 Size       : $(du -h output/GARSX-Build.apk | cut -f1)"
          echo "🏷️ Release    : ${{ github.event.inputs.release_tag }}"
          echo "🔗 URL        : ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.event.inputs.release_tag }}"
          echo "🚀 Status     : READY"
          echo ""
          echo "✅ APK berhasil dikompilasi"
          echo "✅ APK berhasil di-upload ke Artifact"
          echo "✅ GitHub Release berhasil dibuat"
