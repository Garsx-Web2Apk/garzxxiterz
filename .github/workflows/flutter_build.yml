name: GARSX Flutter Build Engine

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Flutter project ZIP URL"
        required: true
        type: string
      tag:
        description: "Build tag"
        required: true
        type: string
      build_mode:
        description: "Flutter build mode"
        required: true
        type: choice
        options:
          - debug
          - release
        default: release
      only_analyze:
        description: "Only analyze project"
        required: false
        type: string
        default: "false"

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Flutter APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BUILD_MODE: ${{ inputs.build_mode }}
      BUILD_TAG: ${{ inputs.tag }}
      ZIP_URL: ${{ inputs.zip_url }}

    steps:
      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: "1. Checkout Repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ============================================================
      # 2. SETUP JAVA & FLUTTER SDK
      # ============================================================
      - name: "2. Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "2. Setup Flutter SDK"
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: "2. Verify Build Engine"
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          flutter --version
          dart --version
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "BUILD_MODE=$BUILD_MODE"
          echo "BUILD_TAG=$BUILD_TAG"

      - name: "2. Setup Android SDK"
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest" || true
          sdkmanager --list_installed || true

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: "3. Download Flutter Project ZIP"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf input_zip extracted build_project
          mkdir -p input_zip extracted build_project

          echo "Downloading project..."
          curl --fail --location --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/octet-stream" \
            "${ZIP_URL}" \
            --output input_zip/project.zip

          test -s input_zip/project.zip
          file input_zip/project.zip

      - name: "3. Extract Flutter Project"
        shell: bash
        run: |
          set -euo pipefail
          unzip -q input_zip/project.zip -d extracted

          PUBSPEC="$(find extracted -type f -name pubspec.yaml -print -quit || true)"
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml tidak ditemukan di ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "Flutter project: $PROJECT_DIR"

          shopt -s dotglob
          cp -a "$PROJECT_DIR"/. build_project/
          shopt -u dotglob

          test -f build_project/pubspec.yaml
          echo "Project prepared."

      - name: "3. Install Dependencies"
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail
          flutter clean || true
          flutter pub get
          flutter precache --android

      # ============================================================
      # 4. PREPARE / COMPILE DART
      # ============================================================
      - name: "4. Prepare Flutter Android Project"
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            echo "Android platform missing. Generating Android project..."
            flutter create --platforms=android --no-pub .
          else
            echo "Android platform already exists."
          fi

          test -f android/app/src/main/AndroidManifest.xml

      - name: "4. Prepare AndroidManifest.xml"
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          # Add INTERNET only when it is not already declared.
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

          # Ensure a valid application label exists when possible.
          if ! grep -q '<application' "$MANIFEST"; then
            echo "::error::AndroidManifest.xml tidak memiliki <application>."
            exit 1
          fi

          echo "Manifest check:"
          sed -n '1,220p' "$MANIFEST"

      - name: "4. Prepare Gradle"
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/gradlew ]; then
            echo "Gradle wrapper missing; regenerating Android files..."
            cp -a android "android.backup.$(date +%s)" || true
            flutter create --platforms=android --no-pub .
          fi

          chmod +x android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts

          cd android
          ./gradlew --version

      - name: "4. Compiling Dart Sources"
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos
          flutter test --no-pub || true

          if [ "$BUILD_MODE" = "debug" ]; then
            flutter build apk --debug --no-pub --no-tree-shake-icons \
              --build-number="${GITHUB_RUN_NUMBER}"
          else
            flutter build apk --release --no-pub --no-tree-shake-icons \
              --build-number="${GITHUB_RUN_NUMBER}"
          fi

      - name: "4. Analyze Only"
        if: ${{ inputs.only_analyze == 'true' }}
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos

      # ============================================================
      # 5. GRADLE ASSEMBLE APK
      # ============================================================
      - name: "5. Gradle Assemble APK"
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: build_project/android
        shell: bash
        run: |
          set -euo pipefail

          if [ "$BUILD_MODE" = "debug" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            ./gradlew :app:assembleRelease --stacktrace --no-daemon
          fi

      # ============================================================
      # 6. SIGNING & PACKAGING
      # ============================================================
      - name: "6. Signing & Packaging"
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final_apk

          APK=""
          if [ "$BUILD_MODE" = "debug" ]; then
            APK="$(find build/app/outputs/apk -type f -name '*debug*.apk' -print -quit || true)"
            [ -n "$APK" ] || APK="$(find android/app/build/outputs/apk -type f -name '*debug*.apk' -print -quit || true)"
          else
            APK="$(find build/app/outputs/apk -type f -name '*release*.apk' -print -quit || true)"
            [ -n "$APK" ] || APK="$(find android/app/build/outputs/apk -type f -name '*release*.apk' -print -quit || true)"
          fi

          if [ -z "$APK" ]; then
            echo "::error::APK hasil build tidak ditemukan."
            find build android/app/build -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi

          OUT="GARSX-${BUILD_MODE}-${BUILD_TAG}.apk"
          cp "$APK" "final_apk/$OUT"

          # Debug APKs are normally signed with Android's debug keystore.
          # Release APKs are only production-signed when project signing
          # configuration is supplied by the project/Gradle environment.
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "final_apk/$OUT" || true
          fi

          ls -lh final_apk/

      # ============================================================
      # 7. FINALIZING BUILD
      # ============================================================
      - name: "7. Finalizing Build"
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: build_project
        shell: bash
        run: |
          set -euo pipefail

          test -d final_apk
          APK="$(find final_apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"

          sha256sum "$APK" | tee final_apk/SHA256SUMS.txt
          du -h "$APK"

          echo "APK_READY=$APK" >> "$GITHUB_ENV"

      # ============================================================
      # 8. BUILD SUCCESS / ARTIFACT
      # ============================================================
      - name: "8. Upload APK Artifact"
        if: ${{ success() && inputs.only_analyze != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-Flutter-${{ inputs.build_mode }}-${{ inputs.tag }}
          path: |
            build_project/final_apk/*.apk
            build_project/final_apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: "8. Build Success"
        if: ${{ success() && inputs.only_analyze != 'true' }}
        shell: bash
        run: |
          echo "=============================================="
          echo "        GARSX FLUTTER BUILD SUCCESS"
          echo "=============================================="
          echo "Mode : $BUILD_MODE"
          echo "Tag  : $BUILD_TAG"
          echo "APK  : $APK_READY"
          echo "=============================================="

      # ============================================================
      # ERROR LOG
      # ============================================================
      - name: "BUILD ERROR LOG"
        if: ${{ failure() }}
        working-directory: build_project
        shell: bash
        run: |
          echo "=============================================="
          echo "             GARSX BUILD FAILED"
          echo "=============================================="
          echo "Mode: $BUILD_MODE"
          echo "Tag : $BUILD_TAG"
          echo ""
          echo "Flutter diagnostics:"
          flutter doctor -v || true
          echo ""
          echo "APK files:"
          find build android/app/build -type f -name '*.apk' -print 2>/dev/null || true
          echo ""
          echo "Gradle logs:"
          find android -type f \( -name '*.log' -o -name 'hs_err_pid*.log' \) -print 2>/dev/null || true
          echo "=============================================="
