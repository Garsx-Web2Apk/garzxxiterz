name: 🚀 GARSX Flutter Build Engine

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "Nama file ZIP Flutter"
        required: true
        default: "project.zip"

      release_tag:
        description: "Tag GitHub Release"
        required: true
        default: "v1.0.0"

      release_name:
        description: "Nama GitHub Release"
        required: true
        default: "GARSX Flutter Build"

permissions:
  contents: write

jobs:
  flutter-build:

    name: 🏗️ GARSX Full Flutter Build
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 01. CHECKOUT
      # ==========================================================

      - name: "01 • 📥 Checkout Repository"
        uses: actions/checkout@v4


      # ==========================================================
      # 02. UPDATE UBUNTU
      # ==========================================================

      - name: "02 • 🔧 Update Ubuntu"
        run: |
          sudo apt-get update


      # ==========================================================
      # 03. INSTALL SYSTEM DEPENDENCIES
      # ==========================================================

      - name: "03 • 🛠️ Install Build Dependencies"
        run: |
          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            xz-utils \
            libglu1-mesa \
            clang \
            cmake \
            ninja-build \
            pkg-config


      # ==========================================================
      # 04. JAVA JDK 17
      # ==========================================================

      - name: "04 • ☕ Setup Java JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================================
      # 05. ANDROID SDK
      # ==========================================================

      - name: "05 • 🤖 Setup Android SDK"
        uses: android-actions/setup-android@v3


      # ==========================================================
      # 06. ANDROID SDK PACKAGES
      # ==========================================================

      - name: "06 • 📱 Install Android SDK Packages"
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"


      # ==========================================================
      # 07. VERIFY ANDROID SDK
      # ==========================================================

      - name: "07 • 🔎 Verify Android SDK"
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          adb version || true

          sdkmanager --list_installed


      # ==========================================================
      # 08. FLUTTER
      # ==========================================================

      - name: "08 • 🐦 Setup Flutter Stable"
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ==========================================================
      # 09. FLUTTER VERSION
      # ==========================================================

      - name: "09 • 🔎 Check Flutter & Dart"
        run: |
          flutter --version
          dart --version


      # ==========================================================
      # 10. FLUTTER CONFIG
      # ==========================================================

      - name: "10 • ⚙️ Configure Flutter"
        run: |
          flutter config --enable-android


      # ==========================================================
      # 11. FLUTTER DOCTOR
      # ==========================================================

      - name: "11 • 🩺 Flutter Doctor"
        run: |
          flutter doctor -v


      # ==========================================================
      # 12. VALIDATE ZIP
      # ==========================================================

      - name: "12 • 📦 Validate ZIP"
        env:
          ZIP_FILE: ${{ github.event.inputs.zip_file }}
        run: |
          set -e

          if [ ! -f "$ZIP_FILE" ]; then
            echo "❌ ZIP tidak ditemukan!"
            echo ""
            echo "File yang tersedia:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "🔍 Memeriksa ZIP..."

          unzip -t "$ZIP_FILE"

          echo "✅ ZIP valid."


      # ==========================================================
      # 13. EXTRACT ZIP
      # ==========================================================

      - name: "13 • 📂 Extract Flutter Project"
        env:
          ZIP_FILE: ${{ github.event.inputs.zip_file }}
        run: |
          set -e

          rm -rf flutter_project
          mkdir -p flutter_project

          unzip -q "$ZIP_FILE" -d flutter_project

          echo "✅ ZIP berhasil di-extract."

          echo ""
          echo "📂 Isi project:"
          find flutter_project -maxdepth 3 -type f | sort | head -150


      # ==========================================================
      # 14. DETECT PUBSPEC
      # ==========================================================

      - name: "14 • 🔎 Detect Flutter Project"
        run: |
          set -e

          PUBSPEC=$(find flutter_project \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.dart_tool/*" \
            -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan!"
            echo ""
            echo "ZIP harus berisi project Flutter."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "╔══════════════════════════════════════╗"
          echo "║     ✅ FLUTTER PROJECT DETECTED      ║"
          echo "╚══════════════════════════════════════╝"
          echo ""
          echo "📂 $PROJECT_DIR"


      # ==========================================================
      # 15. VALIDATE FLUTTER PROJECT
      # ==========================================================

      - name: "15 • 🔍 Validate Flutter Project"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          test -f pubspec.yaml

          echo "✅ pubspec.yaml ditemukan."

          if [ ! -d "lib" ]; then
            echo "❌ Folder lib tidak ditemukan!"
            exit 1
          fi

          echo "✅ Folder lib ditemukan."


      # ==========================================================
      # 16. ANDROID PLATFORM
      # ==========================================================

      - name: "16 • 📱 Prepare Android Platform"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "⚠️ Folder android tidak ditemukan."
            echo "🔧 Membuat Android platform..."

            flutter create \
              --platforms=android \
              --project-name=garsx_build \
              .
          fi

          echo "✅ Android platform tersedia."


      # ==========================================================
      # 17. GRADLE PERMISSION
      # ==========================================================

      - name: "17 • ⚙️ Prepare Gradle"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

          echo "✅ Gradle permission siap."


      # ==========================================================
      # 18. SHOW GRADLE CONFIG
      # ==========================================================

      - name: "18 • 🔎 Check Gradle"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "android/gradlew" ]; then
            cd android
            ./gradlew --version
          else
            echo "❌ gradlew tidak ditemukan!"
            exit 1
          fi


      # ==========================================================
      # 19. FLUTTER CLEAN
      # ==========================================================

      - name: "19 • 🧹 Flutter Clean"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean


      # ==========================================================
      # 20. REMOVE OLD BUILD
      # ==========================================================

      - name: "20 • 🗑️ Remove Old Build"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf build
          rm -rf .dart_tool


      # ==========================================================
      # 21. PUB GET
      # ==========================================================

      - name: "21 • 📚 Flutter Pub Get"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get


      # ==========================================================
      # 22. CODE GENERATION
      # ==========================================================

      - name: "22 • ⚙️ Generate Source Code"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            echo "🔧 build_runner terdeteksi."

            dart run build_runner build \
              --delete-conflicting-outputs
          else
            echo "ℹ️ build_runner tidak digunakan."
          fi


      # ==========================================================
      # 23. ANALYZE
      # ==========================================================

      - name: "23 • 🔍 Flutter Analyze"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze --no-fatal-infos


      # ==========================================================
      # 24. TEST
      # ==========================================================

      - name: "24 • 🧪 Flutter Test"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "ℹ️ Tidak ada folder test."
          fi


      # ==========================================================
      # 25. CHECK ENVIRONMENT
      # ==========================================================

      - name: "25 • 🔧 Final Environment Check"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "======================================"
          echo "Flutter"
          echo "======================================"

          flutter --version

          echo ""
          echo "======================================"
          echo "Java"
          echo "======================================"

          java -version

          echo ""
          echo "======================================"
          echo "Android SDK"
          echo "======================================"

          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "======================================"
          echo "Gradle"
          echo "======================================"

          cd android
          ./gradlew --version


      # ==========================================================
      # 26. BUILD APK RELEASE
      # ==========================================================

      - name: "26 • 🏗️ Compile Flutter APK"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║                                          ║"
          echo "║       🏗️ COMPILING FLUTTER APK          ║"
          echo "║                                          ║"
          echo "╚══════════════════════════════════════════╝"
          echo ""

          flutter build apk \
            --release \
            --no-tree-shake-icons

          echo ""
          echo "✅ Compilation selesai."


      # ==========================================================
      # 27. FIND APK
      # ==========================================================

      - name: "27 • 🔎 Find APK"
        run: |
          set -e

          APK=$(find \
            "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "❌ APK tidak ditemukan!"
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "✅ APK ditemukan:"
          ls -lh "$APK"


      # ==========================================================
      # 28. PREPARE FINAL APK
      # ==========================================================

      - name: "28 • 📱 Prepare Final Application"
        run: |
          set -e

          rm -rf output
          mkdir -p output

          cp "$APK_PATH" \
            "output/GARSX-Build.apk"

          echo "✅ APK final dibuat."

          ls -lh output/GARSX-Build.apk


      # ==========================================================
      # 29. VERIFY APK
      # ==========================================================

      - name: "29 • 🔐 Verify APK"
        run: |
          set -e

          APK="output/GARSX-Build.apk"

          if [ ! -f "$APK" ]; then
            echo "❌ APK tidak ada!"
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          if [ "$SIZE" -le 0 ]; then
            echo "❌ APK kosong!"
            exit 1
          fi

          echo "📱 APK:"
          ls -lh "$APK"

          echo ""
          echo "📦 Size:"
          du -h "$APK"

          echo ""
          echo "🔐 SHA256:"
          sha256sum "$APK"


      # ==========================================================
      # 30. UPLOAD ARTIFACT
      # ==========================================================

      - name: "30 • 📤 Upload APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-Build-APK
          path: output/GARSX-Build.apk
          if-no-files-found: error
          retention-days: 7


      # ==========================================================
      # 31. CREATE GITHUB RELEASE
      # ==========================================================

      - name: "31 • 🚀 Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_name }}
          body: |
            # 🚀 GARSX Flutter Build

            ## Build Status

            ✅ Flutter setup
            ✅ Android SDK setup
            ✅ Java setup
            ✅ Gradle setup
            ✅ Dependencies
            ✅ Code generation
            ✅ Analyze
            ✅ Compile
            ✅ APK verification

            ## Application

            📱 GARSX-Build.apk

            🏗️ Build: Release
            🐦 Flutter: Stable
            ☕ Java: 17

            Generated by GARSX Build Engine.
          files: output/GARSX-Build.apk
          draft: false
          prerelease: false


      # ==========================================================
      # 32. FINAL SUCCESS
      # ==========================================================

      - name: "32 • 🎉 Build Complete"
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════╗"
          echo "║                                           ║"
          echo "║            ✅ BUILD BERHASIL!             ║"
          echo "║                                           ║"
          echo "║          GARSX BUILD ENGINE               ║"
          echo "║                                           ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""
          echo "📦 Source  : ${{ github.event.inputs.zip_file }}"
          echo "📱 APK     : GARSX-Build.apk"
          echo "🏷️ Release : ${{ github.event.inputs.release_tag }}"
          echo "🚀 Status  : READY"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ System dependencies"
          echo "✅ Java JDK"
          echo "✅ Android SDK"
          echo "✅ Android Platform"
          echo "✅ Android Build Tools"
          echo "✅ Platform Tools"
          echo "✅ Flutter"
          echo "✅ Dart"
          echo "✅ ZIP extraction"
          echo "✅ Flutter project detection"
          echo "✅ Android platform"
          echo "✅ Gradle"
          echo "✅ Flutter clean"
          echo "✅ Pub dependencies"
          echo "✅ Code generation"
          echo "✅ Dart analysis"
          echo "✅ Flutter tests"
          echo "✅ Release compilation"
          echo "✅ APK verification"
          echo "✅ Artifact upload"
          echo "✅ GitHub Release"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📱 APPLICATION READY ✔"
