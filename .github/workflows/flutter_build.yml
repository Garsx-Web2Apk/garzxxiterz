name: 🚀 GARSX Flutter Builder

# ============================================================
# 1. TRIGGER
# ============================================================
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: '📦 ZIP URL'
        required: true
        type: string
        default: ''
      tag:
        description: '🏷️ Tag Build'
        required: false
        type: string
        default: 'v1.0.0'
      build_mode:
        description: '📱 Build Mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both
      only_analyze:
        description: '🔍 Only Analyze'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

# ============================================================
# 2. PERMISSIONS
# ============================================================
permissions:
  contents: write
  packages: write

# ============================================================
# 3. ENVIRONMENT
# ============================================================
env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.22.0'
  GRADLE_OPTS: '-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g'

# ============================================================
# 4. JOB: BUILD FLUTTER
# ============================================================
jobs:
  build:
    name: 🛠️ Build Flutter (${{ github.event.inputs.build_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # STEP 1: CHECKOUT
      # ============================================================
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      # ============================================================
      # STEP 2: FREE DISK SPACE
      # ============================================================
      - name: "🧹 Free Disk Space"
        run: |
          sudo apt clean
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      # ============================================================
      # STEP 3: UPDATE SYSTEM
      # ============================================================
      - name: "🔧 Update System"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip wget curl git

      # ============================================================
      # STEP 4: SETUP JAVA
      # ============================================================
      - name: "☕ Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      # ============================================================
      # STEP 5: SETUP ANDROID SDK
      # ============================================================
      - name: "📱 Setup Android SDK"
        uses: android-actions/setup-android@v3

      # ============================================================
      # STEP 6: INSTALL ANDROID SDK
      # ============================================================
      - name: "📱 Install Android SDK"
        run: |
          echo "📱 Installing Android SDK..."
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "✅ Android SDK installed"

      # ============================================================
      # STEP 7: SETUP FLUTTER
      # ============================================================
      - name: "🐦 Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # ============================================================
      # STEP 8: VERIFY FLUTTER
      # ============================================================
      - name: "✅ Verify Flutter"
        run: |
          flutter --version
          dart --version

      # ============================================================
      # STEP 9: CONFIGURE FLUTTER
      # ============================================================
      - name: "⚙️ Configure Flutter"
        run: |
          flutter config --enable-android
          flutter config --no-enable-web
          flutter config --no-enable-ios

      # ============================================================
      # STEP 10: FLUTTER DOCTOR
      # ============================================================
      - name: "🩺 Flutter Doctor"
        run: flutter doctor -v

      # ============================================================
      # STEP 11: DOWNLOAD ZIP
      # ============================================================
      - name: "📦 Download ZIP"
        run: |
          echo "📥 Downloading: ${{ github.event.inputs.zip_url }}"
          curl -L -o project.zip "${{ github.event.inputs.zip_url }}" || {
            echo "❌ Download failed!"
            exit 1
          }
          echo "✅ Downloaded: $(du -h project.zip | cut -f1)"

      # ============================================================
      # STEP 12: VALIDATE ZIP
      # ============================================================
      - name: "🔍 Validate ZIP"
        run: |
          unzip -t project.zip > /dev/null 2>&1 || {
            echo "❌ ZIP corrupt!"
            exit 1
          }
          echo "✅ ZIP valid"

      # ============================================================
      # STEP 13: EXTRACT ZIP
      # ============================================================
      - name: "📦 Extract ZIP"
        run: |
          rm -rf project_raw
          mkdir -p project_raw
          unzip -q project.zip -d project_raw
          echo "✅ Extract complete"

      # ============================================================
      # STEP 14: FIND PROJECT ROOT
      # ============================================================
      - name: "🔍 Find Project Root"
        run: |
          cd project_raw
          
          PUBSPEC=$(find . -name "pubspec.yaml" -type f | head -1)
          
          if [ -n "$PUBSPEC" ]; then
            PROJECT_DIR=$(dirname "$PUBSPEC")
          else
            if [ $(ls -1 | wc -l) -eq 1 ] && [ -d "$(ls)" ]; then
              PROJECT_DIR="$(ls)"
            else
              PROJECT_DIR="."
            fi
          fi
          
          PROJECT_DIR=$(echo "$PROJECT_DIR" | sed 's/^\.\///')
          PROJECT_DIR="project_raw/$PROJECT_DIR"
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "📂 Project root: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      # ============================================================
      # STEP 15: VALIDATE FLUTTER PROJECT
      # ============================================================
      - name: "✅ Validate Flutter Project"
        run: |
          cd "$PROJECT_DIR"
          
          if [ ! -f "pubspec.yaml" ]; then
            echo "❌ pubspec.yaml not found!"
            exit 1
          fi
          
          if [ ! -d "lib" ]; then
            echo "❌ lib/ not found!"
            exit 1
          fi
          
          echo "✅ Project valid"
          echo ""
          echo "📄 pubspec.yaml:"
          head -10 pubspec.yaml

      # ============================================================
      # STEP 16: FIX GRADLE
      # ============================================================
      - name: "🔧 Fix Gradle"
        run: |
          cd "$PROJECT_DIR"
          
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
          fi
          
          GRADLE_FILE=""
          [ -f "android/app/build.gradle" ] && GRADLE_FILE="android/app/build.gradle"
          [ -f "app/build.gradle" ] && GRADLE_FILE="app/build.gradle"
          [ -z "$GRADLE_FILE" ] && GRADLE_FILE=$(find . -name "build.gradle" -type f | head -1)
          
          if [ -n "$GRADLE_FILE" ] && [ -f "$GRADLE_FILE" ]; then
            echo "📝 Fixing: $GRADLE_FILE"
            sed -i "s/minSdk[[:space:]]*[0-9]*/minSdk 21/g" "$GRADLE_FILE" 2>/dev/null || true
            echo "✅ minSdk fixed to 21"
          fi

      # ============================================================
      # STEP 17: FLUTTER CLEAN
      # ============================================================
      - name: "🧹 Flutter Clean"
        run: |
          cd "$PROJECT_DIR"
          flutter clean || true
          rm -rf build .dart_tool 2>/dev/null || true
          echo "✅ Clean complete"

      # ============================================================
      # STEP 18: GET DEPENDENCIES
      # ============================================================
      - name: "📦 Get Dependencies"
        run: |
          cd "$PROJECT_DIR"
          
          for i in 1 2 3; do
            echo "🔄 Attempt $i/3..."
            if flutter pub get; then
              echo "✅ Dependencies installed"
              break
            fi
            echo "⏳ Retry $i..."
            sleep 5
          done || {
            echo "❌ Failed to install dependencies!"
            exit 1
          }

      # ============================================================
      # STEP 19: FLUTTER ANALYZE
      # ============================================================
      - name: "🔍 Flutter Analyze"
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos || echo "⚠️ Warnings ignored"

      # ============================================================
      # STEP 20: STOP IF ONLY ANALYZE
      # ============================================================
      - name: "🛑 Stop if Only Analyze"
        if: github.event.inputs.only_analyze == 'true'
        run: |
          echo "✅ Analyze only mode, stopping..."
          exit 0

      # ============================================================
      # STEP 21: BUILD RELEASE APK
      # ============================================================
      - name: "🔨 Build Release APK"
        if: github.event.inputs.build_mode == 'release' || github.event.inputs.build_mode == 'both'
        run: |
          echo "════════════════════════════════════════"
          echo "  🔨 BUILDING RELEASE APK"
          echo "════════════════════════════════════════"
          echo ""
          echo "⏳ This will take 3-8 minutes..."
          echo ""
          
          cd "$PROJECT_DIR"
          mkdir -p output
          
          flutter build apk --release || {
            echo ""
            echo "❌ Release build failed!"
            if [ -f "build/app/outputs/flutter-apk/console.log" ]; then
              echo "📋 Last 50 lines:"
              tail -50 "build/app/outputs/flutter-apk/console.log"
            fi
            exit 1
          }
          
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk output/GARSX-RELEASE.apk
            SIZE=$(du -h output/GARSX-RELEASE.apk | cut -f1)
            echo ""
            echo "✅ Release APK: output/GARSX-RELEASE.apk ($SIZE)"
          else
            echo "❌ Release APK not found!"
            exit 1
          fi

      # ============================================================
      # STEP 22: BUILD DEBUG APK
      # ============================================================
      - name: "🐞 Build Debug APK"
        if: github.event.inputs.build_mode == 'debug' || github.event.inputs.build_mode == 'both'
        run: |
          echo "════════════════════════════════════════"
          echo "  🐞 BUILDING DEBUG APK"
          echo "════════════════════════════════════════"
          echo ""
          echo "⏳ This will take 3-8 minutes..."
          echo ""
          
          cd "$PROJECT_DIR"
          mkdir -p output
          
          flutter build apk --debug || {
            echo ""
            echo "❌ Debug build failed!"
            if [ -f "build/app/outputs/flutter-apk/console.log" ]; then
              echo "📋 Last 50 lines:"
              tail -50 "build/app/outputs/flutter-apk/console.log"
            fi
            exit 1
          }
          
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk output/GARSX-DEBUG.apk
            SIZE=$(du -h output/GARSX-DEBUG.apk | cut -f1)
            echo ""
            echo "✅ Debug APK: output/GARSX-DEBUG.apk ($SIZE)"
          else
            echo "❌ Debug APK not found!"
            exit 1
          fi

      # ============================================================
      # STEP 23: VERIFY APKS
      # ============================================================
      - name: "✅ Verify APKs"
        run: |
          echo "════════════════════════════════════════"
          echo "  ✅ VERIFYING APKS"
          echo "════════════════════════════════════════"
          echo ""
          
          cd "$PROJECT_DIR"
          
          if [ -f "output/GARSX-RELEASE.apk" ]; then
            SIZE=$(stat -c%s "output/GARSX-RELEASE.apk" 2>/dev/null || stat -f%z "output/GARSX-RELEASE.apk" 2>/dev/null)
            if [ -n "$SIZE" ] && [ "$SIZE" -gt 1000000 ]; then
              echo "✅ Release APK: $((SIZE/1024/1024)) MB"
              sha256sum output/GARSX-RELEASE.apk > output/GARSX-RELEASE.apk.sha256
            else
              echo "❌ Release APK too small!"
              exit 1
            fi
          fi
          
          if [ -f "output/GARSX-DEBUG.apk" ]; then
            SIZE=$(stat -c%s "output/GARSX-DEBUG.apk" 2>/dev/null || stat -f%z "output/GARSX-DEBUG.apk" 2>/dev/null)
            if [ -n "$SIZE" ] && [ "$SIZE" -gt 1000000 ]; then
              echo "✅ Debug APK: $((SIZE/1024/1024)) MB"
              sha256sum output/GARSX-DEBUG.apk > output/GARSX-DEBUG.apk.sha256
            else
              echo "❌ Debug APK too small!"
              exit 1
            fi
          fi
          
          echo ""
          echo "📦 APKs ready:"
          ls -lh output/

      # ============================================================
      # STEP 24: COPY TO ROOT
      # ============================================================
      - name: "📱 Copy APKs to Root"
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/output/"*.apk output/ 2>/dev/null || true
          cp "$PROJECT_DIR/output/"*.sha256 output/ 2>/dev/null || true
          echo "✅ APKs copied to root"
          ls -lh output/

      # ============================================================
      # STEP 25: CREATE BUILD INFO
      # ============================================================
      - name: "📝 Create Build Info"
        run: |
          cat > output/build-info.txt << EOF
          ════════════════════════════════════════
             GARSX BUILD REPORT - FLUTTER
          ════════════════════════════════════════
          
          📱 BUILD INFO
          ──────────────────────────────────────
          Status: ✅ SUCCESS
          Type: Flutter ZIP Build
          Mode: ${{ github.event.inputs.build_mode }}
          Tag: ${{ github.event.inputs.tag }}
          
          📦 APK INFO
          ──────────────────────────────────────
          EOF
          
          for apk in output/*.apk; do
            if [ -f "$apk" ]; then
              NAME=$(basename "$apk")
              SIZE=$(du -h "$apk" | cut -f1)
              SHA=$(sha256sum "$apk" | cut -d' ' -f1)
              echo "  $NAME" >> output/build-info.txt
              echo "    Size: $SIZE" >> output/build-info.txt
              echo "    SHA256: $SHA" >> output/build-info.txt
            fi
          done
          
          cat >> output/build-info.txt << EOF
          
          🔗 REPOSITORY
          ──────────────────────────────────────
          Repo: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Run: ${{ github.run_id }}
          
          ⏱️ TIMESTAMP
          ──────────────────────────────────────
          Build: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          ════════════════════════════════════════
          EOF
          
          cat output/build-info.txt

      # ============================================================
      # STEP 26: UPLOAD ARTIFACT
      # ============================================================
      - name: "📤 Upload APKs"
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-Flutter-${{ github.event.inputs.tag }}
          path: |
            output/*.apk
            output/*.sha256
            output/build-info.txt
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # STEP 27: SUCCESS
      # ============================================================
      - name: "🎉 Build Success"
        if: success()
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════╗"
          echo "║     ✅ FLUTTER BUILD BERHASIL!           ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""
          echo "📱 Mode: ${{ github.event.inputs.build_mode }}"
          echo "🏷️ Tag: ${{ github.event.inputs.tag }}"
          echo ""
          echo "📦 APKs:"
          ls -lh output/*.apk
          echo ""
          echo "📥 Download dari Artifacts tab"

      # ============================================================
      # STEP 28: FAILURE
      # ============================================================
      - name: "❌ Build Failed"
        if: failure()
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════╗"
          echo "║        ❌ BUILD GAGAL!                  ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""
          echo "🔍 Periksa log di atas untuk detail error."

      # ============================================================
      # STEP 29: CLEANUP
      # ============================================================
      - name: "🧹 Cleanup"
        if: always()
        continue-on-error: true
        run: |
          rm -rf project_raw 2>/dev/null || true
          rm -rf project.zip 2>/dev/null || true
          echo "✅ Cleanup completed"
