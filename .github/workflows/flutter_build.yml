name: Build Flutter APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_url:
        description: 'Release URL'
        required: true
        type: string
      tag:
        description: 'Release Tag'
        required: true
        type: string
      build_type:
        description: 'Build Type'
        required: true
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          
      - name: Download ZIP from release
        run: |
          curl -L -o project.zip "${{ github.event.inputs.release_url }}"
          unzip project.zip -d project/
          
      - name: Build APK
        run: |
          cd project/
          flutter pub get
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-files
          path: project/build/app/outputs/flutter-apk/*.apk
