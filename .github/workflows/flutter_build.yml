name: 🚀 GARSX Universal Build Engine

# ============================================================
# 1. TRIGGER
# ============================================================
on:
  workflow_dispatch:
    inputs:
      # ===== BUILD TYPE =====
      build_mode:
        description: '📱 Build Mode'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - both
      
      # ===== PROJECT TYPE =====
      project_type:
        description: '📦 Project Type'
        required: true
        default: 'flutter'
        type: choice
        options:
          - flutter
          - web2apk
          - zip-build
          - auto
      
      # ===== WEB2APK SPECIFIC =====
      web_url:
        description: '🌐 Web URL (for web2apk)'
        required: false
        type: string
        default: ''
      
      app_name:
        description: '📝 App Name (for web2apk)'
        required: false
        type: string
        default: 'GARSX Web App'
      
      icon_url:
        description: '🖼️ Icon URL (for web2apk)'
        required: false
        type: string
        default: ''
      
      # ===== ZIP BUILD SPECIFIC =====
      zip_url:
        description: '📦 ZIP URL (for zip-build)'
        required: false
        type: string
        default: ''
      
      tag:
        description: '🏷️ Tag Build'
        required: false
        type: string
        default: 'v1.0.0'
      
      # ===== OPTIONS =====
      only_analyze:
        description: '🔍 Only Analyze'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      
      enable_signing:
        description: '✍️ Enable Signing'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      
      enable_clean:
        description: '🧹 Enable Clean'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      
      enable_test:
        description: '🧪 Enable Test'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

# ============================================================
# 2. PERMISSIONS
# ============================================================
permissions:
  contents: write
  packages: write

# ============================================================
# 3. ENVIRONMENT
# ============================================================
env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.22.0'
  NODE_VERSION: '18'
  GRADLE_OPTS: '-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g'

# ============================================================
# 4. JOB: BUILD
# ============================================================
jobs:
  build:
    name: 🛠️ Build (${{ github.event.inputs.project_type }} - ${{ github.event.inputs.build_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # TAHAP 1: PERSIAPAN SYSTEM
      # ============================================================

      - name: "01 - 📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "02 - 🧹 Free Disk Space"
        run: |
          sudo apt clean
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: "03 - 🔧 Update System"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget unzip zip \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev \
            xz-utils \
            imagemagick \
            aapt

      # ============================================================
      # TAHAP 2: SETUP ENVIRONMENT (UNIVERSAL)
      # ============================================================

      - name: "04 - ☕ Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: "05 - 📱 Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "06 - 📱 Install Android SDK"
        run: |
          echo "📱 Installing Android SDK..."
          sdkmanager "platform-tools" > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" > /dev/null 2>&1 || true
          yes | sdkmanager --licenses || true
          echo "✅ Android SDK installed"

      - name: "07 - 🐦 Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: "08 - ✅ Verify Flutter"
        run: |
          flutter --version
          dart --version

      - name: "09 - ⚙️ Configure Flutter"
        run: |
          flutter config --enable-android
          flutter config --no-enable-web
          flutter config --no-enable-ios

      - name: "10 - 🩺 Flutter Doctor"
        run: |
          flutter doctor -v

      - name: "11 - 🟢 Setup Node.js"
        if: github.event.inputs.project_type == 'web2apk'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ============================================================
      # TAHAP 3: WEB2APK BUILD
      # ============================================================

      - name: "12 - 🌐 Web2APK - Create Project"
        if: github.event.inputs.project_type == 'web2apk'
        run: |
          echo "🌐 Creating Web2APK project..."
          
          APP_NAME="${{ github.event.inputs.app_name }}"
          WEB_URL="${{ github.event.inputs.web_url }}"
          
          if [ -z "$WEB_URL" ]; then
            echo "❌ Web URL tidak boleh kosong!"
            exit 1
          fi
          
          PKG=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr ' ' '_' | tr -cd '[:alnum:]_')
          flutter create --org com.webapk --project-name "$PKG" myapp

      - name: "13 - 🌐 Web2APK - Add Dependencies"
        if: github.event.inputs.project_type == 'web2apk'
        run: |
          cd myapp
          flutter pub add webview_flutter
          flutter pub add flutter_launcher_icons
          flutter pub add connectivity_plus
          echo "  assets:" >> pubspec.yaml
          echo "    - assets/icon/" >> pubspec.yaml

      - name: "14 - 🌐 Web2APK - Write Main.dart"
        if: github.event.inputs.project_type == 'web2apk'
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          WEB_URL="${{ github.event.inputs.web_url }}"
          
          cat > myapp/lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:connectivity_plus/connectivity_plus.dart';
          import 'dart:async';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
              statusBarColor: Colors.transparent,
              statusBarIconBrightness: Brightness.dark,
            ));
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: '$APP_NAME',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(useMaterial3: true, primarySwatch: Colors.blue),
                home: const SplashScreen(),
              );
            }
          }

          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});
            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen> with TickerProviderStateMixin {
            late AnimationController _fadeController;
            late AnimationController _scaleController;
            late Animation<double> _fadeAnim;
            late Animation<double> _scaleAnim;
            bool _isChecking = false;
            bool _dialogShown = false;

            @override
            void initState() {
              super.initState();
              _fadeController = AnimationController(vsync: this, duration: const Duration(milliseconds: 800));
              _scaleController = AnimationController(vsync: this, duration: const Duration(milliseconds: 800));
              _fadeAnim = Tween<double>(begin: 0.0, end: 1.0).animate(CurvedAnimation(parent: _fadeController, curve: Curves.easeOut));
              _scaleAnim = Tween<double>(begin: 0.75, end: 1.0).animate(CurvedAnimation(parent: _scaleController, curve: Curves.easeOutBack));
              _fadeController.forward();
              _scaleController.forward();
              Timer(const Duration(milliseconds: 1500), () => _checkConnectionAndNavigate());
            }

            Future<void> _checkConnectionAndNavigate() async {
              if (_isChecking) return;
              setState(() => _isChecking = true);
              await Future.delayed(const Duration(milliseconds: 1000));
              var connectivityResult = await (Connectivity().checkConnectivity());
              if (connectivityResult.every((r) => r == ConnectivityResult.none)) {
                setState(() => _isChecking = false);
                _showNoConnectionDialog();
              } else {
                if (mounted) {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const WebViewPage()));
                }
              }
            }

            void _showNoConnectionDialog() {
              if (!mounted || _dialogShown) return;
              setState(() => _dialogShown = true);
              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (context) => AlertDialog(
                  title: const Text('Gagal Terhubung'),
                  content: const Text('Tidak ada koneksi internet.'),
                  actions: [
                    TextButton(onPressed: () { Navigator.pop(context); setState(() => _dialogShown = false); _checkConnectionAndNavigate(); }, child: const Text('Coba Lagi'))
                  ],
                ),
              );
            }

            @override
            void dispose() { _fadeController.dispose(); _scaleController.dispose(); super.dispose(); }

            @override
            Widget build(BuildContext context) {
              return Scaffold(body: Center(child: Text('$APP_NAME', style: const TextStyle(fontSize: 24, fontWeight: FontWeight.bold))));
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});
            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController _controller;
            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse('$WEB_URL'));
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(body: SafeArea(child: WebViewWidget(controller: _controller)));
            }
          }
          DART

          sed -i "s#\$APP_NAME#$APP_NAME#g" myapp/lib/main.dart
          sed -i "s#\$WEB_URL#$WEB_URL#g" myapp/lib/main.dart

      - name: "15 - 🌐 Web2APK - Fix Android Permissions"
        if: github.event.inputs.project_type == 'web2apk'
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          MANIFEST="myapp/android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest xmlns:android/a\    <uses-permission android:name="android.permission.INTERNET"\/>' $MANIFEST
          sed -i '/<manifest xmlns:android/a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' $MANIFEST
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/" $MANIFEST

      - name: "16 - 🌐 Web2APK - Download Icon"
        if: github.event.inputs.project_type == 'web2apk' && github.event.inputs.icon_url != ''
        run: |
          mkdir -p myapp/assets/icon
          curl -L -o myapp/assets/icon/icon_raw "${{ github.event.inputs.icon_url }}"
          convert myapp/assets/icon/icon_raw -resize 1024x1024 myapp/assets/icon/icon.png

      - name: "17 - 🌐 Web2APK - Generate Icons"
        if: github.event.inputs.project_type == 'web2apk'
        run: |
          cat > myapp/flutter_launcher_icons.yaml << 'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/icon.png"
            min_sdk_android: 21
          EOF
          cd myapp && dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      # ============================================================
      # TAHAP 4: ZIP BUILD (DENGAN AndroidManifest.xml SUPPORT)
      # ============================================================

      - name: "18 - 📦 ZIP Build - Download Project"
        if: github.event.inputs.project_type == 'zip-build'
        run: |
          echo "========================================="
          echo "📥 DOWNLOADING ZIP PROJECT..."
          echo "========================================="
          echo "URL: ${{ github.event.inputs.zip_url }}"
          echo "========================================="
          
          curl -L -o project.zip "${{ github.event.inputs.zip_url }}"
          
          if [ ! -f project.zip ]; then
            echo "❌ Download failed!"
            exit 1
          fi
          
          echo "📏 File size:"
          ls -lh project.zip

      - name: "19 - 📦 ZIP Build - Validate ZIP"
        if: github.event.inputs.project_type == 'zip-build'
        run: |
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ ZIP corrupt atau tidak valid!"
            exit 1
          fi
          echo "✅ ZIP valid"

      - name: "20 - 📦 ZIP Build - Extract Project"
        if: github.event.inputs.project_type == 'zip-build'
        run: |
          rm -rf project_raw
          mkdir -p project_raw
          unzip -q project.zip -d project_raw
          
          echo "✅ Extract selesai"
          echo "📁 Project files:"
          ls -la project_raw/

      - name: "21 - 📦 ZIP Build - Detect Project Root"
        if: github.event.inputs.project_type == 'zip-build'
        run: |
          echo "========================================="
          echo "🔍 DETECTING PROJECT ROOT"
          echo "========================================="
          
          cd project_raw
          
          # Cari AndroidManifest.xml
          MANIFEST=$(find . -name "AndroidManifest.xml" -type f 2>/dev/null | head -1)
          
          # Cari pubspec.yaml
          PUBSPEC=$(find . -name "pubspec.yaml" -type f 2>/dev/null | head -1)
          
          # Cari build.gradle
          GRADLE=$(find . -name "build.gradle" -type f 2>/dev/null | head -1)
          
          echo "🔍 AndroidManifest.xml: $MANIFEST"
          echo "🔍 pubspec.yaml: $PUBSPEC"
          echo "🔍 build.gradle: $GRADLE"
          
          # Set project root
          if [ -n "$MANIFEST" ]; then
            PROJECT_DIR=$(dirname "$MANIFEST")
            echo "📂 Root detected from AndroidManifest.xml: $PROJECT_DIR"
          elif [ -n "$PUBSPEC" ]; then
            PROJECT_DIR=$(dirname "$PUBSPEC")
            echo "📂 Root detected from pubspec.yaml: $PROJECT_DIR"
          elif [ -n "$GRADLE" ]; then
            PROJECT_DIR=$(dirname "$GRADLE")
            echo "📂 Root detected from build.gradle: $PROJECT_DIR"
          else
            # Cek apakah ada folder android
            if [ -d "android" ]; then
              PROJECT_DIR="."
            else
              # Cari folder dengan satu subfolder
              SUB_DIR_COUNT=$(find . -maxdepth 1 -mindepth 1 -type d | wc -l)
              FILE_COUNT=$(find . -maxdepth 1 -mindepth 1 -type f | wc -l)
              
              if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
                PROJECT_DIR=$(find . -maxdepth 1 -mindepth 1 -type d | head -n 1)
              else
                PROJECT_DIR="."
              fi
            fi
          fi
          
          # Clean path
          PROJECT_DIR=$(echo "$PROJECT_DIR" | sed 's/^\.\///')
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="project_raw"
          else
            PROJECT_DIR="project_raw/$PROJECT_DIR"
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "📂 Final Project Root: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: "22 - 📦 ZIP Build - Validate AndroidManifest.xml"
        if: github.event.inputs.project_type == 'zip-build'
        run: |
          echo "========================================="
          echo "📄 VALIDATE AndroidManifest.xml"
          echo "========================================="
          
          cd "$PROJECT_DIR"
          
          # Cari AndroidManifest.xml di berbagai lokasi
          MANIFEST_FILE=""
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          elif [ -f "app/src/main/AndroidManifest.xml" ]; then
            MANIFEST_FILE="app/src/main/AndroidManifest.xml"
          elif [ -f "src/main/AndroidManifest.xml" ]; then
            MANIFEST_FILE="src/main/AndroidManifest.xml"
          else
            MANIFEST_FILE=$(find . -name "AndroidManifest.xml" -type f 2>/dev/null | head -1)
          fi
          
          if [ -n "$MANIFEST_FILE" ] && [ -f "$MANIFEST_FILE" ]; then
            echo "✅ AndroidManifest.xml ditemukan: $MANIFEST_FILE"
            
            # Tampilkan isi manifest
            echo ""
            echo "📄 AndroidManifest.xml content:"
            echo "========================================="
            cat "$MANIFEST_FILE"
            echo "========================================="
            
            # Extract package name
            PACKAGE=$(grep -o 'package="[^"]*"' "$MANIFEST_FILE" | head -1 | sed 's/package="//' | sed 's/"//')
            echo ""
            echo "📦 Package: $PACKAGE"
            
            # Extract permissions
            PERMISSIONS=$(grep -o '<uses-permission[^>]*/>' "$MANIFEST_FILE" | wc -l)
            echo "🔐 Permissions: $PERMISSIONS"
            
            # Extract minSdk
            MIN_SDK=$(grep -o 'android:minSdkVersion="[^"]*"' "$MANIFEST_FILE" | head -1 | sed 's/android:minSdkVersion="//' | sed 's/"//')
            echo "📱 Min SDK: $MIN_SDK"
            
            # Extract targetSdk
            TARGET_SDK=$(grep -o 'android:targetSdkVersion="[^"]*"' "$MANIFEST_FILE" | head -1 | sed 's/android:targetSdkVersion="//' | sed 's/"//')
            echo "🎯 Target SDK: $TARGET_SDK"
            
            # Extract versionCode
            VERSION_CODE=$(grep -o 'android:versionCode="[^"]*"' "$MANIFEST_FILE" | head -1 | sed 's/android:versionCode="//' | sed 's/"//')
            echo "🔢 Version Code: $VERSION_CODE"
            
            # Extract versionName
            VERSION_NAME=$(grep -o 'android:versionName="[^"]*"' "$MANIFEST_FILE" | head -1 | sed 's/android:versionName="//' | sed 's/"//')
            echo "📝 Version Name: $VERSION_NAME"
            
            # Check activities
            ACTIVITIES=$(grep -o '<activity[^>]*>' "$MANIFEST_FILE" | wc -l)
            echo "📱 Activities: $ACTIVITIES"
            
            # Check launcher activity
            LAUNCHER=$(grep -A 5 '<activity' "$MANIFEST_FILE" | grep -o 'android.intent.action.MAIN' | head -1)
            if [ -n "$LAUNCHER" ]; then
              echo "🚀 Launcher Activity: YES"
            else
              echo "🚀 Launcher Activity: NO"
            fi
          else
            echo "❌ AndroidManifest.xml tidak ditemukan!"
            echo ""
            echo "📂 Semua file XML:"
            find . -name "*.xml" -type f 2>/dev/null | head -20
          fi

      - name: "23 - 📦 ZIP Build - Auto Add Permissions to AndroidManifest.xml"
        if: github.event.inputs.project_type == 'zip-build'
        run: |
          cd "$PROJECT_DIR"
          
          # Tentukan lokasi manifest
          MANIFEST_FILE=""
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          elif [ -f "app/src/main/AndroidManifest.xml" ]; then
            MANIFEST_FILE="app/src/main/AndroidManifest.xml"
          else
            MANIFEST_FILE=$(find . -name "AndroidManifest.xml" -type f 2>/dev/null | head -1)
          fi
          
          if [ -n "$MANIFEST_FILE" ] && [ -f "$MANIFEST_FILE" ]; then
            echo "🔧 Fixing AndroidManifest.xml: $MANIFEST_FILE"
            
            # Tambahkan permissions jika belum ada
            if ! grep -q "INTERNET" "$MANIFEST_FILE"; then
              sed -i '/<manifest xmlns:android/a\    <uses-permission android:name="android.permission.INTERNET" \/>' "$MANIFEST_FILE"
              echo "✅ Added INTERNET permission"
            fi
            
            if ! grep -q "ACCESS_NETWORK_STATE" "$MANIFEST_FILE"; then
              sed -i '/<manifest xmlns:android/a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>' "$MANIFEST_FILE"
              echo "✅ Added ACCESS_NETWORK_STATE permission"
            fi
            
            if ! grep -q "WRITE_EXTERNAL_STORAGE" "$MANIFEST_FILE"; then
              sed -i '/<manifest xmlns:android/a\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>' "$MANIFEST_FILE"
              echo "✅ Added WRITE_EXTERNAL_STORAGE permission"
            fi
            
            if ! grep -q "READ_EXTERNAL_STORAGE" "$MANIFEST_FILE"; then
              sed -i '/<manifest xmlns:android/a\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>' "$MANIFEST_FILE"
              echo "✅ Added READ_EXTERNAL_STORAGE permission"
            fi
            
            echo ""
            echo "📄 Updated AndroidManifest.xml:"
            cat "$MANIFEST_FILE"
          else
            echo "⚠️ AndroidManifest.xml tidak ditemukan, skip auto fix"
          fi

      - name: "24 - 📦 ZIP Build - Validate Flutter Project"
        if: github.event.inputs.project_type == 'zip-build'
        run: |
          cd "$PROJECT_DIR"
          
          echo "========================================="
          echo "✅ VALIDATE FLUTTER PROJECT"
          echo "========================================="
          
          if [ -f "pubspec.yaml" ]; then
            echo "✅ pubspec.yaml ditemukan"
            echo ""
            echo "📄 pubspec.yaml:"
            head -20 pubspec.yaml
          else
            echo "❌ pubspec.yaml tidak ditemukan!"
            echo ""
            echo "📂 Project files:"
            ls -la
            exit 1
          fi
          
          if [ -d "lib" ]; then
            echo "✅ lib/ ditemukan"
          else
            echo "❌ lib/ tidak ditemukan!"
            exit 1
          fi

      - name: "25 - 📦 ZIP Build - Validate build.gradle"
        if: github.event.inputs.project_type == 'zip-build'
        run: |
          cd "$PROJECT_DIR"
          
          echo "========================================="
          echo "✅ VALIDATE build.gradle"
          echo "========================================="
          
          GRADLE_FILE=""
          if [ -f "android/app/build.gradle" ]; then
            GRADLE_FILE="android/app/build.gradle"
          elif [ -f "app/build.gradle" ]; then
            GRADLE_FILE="app/build.gradle"
          else
            GRADLE_FILE=$(find . -name "build.gradle" -type f 2>/dev/null | head -1)
          fi
          
          if [ -n "$GRADLE_FILE" ] && [ -f "$GRADLE_FILE" ]; then
            echo "✅ build.gradle ditemukan: $GRADLE_FILE"
            
            # Cek compileSdk
            COMPILE_SDK=$(grep -o 'compileSdk[[:space:]]*[0-9]*' "$GRADLE_FILE" | head -1 | grep -o '[0-9]*')
            echo "🔧 compileSdk: $COMPILE_SDK"
            
            # Cek minSdk
            MIN_SDK=$(grep -o 'minSdk[[:space:]]*[0-9]*' "$GRADLE_FILE" | head -1 | grep -o '[0-9]*')
            echo "📱 minSdk: $MIN_SDK"
            
            # Cek targetSdk
            TARGET_SDK=$(grep -o 'targetSdk[[:space:]]*[0-9]*' "$GRADLE_FILE" | head -1 | grep -o '[0-9]*')
            echo "🎯 targetSdk: $TARGET_SDK"
            
            # Fix minSdk jika terlalu rendah
            if [ -n "$MIN_SDK" ] && [ "$MIN_SDK" -lt 21 ]; then
              echo "⚠️ Min SDK $MIN_SDK terlalu rendah, diubah ke 21"
              sed -i "s/minSdk[[:space:]]*[0-9]*/minSdk 21/" "$GRADLE_FILE"
            fi
          else
            echo "⚠️ build.gradle tidak ditemukan!"
          fi

      - name: "26 - 📦 ZIP Build - Fix Gradle Wrapper"
        if: github.event.inputs.project_type == 'zip-build'
        run: |
          cd "$PROJECT_DIR"
          
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            echo "✅ Gradle wrapper found"
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "✅ Gradle wrapper found"
          else
            echo "⚠️ Gradle wrapper tidak ditemukan"
          fi

      # ============================================================
      # TAHAP 5: FLUTTER BUILD (UNIVERSAL)
      # ============================================================

      - name: "27 - 🧹 Flutter Clean"
        if: github.event.inputs.project_type == 'flutter' || github.event.inputs.project_type == 'web2apk' || github.event.inputs.project_type == 'zip-build'
        working-directory: ${{ env.PROJECT_DIR || 'myapp' }}
        run: |
          if [ "${{ github.event.inputs.enable_clean }}" == "true" ]; then
            flutter clean || true
            rm -rf build .dart_tool
            echo "✅ Clean selesai"
          else
            echo "⏭️ Skip clean"
          fi

      - name: "28 - 📦 Get Dependencies"
        if: github.event.inputs.project_type == 'flutter' || github.event.inputs.project_type == 'web2apk' || github.event.inputs.project_type == 'zip-build'
        working-directory: ${{ env.PROJECT_DIR || 'myapp' }}
        run: |
          for i in {1..3}; do
            echo "🔄 Attempt $i..."
            flutter pub get && break
            echo "⏳ Retry $i ..."
            sleep 5
          done
          echo "✅ Dependencies installed"

      - name: "29 - 🔍 Flutter Analyze"
        if: github.event.inputs.project_type == 'flutter' || github.event.inputs.project_type == 'web2apk' || github.event.inputs.project_type == 'zip-build'
        working-directory: ${{ env.PROJECT_DIR || 'myapp' }}
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos || echo "⚠️ Ada warning, tapi build tetap lanjut"

      - name: "30 - 🧪 Flutter Test"
        if: github.event.inputs.enable_test == 'true'
        working-directory: ${{ env.PROJECT_DIR || 'myapp' }}
        continue-on-error: true
        run: |
          if [ -d "test" ] && [ "$(ls -A test)" ]; then
            echo "🧪 Menjalankan tests..."
            flutter test --coverage
            echo "✅ Tests completed"
          else
            echo "ℹ️ Tidak ada test ditemukan"
          fi

      - name: "31 - 🛑 Stop if Only Analyze"
        if: github.event.inputs.only_analyze == 'true'
        run: |
          echo "✅ Analyze only mode, stopping..."
          exit 0

      - name: "32 - 🔨 Build APK (Debug & Release)"
        if: github.event.inputs.project_type == 'flutter' || github.event.inputs.project_type == 'web2apk' || github.event.inputs.project_type == 'zip-build'
        working-directory: ${{ env.PROJECT_DIR || 'myapp' }}
        run: |
          echo "========================================="
          echo "🔨 BUILDING APK..."
          echo "========================================="
          echo "📱 Mode: ${{ github.event.inputs.build_mode }}"
          echo "⏳ Mohon tunggu 3-8 menit..."
          echo "========================================="
          
          mkdir -p output
          
          # Build Release
          if [ "${{ github.event.inputs.build_mode }}" == "release" ] || [ "${{ github.event.inputs.build_mode }}" == "both" ]; then
            echo "🚀 Building Release APK..."
            flutter build apk --release
            if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
              cp build/app/outputs/flutter-apk/app-release.apk output/GARSX-RELEASE.apk
              echo "✅ Release APK: output/GARSX-RELEASE.apk"
            fi
          fi
          
          # Build Debug
          if [ "${{ github.event.inputs.build_mode }}" == "debug" ] || [ "${{ github.event.inputs.build_mode }}" == "both" ]; then
            echo "🐞 Building Debug APK..."
            flutter build apk --debug
            if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
              cp build/app/outputs/flutter-apk/app-debug.apk output/GARSX-DEBUG.apk
              echo "✅ Debug APK: output/GARSX-DEBUG.apk"
            fi
          fi
          
          echo "✅ Build selesai"
          ls -lh output/

      # ============================================================
      # TAHAP 6: SIGNING
      # ============================================================

      - name: "33 - ✍️ Sign APK"
        if: github.event.inputs.enable_signing == 'true'
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "✍️ Signing APK..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            
            for apk in output/*.apk; do
              if [ -f "$apk" ]; then
                jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
                  -keystore keystore.jks \
                  -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
                  -keypass "${{ secrets.KEY_PASSWORD }}" \
                  "$apk" "${{ secrets.KEY_ALIAS }}"
                echo "✅ Signed: $(basename $apk)"
              fi
            done
          else
            echo "⚠️ No keystore found, skipping signing"
          fi

      # ============================================================
      # TAHAP 7: VERIFY & PREPARE
      # ============================================================

      - name: "34 - ✅ Verify APK"
        run: |
          echo "========================================="
          echo "✅ VERIFYING APK..."
          echo "========================================="
          
          if [ ! -d "output" ] || [ -z "$(ls -A output)" ]; then
            echo "❌ Tidak ada APK ditemukan!"
            exit 1
          fi
          
          for apk in output/*.apk; do
            if [ -f "$apk" ]; then
              SIZE=$(stat -c%s "$apk" 2>/dev/null || stat -f%z "$apk" 2>/dev/null)
              if [ -n "$SIZE" ] && [ "$SIZE" -gt 0 ]; then
                echo "✅ $(basename $apk): $((SIZE/1024/1024)) MB"
                sha256sum "$apk" > "$apk.sha256"
                
                # Verify APK with aapt
                if command -v aapt &> /dev/null; then
                  echo ""
                  echo "📱 APK Info:"
                  aapt dump badging "$apk" | head -10 || echo "⚠️ aapt not available"
                fi
              else
                echo "❌ $(basename $apk): KOSONG!"
                exit 1
              fi
            fi
          done
          
          echo ""
          echo "📦 APK siap:"
          ls -lh output/

      - name: "35 - 📝 Create Build Info"
        run: |
          cat > output/build-info.txt << EOF
          ════════════════════════════════════════
             GARSX BUILD REPORT
          ════════════════════════════════════════
          
          📱 BUILD INFO
          ──────────────────────────────────────
          Status: ✅ SUCCESS
          Project: ${{ github.event.inputs.project_type }}
          Mode: ${{ github.event.inputs.build_mode }}
          Tag: ${{ github.event.inputs.tag }}
          Signed: ${{ github.event.inputs.enable_signing }}
          Tests: ${{ github.event.inputs.enable_test }}
          Clean: ${{ github.event.inputs.enable_clean }}
          
          📦 APK INFO
          ──────────────────────────────────────
          EOF
          
          for apk in output/*.apk; do
            if [ -f "$apk" ]; then
              NAME=$(basename "$apk")
              SIZE=$(du -h "$apk" | cut -f1)
              SHA=$(sha256sum "$apk" | cut -d' ' -f1)
              echo "  $NAME" >> output/build-info.txt
              echo "    Size: $SIZE" >> output/build-info.txt
              echo "    SHA256: $SHA" >> output/build-info.txt
            fi
          done
          
          cat >> output/build-info.txt << EOF
          
          📄 ANDROIDMANIFEST.XML INFO
          ──────────────────────────────────────
          EOF
          
          if [ -n "$MANIFEST_FILE" ] && [ -f "$MANIFEST_FILE" ]; then
            echo "  AndroidManifest.xml: ✅" >> output/build-info.txt
            echo "  Package: $PACKAGE" >> output/build-info.txt
            echo "  Min SDK: $MIN_SDK" >> output/build-info.txt
            echo "  Target SDK: $TARGET_SDK" >> output/build-info.txt
            echo "  Version Code: $VERSION_CODE" >> output/build-info.txt
            echo "  Version Name: $VERSION_NAME" >> output/build-info.txt
            echo "  Permissions: $PERMISSIONS" >> output/build-info.txt
          fi
          
          cat >> output/build-info.txt << EOF
          
          🔗 REPOSITORY
          ──────────────────────────────────────
          Repo: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Run: ${{ github.run_id }}
          
          ⏱️ TIMESTAMP
          ──────────────────────────────────────
          Build: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          ════════════════════════════════════════
          EOF
          
          cat output/build-info.txt

      # ============================================================
      # TAHAP 8: UPLOAD
      # ============================================================

      - name: "36 - 📤 Upload Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-Build-${{ github.event.inputs.tag }}
          path: |
            output/*.apk
            output/*.sha256
            output/build-info.txt
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # TAHAP 9: FINAL
      # ============================================================

      - name: "37 - 🎉 Build Success"
        if: success()
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════╗"
          echo "║           ✅ BUILD BERHASIL!              ║"
          echo "║            GARSX BUILD ENGINE             ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""
          echo "📦 Project: ${{ github.event.inputs.project_type }}"
          echo "📱 Build  : ${{ github.event.inputs.build_mode }}"
          echo "🏷️ Tag    : ${{ github.event.inputs.tag }}"
          echo ""
          echo "📱 APK yang dihasilkan:"
          ls -lh output/*.apk
          echo ""
          echo "📥 Download dari Artifacts tab"

      - name: "38 - ❌ Build Failed"
        if: failure()
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════╗"
          echo "║           ❌ BUILD GAGAL!                ║"
          echo "║            GARSX BUILD ENGINE             ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""
          echo "🔍 Periksa log di atas untuk detail error."

      - name: "39 - 🧹 Cleanup"
        if: always()
        continue-on-error: true
        run: |
          echo "🧹 Cleaning up..."
          rm -rf project_raw
          rm -rf project.zip
          rm -rf myapp
          rm -rf ~/.pub-cache 2>/dev/null || true
          rm -rf ~/.gradle 2>/dev/null || true
          echo "✅ Cleanup completed"
