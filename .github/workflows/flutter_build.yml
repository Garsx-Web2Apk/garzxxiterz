name: GARSX Flutter Build Engine

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "Nama ZIP Flutter project"
        required: true
        default: "project.zip"

      environment:
        description: "Environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

      build_type:
        description: "Build Type"
        required: true
        default: "apk"
        type: choice
        options:
          - apk
          - appbundle
          - both

      release_tag:
        description: "GitHub Release tag"
        required: true
        default: "v1.0.0"

      release_name:
        description: "GitHub Release name"
        required: true
        default: "GARSX Flutter Build"

      auto_version:
        description: "Auto increment version"
        required: true
        default: "false"
        type: boolean

      run_tests:
        description: "Run tests"
        required: true
        default: "true"
        type: boolean

permissions:
  contents: write
  packages: read

env:
  FLUTTER_VERSION: "3.24.0"
  JAVA_VERSION: "17"

jobs:
  # ==========================================================
  # JOB 1: VALIDASI PROJECT
  # ==========================================================
  validate:
    name: "01 - Validate Project"
    runs-on: ubuntu-latest
    outputs:
      project_dir: ${{ steps.detect.outputs.PROJECT_DIR }}
      app_name: ${{ steps.info.outputs.APP_NAME }}
      app_version: ${{ steps.info.outputs.APP_VERSION }}
      build_number: ${{ steps.version.outputs.BUILD_NUMBER }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget unzip zip

      - name: "Find & Validate ZIP"
        env:
          ZIP_FILE: ${{ github.event.inputs.zip_file }}
        run: |
          if [ ! -f "$ZIP_FILE" ]; then
            echo "❌ ZIP tidak ditemukan: $ZIP_FILE"
            echo "📁 ZIP yang tersedia:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi
          echo "✅ ZIP ditemukan: $ZIP_FILE"
          unzip -t "$ZIP_FILE"

      - name: "Extract Project"
        run: |
          rm -rf flutter_project
          mkdir -p flutter_project
          unzip -q "${{ github.event.inputs.zip_file }}" -d flutter_project

      - name: "Detect Project"
        id: detect
        run: |
          PUBSPEC=$(find flutter_project -type f -name "pubspec.yaml" -not -path "*/.dart_tool/*" | head -1)
          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "✅ Project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: "App Info"
        id: info
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APP_NAME=$(grep '^name:' pubspec.yaml | head -1 | sed 's/name:[[:space:]]*//' | tr -d '"' | tr -d "'")
          APP_VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//' | tr -d '"' | tr -d "'")
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "📱 App: $APP_NAME v$APP_VERSION"

      - name: "Auto Increment Version"
        id: version
        if: github.event.inputs.auto_version == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//' | tr -d '"' | tr -d "'")
          VERSION=$(echo "$CURRENT" | cut -d'+' -f1)
          BUILD=$(echo "$CURRENT" | cut -d'+' -f2)
          [ -z "$BUILD" ] && BUILD=0
          NEW_BUILD=$((BUILD + 1))
          NEW_VERSION="${VERSION}+${NEW_BUILD}"
          sed -i "s/^version:.*/version: $NEW_VERSION/" pubspec.yaml
          echo "BUILD_NUMBER=$NEW_BUILD" >> "$GITHUB_OUTPUT"
          echo "📈 Version: $CURRENT -> $NEW_VERSION"

  # ==========================================================
  # JOB 2: SETUP ENVIRONMENT
  # ==========================================================
  setup:
    name: "02 - Setup Environment"
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: "Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: "Verify Flutter"
        run: |
          flutter --version
          dart --version

      - name: "Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Install Android SDK"
        run: |
          sdkmanager "platform-tools" > /dev/null 2>&1
          sdkmanager "platforms;android-34" > /dev/null 2>&1
          sdkmanager "build-tools;34.0.0" > /dev/null 2>&1
          yes | sdkmanager --licenses || true

      - name: "Configure Flutter"
        run: |
          flutter config --enable-android
          flutter doctor -v

  # ==========================================================
  # JOB 3: DEPENDENCIES
  # ==========================================================
  deps:
    name: "03 - Dependencies"
    runs-on: ubuntu-latest
    needs: [validate, setup]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: "Restore Project"
        run: |
          PROJECT_DIR="${{ needs.validate.outputs.project_dir }}"
          if [ ! -d "$PROJECT_DIR" ] && [ -d "flutter_project" ]; then
            PROJECT_DIR="flutter_project"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "✅ Project: $PROJECT_DIR"

      - name: "Create Android Platform"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d android ]; then
            echo "Creating Android platform..."
            flutter create --platforms=android .
          fi

      - name: "Check Gradle Wrapper"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f android/gradlew ]; then
            cd android && gradle wrapper && cd ..
          fi
          chmod +x android/gradlew

      - name: "Cache Dependencies"
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            ${{ env.PROJECT_DIR }}/.dart_tool
          key: flutter-${{ runner.os }}-${{ hashFiles('${{ env.PROJECT_DIR }}/pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-

      - name: "Get Dependencies"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get

      - name: "Code Generation"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            echo "⚙️ Running code generation..."
            dart run build_runner build --delete-conflicting-outputs
          fi

  # ==========================================================
  # JOB 4: QUALITY CHECKS
  # ==========================================================
  quality:
    name: "04 - Quality Checks"
    runs-on: ubuntu-latest
    needs: [validate, setup, deps]
    if: github.event.inputs.run_tests == 'true'
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: "Restore Project"
        run: |
          PROJECT_DIR="${{ needs.validate.outputs.project_dir }}"
          if [ ! -d "$PROJECT_DIR" ] && [ -d "flutter_project" ]; then
            PROJECT_DIR="flutter_project"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: "Get Dependencies"
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: "Analyze Code"
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos

      - name: "Run Tests"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -d test ] && find test -name "*_test.dart" | grep -q .; then
            echo "🧪 Running tests..."
            flutter test --coverage
          else
            echo "ℹ️ No tests found"
          fi

  # ==========================================================
  # JOB 5: SIGNING (OPSIONAL)
  # ==========================================================
  signing:
    name: "05 - Setup Signing"
    runs-on: ubuntu-latest
    needs: [validate, setup]
    if: github.event.inputs.environment == 'production'
    outputs:
      configured: ${{ steps.sign.outputs.CONFIGURED }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Keystore"
        id: sign
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "⚠️ No keystore - using debug signing"
            echo "CONFIGURED=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "CONFIGURED=true" >> "$GITHUB_OUTPUT"
          echo "✅ Keystore configured"

      - name: "Configure Signing"
        if: steps.sign.outputs.CONFIGURED == 'true'
        run: |
          PROJECT_DIR="${{ needs.validate.outputs.project_dir }}"
          if [ ! -d "$PROJECT_DIR" ] && [ -d "flutter_project" ]; then
            PROJECT_DIR="flutter_project"
          fi
          cd "$PROJECT_DIR"
          
          cp android/app/build.gradle android/app/build.gradle.bak
          
          cat << 'EOF' >> android/app/build.gradle
          
          android {
              signingConfigs {
                  release {
                      storeFile file('keystore.jks')
                      storePassword '${{ secrets.KEYSTORE_PASSWORD }}'
                      keyAlias '${{ secrets.KEY_ALIAS }}'
                      keyPassword '${{ secrets.KEY_PASSWORD }}'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF
          
          cp ../keystore.jks android/app/

      - name: "Create Proguard Rules"
        if: steps.sign.outputs.CONFIGURED == 'true'
        run: |
          PROJECT_DIR="${{ needs.validate.outputs.project_dir }}"
          if [ ! -d "$PROJECT_DIR" ] && [ -d "flutter_project" ]; then
            PROJECT_DIR="flutter_project"
          fi
          cd "$PROJECT_DIR"
          
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class io.flutter.app.** { *; }
          -keep class io.flutter.plugin.**  { *; }
          -keep class io.flutter.util.**  { *; }
          -keep class io.flutter.view.**  { *; }
          -keep class io.flutter.**  { *; }
          -keep class io.flutter.plugins.**  { *; }
          -keepclasseswithmembernames class * {
              native <methods>;
          }
          EOF

  # ==========================================================
  # JOB 6: BUILD APK/AAB
  # ==========================================================
  build:
    name: "06 - Build Application"
    runs-on: ubuntu-latest
    needs: [validate, setup, deps, signing]
    outputs:
      apk_path: ${{ steps.find_apk.outputs.APK_PATH }}
      aab_path: ${{ steps.find_aab.outputs.AAB_PATH }}
      success: ${{ steps.status.outputs.SUCCESS }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: "Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: "Restore Project"
        run: |
          PROJECT_DIR="${{ needs.validate.outputs.project_dir }}"
          if [ ! -d "$PROJECT_DIR" ] && [ -d "flutter_project" ]; then
            PROJECT_DIR="flutter_project"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "✅ Project: $PROJECT_DIR"

      - name: "Restore Keystore"
        if: needs.signing.outputs.configured == 'true'
        run: |
          PROJECT_DIR="${{ env.PROJECT_DIR }}"
          cd "$PROJECT_DIR"
          if [ -f "../keystore.jks" ]; then
            cp ../keystore.jks android/app/
            echo "✅ Keystore restored"
          fi

      - name: "Build APK"
        if: github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║          BUILDING APK                    ║"
          echo "╚══════════════════════════════════════════╝"
          echo ""
          
          MODE="release"
          if [ "${{ github.event.inputs.environment }}" == "staging" ]; then
            MODE="debug"
          fi
          
          flutter build apk --$MODE --split-per-abi
          echo "✅ APK build complete"

      - name: "Find APK"
        id: find_apk
        if: github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
          echo "APK_PATH=$APK" >> "$GITHUB_OUTPUT"
          echo "📱 APK: $APK"
          ls -lh "$APK"

      - name: "Build App Bundle"
        if: github.event.inputs.build_type == 'appbundle' || github.event.inputs.build_type == 'both'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║          BUILDING AAB                    ║"
          echo "╚══════════════════════════════════════════╝"
          echo ""
          
          MODE="release"
          if [ "${{ github.event.inputs.environment }}" == "staging" ]; then
            MODE="debug"
          fi
          
          flutter build appbundle --$MODE
          echo "✅ AAB build complete"

      - name: "Find AAB"
        id: find_aab
        if: github.event.inputs.build_type == 'appbundle' || github.event.inputs.build_type == 'both'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          AAB=$(find build/app/outputs/bundle/release -name "*.aab" | head -1)
          echo "AAB_PATH=$AAB" >> "$GITHUB_OUTPUT"
          echo "📦 AAB: $AAB"
          ls -lh "$AAB"

      - name: "Build Status"
        id: status
        run: echo "SUCCESS=true" >> "$GITHUB_OUTPUT"

  # ==========================================================
  # JOB 7: UPLOAD ARTIFACT
  # ==========================================================
  artifact:
    name: "07 - Upload Artifact"
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: needs.build.outputs.success == 'true'
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Prepare Artifacts"
        run: |
          mkdir -p output
          if [ -n "${{ needs.build.outputs.apk_path }}" ] && [ -f "${{ needs.build.outputs.apk_path }}" ]; then
            cp "${{ needs.build.outputs.apk_path }}" output/
            echo "✅ APK copied"
          fi
          if [ -n "${{ needs.build.outputs.aab_path }}" ] && [ -f "${{ needs.build.outputs.aab_path }}" ]; then
            cp "${{ needs.build.outputs.aab_path }}" output/
            echo "✅ AAB copied"
          fi
          echo "📦 Artifacts:"
          ls -la output/

      - name: "Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-Build-${{ needs.validate.outputs.app_version }}
          path: output/
          if-no-files-found: error
          retention-days: 7

  # ==========================================================
  # JOB 8: GITHUB RELEASE
  # ==========================================================
  release:
    name: "08 - Create GitHub Release"
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: needs.build.outputs.success == 'true'
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Prepare Release Artifacts"
        run: |
          mkdir -p release_artifacts
          if [ -n "${{ needs.build.outputs.apk_path }}" ] && [ -f "${{ needs.build.outputs.apk_path }}" ]; then
            cp "${{ needs.build.outputs.apk_path }}" release_artifacts/
          fi
          if [ -n "${{ needs.build.outputs.aab_path }}" ] && [ -f "${{ needs.build.outputs.aab_path }}" ]; then
            cp "${{ needs.build.outputs.aab_path }}" release_artifacts/
          fi
          echo "📦 Release artifacts:"
          ls -la release_artifacts/

      - name: "Create Release Notes"
        run: |
          cat << 'EOF' > release_notes.md
          # 🚀 ${{ github.event.inputs.release_name }}
          
          ## 📱 Build Information
          - **App**: ${{ needs.validate.outputs.app_name }}
          - **Version**: ${{ needs.validate.outputs.app_version }}
          - **Build Number**: ${{ needs.validate.outputs.build_number }}
          - **Environment**: ${{ github.event.inputs.environment }}
          - **Build Type**: ${{ github.event.inputs.build_type }}
          
          ## 🏗️ Build Details
          - **Flutter**: ${{ env.FLUTTER_VERSION }}
          - **Java**: ${{ env.JAVA_VERSION }}
          
          ## 📦 Artifacts
          - **APK**: ✅ Available
          - **AAB**: ${{ github.event.inputs.build_type == 'appbundle' || github.event.inputs.build_type == 'both' && '✅ Available' || '❌ Not built' }}
          
          ## ✅ Build Status
          - **Build**: ✅ Success
          - **Tests**: ${{ github.event.inputs.run_tests == 'true' && '✅ Run' || '⏭️ Skipped' }}
          - **Signed**: ${{ github.event.inputs.environment == 'production' && '✅ Yes' || '⚠️ Debug' }}
          
          ## 📥 Download
          Download APK/AAB dari attachments di bawah ini.
          
          ---
          *Generated by GARSX Build Engine*
          EOF

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_name }}
          body_path: release_notes.md
          files: release_artifacts/*
          draft: false
          prerelease: ${{ github.event.inputs.environment == 'staging' }}
          generate_release_notes: true

  # ==========================================================
  # JOB 9: FINAL STATUS
  # ==========================================================
  final:
    name: "09 - Final Status"
    runs-on: ubuntu-latest
    needs: [validate, build, artifact, release]
    if: always()
    steps:
      - name: "Show Final Status"
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════╗"
          echo "║                                           ║"
          echo "║          ✅ BUILD COMPLETE                ║"
          echo "║                                           ║"
          echo "║          GARSX BUILD ENGINE               ║"
          echo "║                                           ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""
          echo "📊 Build Summary:"
          echo "  App: ${{ needs.validate.outputs.app_name }}"
          echo "  Version: ${{ needs.validate.outputs.app_version }}"
          echo "  Build Number: ${{ needs.validate.outputs.build_number }}"
          echo "  Environment: ${{ github.event.inputs.environment }}"
          echo "  Status: ${{ needs.build.outputs.success == 'true' && '✅ Success' || '❌ Failed' }}"
          echo ""
          echo "📦 Artifacts:"
          echo "  APK: ${{ needs.build.outputs.apk_path }}"
          echo "  AAB: ${{ needs.build.outputs.aab_path }}"
          echo ""
          echo "📥 Download:"
          echo "  - Artifact: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "  - Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.event.inputs.release_tag }}"
          echo ""
          echo "==========================================="
