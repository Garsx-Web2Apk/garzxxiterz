name: 🚀 GARSX Flutter Build Engine

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "Nama ZIP Flutter di repository"
        required: true
        default: "project.zip"

      release_tag:
        description: "Tag Release"
        required: true
        default: "v1.0.0"

      release_name:
        description: "Nama Release"
        required: true
        default: "GARSX Flutter Build"

permissions:
  contents: write

jobs:
  build:
    name: 🏗️ Build Flutter APK
    runs-on: ubuntu-latest

    steps:

      # ═══════════════════════════════════════
      # 1. CHECKOUT
      # ═══════════════════════════════════════

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ═══════════════════════════════════════
      # 2. JAVA
      # ═══════════════════════════════════════

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ═══════════════════════════════════════
      # 3. FLUTTER
      # ═══════════════════════════════════════

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 🔎 Flutter Version
        run: |
          flutter --version
          dart --version

      # ═══════════════════════════════════════
      # 4. ZIP TOOLS
      # ═══════════════════════════════════════

      - name: 📦 Install ZIP Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      # ═══════════════════════════════════════
      # 5. VALIDATE ZIP
      # ═══════════════════════════════════════

      - name: 🔍 Validate ZIP
        env:
          ZIP_FILE: ${{ github.event.inputs.zip_file }}
        run: |
          set -e

          echo "Checking ZIP: $ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "❌ ZIP tidak ditemukan!"
            echo ""
            echo "File yang tersedia:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          if ! unzip -t "$ZIP_FILE" >/dev/null; then
            echo "❌ ZIP rusak atau tidak valid!"
            exit 1
          fi

          echo "✅ ZIP valid."

      # ═══════════════════════════════════════
      # 6. EXTRACT
      # ═══════════════════════════════════════

      - name: 📂 Extract Flutter Project
        env:
          ZIP_FILE: ${{ github.event.inputs.zip_file }}
        run: |
          set -e

          rm -rf flutter_project
          mkdir -p flutter_project

          echo "📦 Extracting..."

          unzip -q "$ZIP_FILE" -d flutter_project

          echo "✅ Extract selesai."

      # ═══════════════════════════════════════
      # 7. AUTO DETECT PROJECT
      # ═══════════════════════════════════════

      - name: 🔎 Detect Flutter Project
        run: |
          set -e

          PROJECT_DIR=$(find flutter_project \
            -name "pubspec.yaml" \
            -type f \
            -not -path "*/.dart_tool/*" \
            -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ pubspec.yaml tidak ditemukan!"
            echo ""
            echo "Isi ZIP:"
            find flutter_project -maxdepth 3 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "╔══════════════════════════════════════╗"
          echo "║     ✅ FLUTTER PROJECT DETECTED      ║"
          echo "╚══════════════════════════════════════╝"
          echo ""
          echo "📂 $PROJECT_DIR"

      # ═══════════════════════════════════════
      # 8. FLUTTER DOCTOR
      # ═══════════════════════════════════════

      - name: 🩺 Flutter Doctor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter doctor -v

      # ═══════════════════════════════════════
      # 9. CLEAN
      # ═══════════════════════════════════════

      - name: 🧹 Flutter Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean

      # ═══════════════════════════════════════
      # 10. DEPENDENCIES
      # ═══════════════════════════════════════

      - name: 📚 Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      # ═══════════════════════════════════════
      # 11. ANALYZE
      # ═══════════════════════════════════════

      - name: 🔍 Flutter Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze --no-fatal-infos

      # ═══════════════════════════════════════
      # 12. BUILD APK
      # ═══════════════════════════════════════

      - name: 🏗️ Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "╔══════════════════════════════════════╗"
          echo "║        🚀 BUILDING APK...            ║"
          echo "╚══════════════════════════════════════╝"

          flutter build apk --release

      # ═══════════════════════════════════════
      # 13. FIND APK
      # ═══════════════════════════════════════

      - name: 🔎 Find APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "❌ APK tidak ditemukan!"
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "✅ APK ditemukan:"
          ls -lh "$APK"

      # ═══════════════════════════════════════
      # 14. PREPARE APK
      # ═══════════════════════════════════════

      - name: 📱 Prepare APK
        run: |
          set -e

          mkdir -p output

          cp "$APK_PATH" "output/GARSX-Build.apk"

          echo "╔══════════════════════════════════════╗"
          echo "║        📱 APK READY                  ║"
          echo "╚══════════════════════════════════════╝"

          ls -lh output/GARSX-Build.apk

      # ═══════════════════════════════════════
      # 15. UPLOAD ARTIFACT
      # ═══════════════════════════════════════

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-Build-APK
          path: output/GARSX-Build.apk
          if-no-files-found: error
          retention-days: 7

      # ═══════════════════════════════════════
      # 16. CREATE GITHUB RELEASE
      # ═══════════════════════════════════════

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_name }}
          body: |
            ## 🚀 GARSX Flutter Build

            ✅ Build berhasil

            📱 APK: GARSX-Build.apk

            🐦 Flutter: Stable
            🏗️ Build: Release
          files: output/GARSX-Build.apk
          draft: false
          prerelease: false

      # ═══════════════════════════════════════
      # 17. SUCCESS
      # ═══════════════════════════════════════

      - name: 🎉 Build Success
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════╗"
          echo "║           ✅ BUILD BERHASIL!              ║"
          echo "║            GARSX BUILD ENGINE             ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""
          echo "📦 ZIP        : ${{ github.event.inputs.zip_file }}"
          echo "📱 APK        : GARSX-Build.apk"
          echo "🏷️ Release    : ${{ github.event.inputs.release_tag }}"
          echo "🚀 Status     : READY"
          echo ""
          echo "✅ APK berhasil dikompilasi"
          echo "✅ APK berhasil di-upload"
          echo "✅ GitHub Release berhasil dibuat"
