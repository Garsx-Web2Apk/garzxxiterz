name: 🚀 GARSX Build Engine

# ============================================================
# 1. TRIGGER
# ============================================================
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: '📦 URL Download ZIP Project'
        required: true
        type: string
      tag:
        description: '🏷️ Tag Build'
        required: true
        type: string
      build_type:
        description: '📱 Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
      build_mode:
        description: '🔧 Build Mode'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - appbundle
          - both
      enable_signing:
        description: '✍️ Enable Signing'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      only_analyze:
        description: '🔍 Only Analyze'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

# ============================================================
# 2. PERMISSIONS
# ============================================================
permissions:
  contents: write
  packages: write

# ============================================================
# 3. ENVIRONMENT
# ============================================================
env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.22.0'
  GRADLE_OPTS: '-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g'

# ============================================================
# 4. JOB: BUILD
# ============================================================
jobs:
  build:
    name: 🛠️ Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # STEP 1: CHECKOUT
      # ============================================================
      - name: "01 - 📥 Checkout"
        uses: actions/checkout@v4

      # ============================================================
      # STEP 2: FREE DISK SPACE
      # ============================================================
      - name: "02 - 🧹 Free Disk Space"
        run: |
          sudo apt clean
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      # ============================================================
      # STEP 3: UPDATE SYSTEM
      # ============================================================
      - name: "03 - 🔧 Update System"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget unzip zip \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev \
            xz-utils

      # ============================================================
      # STEP 4: SETUP JAVA
      # ============================================================
      - name: "04 - ☕ Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      # ============================================================
      # STEP 5: SETUP ANDROID SDK
      # ============================================================
      - name: "05 - 📱 Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "06 - 📱 Install Android SDK"
        run: |
          echo "📱 Installing Android SDK..."
          sdkmanager "platform-tools" > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" > /dev/null 2>&1 || true
          yes | sdkmanager --licenses || true
          echo "✅ Android SDK installed"

      # ============================================================
      # STEP 6: SETUP FLUTTER
      # ============================================================
      - name: "07 - 🐦 Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: "08 - ✅ Verify Flutter"
        run: |
          flutter --version
          dart --version

      - name: "09 - ⚙️ Configure Flutter"
        run: |
          flutter config --enable-android
          flutter config --no-enable-web
          flutter config --no-enable-ios

      - name: "10 - 🩺 Flutter Doctor"
        run: |
          flutter doctor -v

      # ============================================================
      # STEP 7: DOWNLOAD & EXTRACT
      # ============================================================
      - name: "11 - 📦 Download Project"
        run: |
          echo "========================================="
          echo "📥 DOWNLOADING PROJECT..."
          echo "========================================="
          echo "URL: ${{ github.event.inputs.zip_url }}"
          echo "Tag: ${{ github.event.inputs.tag }}"
          echo "Type: ${{ github.event.inputs.build_type }}"
          echo "========================================="
          
          curl -L -o project.zip "${{ github.event.inputs.zip_url }}"
          
          if [ ! -f project.zip ]; then
            echo "❌ Download failed!"
            exit 1
          fi
          
          ls -lh project.zip

      - name: "12 - 🔍 Validate ZIP"
        run: |
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ ZIP corrupt!"
            exit 1
          fi
          echo "✅ ZIP valid"

      - name: "13 - 📂 Extract Project"
        run: |
          rm -rf project_raw
          mkdir -p project_raw
          unzip -q project.zip -d project_raw
          echo "✅ Extract selesai"
          ls -la project_raw/

      # ============================================================
      # STEP 8: DETECT PROJECT
      # ============================================================
      - name: "14 - 🔎 Detect Project Root"
        run: |
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "📂 Project root: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: "15 - ✅ Validate Flutter Project"
        run: |
          cd "$PROJECT_DIR"
          
          if [ ! -f "pubspec.yaml" ]; then
            echo "❌ pubspec.yaml tidak ditemukan!"
            exit 1
          fi
          
          if [ ! -d "lib" ]; then
            echo "❌ Folder lib tidak ditemukan!"
            exit 1
          fi
          
          echo "✅ pubspec.yaml ditemukan"
          echo "✅ lib/ ditemukan"
          head -20 pubspec.yaml

      # ============================================================
      # STEP 9: PREPARE BUILD
      # ============================================================
      - name: "16 - 🧹 Flutter Clean"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean || true
          rm -rf build .dart_tool

      - name: "17 - 📦 Get Dependencies (Retry 3x)"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          for i in {1..3}; do
            echo "🔄 Attempt $i..."
            flutter pub get && break
            echo "⏳ Retry $i ..."
            sleep 5
          done
          echo "✅ Dependencies installed"

      - name: "18 - 🔍 Flutter Analyze"
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos || echo "⚠️ Ada warning"

      # ============================================================
      # STEP 10: STOP IF ANALYZE ONLY
      # ============================================================
      - name: "19 - 🛑 Stop if Only Analyze"
        if: github.event.inputs.only_analyze == 'true'
        run: |
          echo "✅ Analyze only mode, stopping..."
          exit 0

      # ============================================================
      # STEP 11: BUILD APK
      # ============================================================
      - name: "20 - 🔨 Build APK"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========================================="
          echo "🔨 BUILDING APK..."
          echo "========================================="
          echo "📱 Type: ${{ github.event.inputs.build_type }}"
          echo "========================================="
          
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi
          
          echo "✅ Build selesai"

      # ============================================================
      # STEP 12: BUILD APP BUNDLE
      # ============================================================
      - name: "21 - 📦 Build App Bundle"
        if: github.event.inputs.build_mode == 'appbundle' || github.event.inputs.build_mode == 'both'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========================================="
          echo "📦 BUILDING APP BUNDLE (AAB)..."
          echo "========================================="
          
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build appbundle --debug
          else
            flutter build appbundle --release
          fi
          
          echo "✅ App Bundle selesai"

      # ============================================================
      # STEP 13: FIND APK
      # ============================================================
      - name: "22 - 🔎 Find APK"
        run: |
          APK_PATH=$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" -name "*.apk" -type f 2>/dev/null | head -1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan!"
            exit 1
          fi
          
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "✅ APK ditemukan:"
          ls -lh "$APK_PATH"

      # ============================================================
      # STEP 14: FIND AAB
      # ============================================================
      - name: "23 - 🔎 Find AAB"
        if: github.event.inputs.build_mode == 'appbundle' || github.event.inputs.build_mode == 'both'
        run: |
          AAB_PATH=$(find "$PROJECT_DIR/build/app/outputs/bundle/release" -name "*.aab" -type f 2>/dev/null | head -1)
          
          if [ -n "$AAB_PATH" ]; then
            echo "AAB_PATH=$AAB_PATH" >> $GITHUB_ENV
            echo "✅ AAB ditemukan:"
            ls -lh "$AAB_PATH"
          fi

      # ============================================================
      # STEP 15: VERIFY APK
      # ============================================================
      - name: "24 - ✅ Verify APK"
        run: |
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan!"
            exit 1
          fi
          
          APK_SIZE_BYTES=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null)
          
          if [ -z "$APK_SIZE_BYTES" ] || [ "$APK_SIZE_BYTES" -le 0 ]; then
            echo "❌ APK kosong!"
            exit 1
          fi
          
          echo "✅ APK valid"
          echo "📦 Size: $((APK_SIZE_BYTES/1024/1024)) MB"

      # ============================================================
      # STEP 16: SIGN APK (OPSIONAL)
      # ============================================================
      - name: "25 - ✍️ Sign APK"
        if: github.event.inputs.enable_signing == 'true'
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "✍️ Signing APK..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            
            jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
              -keystore keystore.jks \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.KEY_PASSWORD }}" \
              "$APK_PATH" "${{ secrets.KEY_ALIAS }}"
            
            echo "✅ APK signed"
          else
            echo "⚠️ No keystore found, skipping signing"
          fi

      # ============================================================
      # STEP 17: PREPARE ARTIFACT
      # ============================================================
      - name: "26 - 📱 Prepare Artifacts"
        run: |
          mkdir -p output
          
          cp "$APK_PATH" "output/GARSX-APP.apk"
          echo "✅ APK: output/GARSX-APP.apk"
          
          if [ -n "$AAB_PATH" ]; then
            cp "$AAB_PATH" "output/GARSX-APP.aab"
            echo "✅ AAB: output/GARSX-APP.aab"
          fi
          
          # SHA256
          sha256sum "output/GARSX-APP.apk" > "output/GARSX-APP.apk.sha256"
          if [ -n "$AAB_PATH" ]; then
            sha256sum "output/GARSX-APP.aab" > "output/GARSX-APP.aab.sha256"
          fi
          
          # Build Info
          cat > output/build-info.txt << EOF
          ════════════════════════════════════════
             GARSX BUILD REPORT
          ════════════════════════════════════════
          
          📱 BUILD INFO
          ──────────────────────────────────────
          Status: ✅ SUCCESS
          Type: ${{ github.event.inputs.build_type }}
          Mode: ${{ github.event.inputs.build_mode }}
          Tag: ${{ github.event.inputs.tag }}
          Signed: ${{ github.event.inputs.enable_signing }}
          
          📦 APK INFO
          ──────────────────────────────────────
          File: GARSX-APP.apk
          Size: $(du -h output/GARSX-APP.apk | cut -f1)
          SHA256: $(cat output/GARSX-APP.apk.sha256 | cut -d' ' -f1)
          
          📦 AAB INFO
          ──────────────────────────────────────
          File: GARSX-APP.aab
          Size: $(du -h output/GARSX-APP.aab | cut -f1)
          SHA256: $(cat output/GARSX-APP.aab.sha256 | cut -d' ' -f1)
          
          🔗 REPOSITORY
          ──────────────────────────────────────
          Repo: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Run: ${{ github.run_id }}
          
          ⏱️ TIMESTAMP
          ──────────────────────────────────────
          Build: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          ════════════════════════════════════════
          EOF
          
          cat output/build-info.txt

      # ============================================================
      # STEP 18: UPLOAD ARTIFACT
      # ============================================================
      - name: "27 - 📤 Upload Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: GARSX-Build-${{ github.event.inputs.tag }}
          path: output/*
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # STEP 19: SUCCESS
      # ============================================================
      - name: "28 - 🎉 Build Success"
        if: success()
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════╗"
          echo "║           ✅ BUILD BERHASIL!              ║"
          echo "║            GARSX BUILD ENGINE             ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""
          echo "📱 APK        : GARSX-APP.apk ($(du -h output/GARSX-APP.apk | cut -f1))"
          if [ -f "output/GARSX-APP.aab" ]; then
            echo "📦 AAB        : GARSX-APP.aab ($(du -h output/GARSX-APP.aab | cut -f1))"
          fi
          echo "🏷️ Tag        : ${{ github.event.inputs.tag }}"
          echo "📱 Build Type : ${{ github.event.inputs.build_type }}"
          echo "✍️ Signed     : ${{ github.event.inputs.enable_signing }}"
          echo ""
          echo "📥 Download dari Artifacts tab"

      # ============================================================
      # STEP 20: FAILURE
      # ============================================================
      - name: "29 - ❌ Build Failed"
        if: failure()
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════╗"
          echo "║           ❌ BUILD GAGAL!                ║"
          echo "║            GARSX BUILD ENGINE             ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""
          echo "🔍 Periksa log di atas untuk detail error."

      # ============================================================
      # STEP 21: CLEANUP
      # ============================================================
      - name: "30 - 🧹 Cleanup"
        if: always()
        continue-on-error: true
        run: |
          echo "🧹 Cleaning up..."
          rm -rf project_raw
          rm -rf project.zip
          rm -rf ~/.pub-cache 2>/dev/null || true
          rm -rf ~/.gradle 2>/dev/null || true
          echo "✅ Cleanup completed"
