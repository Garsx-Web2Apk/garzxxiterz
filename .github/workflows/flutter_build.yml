name: Build Flutter APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_url:
        description: 'Release URL'
        required: true
        type: string
      tag:
        description: 'Release Tag'
        required: true
        type: string
      build_type:
        description: 'Build Type'
        required: true
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          
      - name: Download ZIP from release
        run: |
          echo "📥 Downloading from: ${{ github.event.inputs.release_url }}"
          curl -L -o project.zip "${{ github.event.inputs.release_url }}"
          
          if [ ! -f project.zip ]; then
            echo "❌ Download failed!"
            exit 1
          fi
          
          ls -lh project.zip
          unzip project.zip -d project/
          ls -la project/
          
      - name: Flutter Clean
        run: |
          cd project/
          flutter clean || true
          
      - name: Flutter Pub Get
        run: |
          cd project/
          flutter pub get
          
      - name: Build APK
        run: |
          cd project/
          echo "🔨 Building APK..."
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi
          
      - name: List APK Files
        run: |
          echo "📱 Searching APK files..."
          find project/build -name "*.apk" -type f || echo "❌ No APK found"
          ls -la project/build/app/outputs/flutter-apk/ || echo "❌ Directory not found"
          
          APK_COUNT=$(find project/build -name "*.apk" -type f | wc -l)
          echo "📊 Total APK: $APK_COUNT"
          
          if [ $APK_COUNT -eq 0 ]; then
            echo "❌ No APK generated!"
            exit 1
          fi
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-files
          path: project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          
      - name: Success
        run: |
          echo "========================================="
          echo "✅ BUILD SUCCESSFUL!"
          echo "========================================="
          echo "📱 APK uploaded to artifacts"
          echo "🔗 Check Artifacts tab for download"
          echo "========================================="
